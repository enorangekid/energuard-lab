<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>블로그 분석 | ENERGUARD LAB</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="common.css?v=20260727-blogrank1">
  <style>
    :root {
      --dark: #05070b;
      --ink: #07111f;
      --sub: #667085;
      --muted: #98a2b3;
      --line: #e8ecf2;
      --line-strong: #dfe4ec;
      --bg: #f5f7fa;
      --panel: #fff;
      --soft: #f8fafc;
      --accent: #e85d2f;
      --accent-dark: #d04420;
      --accent-tint: #fdeee7;
      --accent-soft: #fff0e9;
      --green: #16a34a;
      --green-soft: #eaf8ef;
      --danger: #e32636;
      --danger-soft: #fdebec;
      --good: #0f9f6e;
      --bad: #dc2626;
      --dark-tint: #eef0f3;
      --radius: 6px;
      --font-main: "Pretendard Variable", Pretendard, -apple-system, sans-serif;
      --font-mono: "JetBrains Mono", "Fira Code", monospace;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-main);
      font-size: 14px;
      line-height: 1.55;
    }
    button, input, select { font: inherit; }
    button { color: inherit; }

    body > main.wrap {
      max-width: 1180px;
      margin: 0 auto;
      padding: 64px 0 80px;
    }

    .page-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 30px;
      position: relative;
    }
    .mode-title-tabs {
      display: inline-flex;
      align-items: center;
      gap: 28px;
    }
    .mode-title-tab {
      position: relative;
      display: inline-flex;
      align-items: center;
      height: 34px;
      padding: 0 0 8px;
      border: 0;
      background: transparent;
      color: #aeb6c4;
      font-family: inherit;
      font-size: 21px;
      line-height: normal;
      font-weight: 900;
      text-decoration: none;
      cursor: pointer;
    }
    .mode-title-tab:not(.active):hover { color: #7f8795; }
    .mode-title-tab + .mode-title-tab::before {
      content: "";
      position: absolute;
      left: -15px;
      top: 4px;
      width: 1px;
      height: 18px;
      background: #d8dde6;
    }
    .mode-title-text {
      display: inline-flex;
      align-items: center;
      gap: 12px;
    }
    .mode-label {
      position: relative;
      display: inline-flex;
      align-items: center;
    }
    .mode-title-tab.active { color: var(--ink); }
    .mode-title-tab.active .mode-label::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -13px;
      height: 3px;
      border-radius: 999px;
      background: var(--accent);
    }
    .mode-help {
      width: 18px;
      height: 18px;
      border: 1px solid var(--line-strong);
      border-radius: 50%;
      background: #f4f6f9;
      color: #8a93a5;
      font-size: 12px;
      font-weight: 900;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .setup-note {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      min-height: 48px;
      margin-bottom: 24px;
      padding: 11px 14px;
      border: 1px solid #f4c4ae;
      border-radius: var(--radius);
      background: #fff8f4;
      color: #7a3d26;
      font-size: 12.5px;
    }
    .setup-note.show { display: flex; }
    .setup-note strong { color: var(--accent); }

    .blog-view[hidden] {
      display: none !important;
    }

    .blog-diagnosis-stack {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .rank-sub-tabs {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .rank-sub-tabs .store-select > span:first-child {
      display: inline-flex;
      align-items: center;
      line-height: 1;
    }
    .rank-sub-view[hidden] { display: none !important; }

    /* ── 블로그 진단 요약 대시보드 — 매출분석의 .rank-dash/.dash-tile 구조를 그대로 옮겨온 것 ── */
    .rank-dash {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      padding: 16px 18px 14px;
      box-shadow: 0 14px 34px rgba(5, 7, 11, .05);
    }
    .rank-dash-tiles {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
    }
    .dash-tile { padding: 4px 2px; min-width: 0; }
    .dash-tile + .dash-tile { border-left: 1px solid var(--line); padding-left: 14px; }
    .dash-label { display: flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 800; color: #8a93a5; white-space: nowrap; }
    .dash-value {
      margin-top: 2px; font-size: 21px; font-weight: 800; color: var(--ink);
      font-variant-numeric: tabular-nums; letter-spacing: -0.01em; white-space: nowrap;
    }
    .dash-value.up { color: #16a34a; }
    .dash-value.down { color: var(--danger); }
    .dash-value small { margin-left: 4px; font-size: 11.5px; font-weight: 700; color: var(--sub); }
    .dash-info {
      position: relative;
      width: 14px; height: 14px; flex-shrink: 0;
      display: inline-flex; align-items: center; justify-content: center;
      border: 1px solid var(--line-strong); border-radius: 50%;
      background: #f4f6f9; color: #8a93a5;
      font-size: 9.5px; font-weight: 900; cursor: default; line-height: 1;
    }
    .dash-tip {
      position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(3px);
      z-index: 60; width: max-content; max-width: 230px;
      padding: 8px 11px; border-radius: 6px;
      background: #161a22; color: #fff;
      font-size: 11.5px; font-weight: 600; line-height: 1.5; text-align: left; white-space: normal;
      opacity: 0; visibility: hidden; transition: all .12s; pointer-events: none;
    }
    .dash-info:hover .dash-tip { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
    .metric-cmp { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .metric-cmp .cmp {
      display: inline-flex; align-items: center; gap: 2px; font-size: 10.5px; font-weight: 800;
      padding: 1px 6px; border-radius: 8px; background: var(--dark-tint); color: var(--sub); white-space: nowrap;
    }
    .metric-cmp .cmp.up { color: var(--good); background: #e7f6ec; }
    .metric-cmp .cmp.down { color: var(--bad); background: #fdecec; }
    .metric-cmp .cmp.alert { color: #fff; background: var(--bad); }
    @media (max-width: 900px) {
      .rank-dash-tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); row-gap: 14px; }
      .dash-tile:nth-child(4) { border-left: none; padding-left: 2px; }
    }

    /* ── 1페이지/2~3페이지/4페이지 이하 비율 바 — 랭킹추적 .rank-dash 그대로 ── */
    .dash-bar-wrap { margin-top: 14px; }
    .dash-bar { display: flex; gap: 2px; height: 12px; }
    .dash-bar-seg { min-width: 3px; }
    .dash-bar-seg:first-child { border-radius: 6px 0 0 6px; }
    .dash-bar-seg:last-child { border-radius: 0 6px 6px 0; }
    .dash-bar-seg:only-child { border-radius: 6px; }
    .dash-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 8px; font-size: 11.5px; color: var(--sub); font-weight: 700; }
    .dash-legend-item { display: inline-flex; align-items: center; gap: 5px; }
    .dash-legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .dash-legend-item b { color: var(--ink); font-weight: 800; }

    /* ── 순위 변동/이탈 카드 — 랭킹추적 .summary-top3-card/.summary-mover-row 그대로 ── */
    .summary-top3-row-wrap { display: flex; gap: 14px; flex-wrap: wrap; }
    .summary-mover-grid .summary-top3-card { flex: 1 1 260px; }
    .summary-top3-card { flex: 1 1 260px; min-width: 240px; border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }
    .summary-top3-title { font-size: 12px; font-weight: 800; color: var(--sub); margin-bottom: 12px; }
    /* "지표 추이" 차트 — sales-analysis.html 일별매출 그래프(.vol-chart-wrap/.vol-tip)와 동일 스타일 */
    .vol-chart-wrap { position: relative; padding: 14px 16px 18px; border-bottom: 1px solid var(--line); }
    .vol-chart-wrap svg { display: block; width: 100%; height: auto; }
    [id^="metricTrendBody-"] .vol-chart-wrap { border-bottom: none; padding-bottom: 0; }
    .vol-tip {
      position: absolute; top: 6px; transform: translateX(-50%);
      padding: 5px 10px; border-radius: 6px;
      background: #161a22; color: #fff;
      font-size: 12px; font-weight: 700; font-family: var(--font-mono, monospace);
      white-space: nowrap; pointer-events: none; z-index: 10;
    }
    .period-select {
      height: 32px; border: 1.5px solid var(--line); border-radius: 4px; padding: 0 8px;
      font-family: inherit; font-size: 12px; font-weight: 700; color: var(--ink); background: #fff;
    }
    .summary-top3-rank {
      flex: 0 0 auto; width: 20px; height: 20px; border-radius: 50%; background: var(--dark-tint);
      display: inline-flex; align-items: center; justify-content: center;
      font-family: var(--font-mono); font-size: 11px; font-weight: 800; color: var(--sub);
    }
    .summary-top3-name {
      flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-size: 13px; font-weight: 700; color: inherit; text-decoration: none;
    }
    a.summary-top3-name:hover { color: var(--accent); text-decoration: underline; }
    .summary-mover-row { padding: 9px 0; border-bottom: 1px solid #f4f5f7; }
    .summary-mover-row:last-child { border-bottom: none; }
    .summary-mover-row-main { display: flex; align-items: center; gap: 8px; }
    .summary-mover-row-detail { margin-top: 4px; padding-left: 28px; font-size: 11.5px; color: var(--sub); font-family: var(--font-mono); }
    .summary-mover-delta { flex: 0 0 auto; margin-left: auto; font-family: var(--font-mono); font-size: 12px; font-weight: 800; white-space: nowrap; }
    .summary-mover-delta.up { color: #16a34a; }
    .summary-mover-delta.down { color: var(--danger); }
    .summary-mover-row-detail.dropout-keywords { display: flex; flex-wrap: wrap; gap: 6px; font-family: inherit; }
    .dropout-keyword-chip {
      display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 20px;
      background: #fdecec; color: var(--danger); font-size: 11px; font-weight: 700; white-space: nowrap;
    }
    .dropout-keyword-rank { font-family: var(--font-mono); font-weight: 700; color: var(--sub); }
    .summary-top3-more {
      display: flex; align-items: center; justify-content: center; gap: 4px; width: 100%;
      margin-top: 10px; padding: 10px 0 0; border: 0; border-top: 1px solid #f4f5f7; background: transparent;
      color: var(--sub); font-family: inherit; font-size: 12px; font-weight: 800; cursor: pointer;
    }
    .summary-top3-more:hover { color: var(--accent); }
    .recent-post-more-wrap {
      display: flex;
      justify-content: center;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #f4f5f7;
    }

    /* ── 최근 게시글 진단 — 랭킹추적 "추적 상품" 카드(.product-group/.item-main-row/.item-detail/
       .expand-btn)의 사이즈·색상·간격을 값 그대로 가져옴(공용 변수도 rank-tracker와 동일하게
       --line/--accent/--accent-tint/--accent-dark/--dark-tint 재사용). 모달 대신 행을 펼치면
       그 안에 진단 상세(글자수/사진/댓글/상위노출 키워드)가 나온다. */
    .post-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      transition: border-color .14s, box-shadow .14s;
    }
    .post-card:hover { border-color: var(--line-strong); box-shadow: 0 10px 24px rgba(5, 7, 11, 0.06); }
    .post-card.open { border-color: #f0b79d; box-shadow: 0 12px 28px rgba(232, 93, 47, 0.08); }
    /* 랭킹추적 .product-group.checked(중요 체크)와 동일한 외곽선 처리 — 자가진단에서 누락으로
       뜬 포스팅을 카드 자체로도 바로 눈에 띄게 한다. */
    .post-card.missing { border-color: #f0b79d; background: #fffaf7; box-shadow: 0 12px 28px rgba(232, 93, 47, 0.1); }
    .post-card + .post-card { margin-top: 10px; }
    .post-main-row {
      display: grid;
      grid-template-columns: 38px 86px minmax(180px, 1fr) 132px 82px 58px 96px 124px;
      align-items: center;
      min-height: 76px;
      padding: 10px 14px;
      border-radius: calc(var(--radius) - 1px);
      cursor: pointer;
    }
    .post-main-row:hover { background: #fafbfc; }
    .post-card.open .post-main-row { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
    .post-main-row.head-row {
      cursor: default;
      background: #fafbfc;
      color: #8a93a5;
      font-size: 11.5px;
      font-weight: 800;
      text-align: center;
      border: 1px solid var(--line);
      margin-bottom: 10px;
      min-height: 0;
      padding: 9px 14px;
    }
    .post-main-row.head-row span:nth-child(3) { text-align: center; }
    .expand-btn {
      width: 24px;
      height: 24px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: #fafbfc;
      color: var(--sub);
      font-size: 14px;
      font-weight: 800;
      line-height: 1;
      cursor: pointer;
      flex-shrink: 0;
    }
    .expand-btn:hover,
    .post-card.open .expand-btn { border-color: var(--accent); background: var(--accent-tint); color: var(--accent-dark); }
    .post-card.open .expand-btn::before { content: "-"; }
    .expand-btn::before { content: "+"; }
    .post-thumb.lg, .post-thumb-link.lg { width: 56px; height: 56px; justify-self: center; }
    .post-detail { display: none; border-top: 1px solid var(--line); background: #fffaf7; border-radius: 0 0 var(--radius) var(--radius); padding: 14px 16px 16px; }
    .post-card.open .post-detail { display: block; }
    .post-detail-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .recent-post-title {
      min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      color: var(--ink); font-size: 14px; font-weight: 800; text-decoration: none;
    }
    .recent-post-title:hover { color: var(--accent-dark); text-decoration: underline; text-underline-offset: 3px; }
    .post-info { min-width: 0; padding-right: 12px; }
    .post-sub { margin-top: 3px; font-size: 11.5px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .post-sub .post-date-inline { font-family: var(--font-mono); font-weight: 800; color: #687386; }
    .post-sub .post-score-inline { font-family: var(--font-mono); font-weight: 800; color: var(--accent-dark); }
    .post-score-cell {
      justify-self: center;
      min-width: 64px;
      padding: 5px 8px;
      border-radius: var(--radius);
      background: #f1f3f7;
      color: #69758a;
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 800;
      text-align: center;
      white-space: nowrap;
    }
    .post-score-cell.empty {
      background: #f7f8fa;
      color: #a9b3c3;
      font-weight: 800;
    }
    /* score-dash-grade(포스팅 상세의 종합분석평가 등급 배지)와 같은 톤 — 보통/우수/최상 */
    .post-score-cell.good { background: #eaf8ef; color: #128044; }
    .post-score-cell.best { background: var(--accent-tint); color: var(--accent-dark); }
    /* 랭킹추적 .main-keyword-cell과 같은 알약 배지 — 상위노출 키워드 하나만 표기 */
    .post-keyword-pill { text-align: center; font-size: 12.5px; font-weight: 900; color: var(--ink); }
    .post-keyword-pill span {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 64px; max-width: 100%; padding: 4px 10px; border-radius: 999px;
      background: #f7f8fa; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    /* 랭킹추적 .rank-badge와 같은 톤 — 현재순위 전용 */
    .post-rank-badge {
      justify-self: center; min-width: 64px; text-align: center; padding: 5px 8px;
      border-radius: var(--radius); background: var(--accent-tint); color: var(--accent-dark);
      font-family: var(--font-mono); font-size: 13px; font-weight: 800;
    }
    .post-rank-badge.empty { background: #f7f8fa; color: #b0b8c5; font-family: var(--font-main); font-size: 11.5px; font-weight: 700; }
    .post-actions { display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
    .missing-badge {
      display: inline-flex;
      align-items: center;
      height: 22px;
      margin-left: 7px;
      padding: 0 8px;
      border-radius: 999px;
      background: var(--accent-tint);
      color: var(--accent-dark);
      font-size: 11px;
      font-weight: 900;
      vertical-align: 1px;
      white-space: nowrap;
    }
    .row-btn.has-memo,
    .row-btn.has-memo:hover {
      border-color: #f0b79d;
      background: var(--accent-tint);
      color: var(--accent-dark);
    }

    .diagnosis-refresh-btn {
      flex-shrink: 0;
      height: 34px;
      padding: 0 14px;
      border: 1px solid var(--line-strong);
      border-radius: 4px;
      background: #fff;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }
    .diagnosis-refresh-btn:hover { border-color: #aeb6c4; background: #f5f7fa; }

    /* ── 노출 현황 진단 — 키워드 검색 결과(노출중) / 미노출 키워드 목록 ── */
    .exposure-list { display: flex; flex-direction: column; gap: 10px; }
    .exposure-card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      overflow: hidden;
      box-shadow: 0 14px 34px rgba(5, 7, 11, 0.05);
    }
    .exposure-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 20px 20px 16px;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }
    .exposure-card-title-wrap {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }
    .exposure-card-title {
      color: var(--ink);
      font-size: 15px;
      font-weight: 800;
    }
    .exposure-card-subtitle {
      color: var(--sub);
      font-size: 12px;
      font-weight: 600;
    }
    .exposure-card-body { padding: 20px; }
    .exposure-keyword-panel {
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }
    .exposure-keyword-panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }
    .exposure-keyword-title {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--ink);
      font-size: 13px;
      font-weight: 800;
    }
    .exposure-count-pill {
      display: inline-flex;
      align-items: center;
      height: 22px;
      padding: 0 9px;
      border-radius: 999px;
      background: #eef1f6;
      color: var(--ink);
      font-size: 11px;
      font-weight: 900;
    }
    .exposure-keyword-groups {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 0;
    }
    .exposure-keyword-group-label {
      margin-bottom: 8px;
      color: #8a93a5;
      font-size: 11.5px;
      font-weight: 800;
    }
    .exposure-keyword-chips {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 6px;
    }
    .exposure-monitor-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-width: 0;
      height: 34px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: #fff;
      color: var(--ink);
      font-size: 12px;
      font-weight: 700;

    .keyword-rank-item + .keyword-rank-item { border-top: 0; }

  return [...blogs].sort((a, b) => {
    const ai = COMPETITOR_BLOG_ORDER.indexOf(a.blog_id);
    const bi = COMPETITOR_BLOG_ORDER.indexOf(b.blog_id);
    const ao = ai === -1 ? 999 : ai;
    const bo = bi === -1 ? 999 : bi;
    return ao - bo || String(a.blog_name || a.blog_id).localeCompare(String(b.blog_name || b.blog_id), "ko");
  });
}

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[char]);
}

function competitorPostKeywordHtml(blogId, logNo, title) {
  const savedKeywords = activePostKeywordsForPost(blogId, logNo)
    .map(row => String(row.keyword || "").trim())
    .filter(Boolean);
  const uniqueKeywords = [...new Set(savedKeywords)];
  if (!uniqueKeywords.length) return `<span class="competitor-keyword-empty">-</span>`;
  const visibleKeywords = uniqueKeywords.slice(0, 5);
  const extraCount = uniqueKeywords.length - visibleKeywords.length;
  const titleText = uniqueKeywords.join(", ");
  return `${visibleKeywords.map(keyword => `<span class="competitor-keyword-chip" title="${esc(titleText)}">${esc(keyword)}</span>`).join("")}${extraCount > 0 ? `<span class="competitor-keyword-chip" title="${esc(titleText)}">+${extraCount}</span>` : ""}`;
}

function postTime(post) {
  const time = new Date(post?.published_at || "").getTime();
  return Number.isFinite(time) ? time : 0;
}

function daysSincePost(post) {
  const time = postTime(post);
  if (!time) return null;
  return Math.max(0, Math.floor((Date.now() - time) / 86400000));
}

function competitorKeywordRows(posts) {
  const postKeys = new Set(posts.map(post => `${post.blog_id}::${post.log_no}`));
  return state.postKeywords.filter(row => row.active !== false && postKeys.has(`${row.blog_id}::${row.log_no}`));
}

function keywordStats(rows) {
  const map = new Map();
  rows.forEach(row => {
    const keyword = String(row.keyword || "").trim();
    if (!keyword) return;
    const current = map.get(keyword) || { keyword, count: 0, blogs: new Set(), posts: new Set() };
    current.count += 1;
    current.blogs.add(row.blog_id);
    current.posts.add(`${row.blog_id}::${row.log_no}`);
    map.set(keyword, current);
  });
  return [...map.values()]
    .map(item => ({ keyword: item.keyword, count: item.count, blogCount: item.blogs.size, postCount: item.posts.size }))
    .sort((a, b) => b.postCount - a.postCount || b.blogCount - a.blogCount || a.keyword.localeCompare(b.keyword, "ko"));
}

function showToast(message) {
  const toast = document.getElementById("toast");
  toast.textContent = message;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 2400);
}

async function callApi(action, payload = {}) {
  const response = await fetch(BLOG_RANK_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      apikey: SUPABASE_ANON_KEY,
      Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
    },
    body: JSON.stringify({ action, ...payload }),
  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok || data.error) throw new Error(data.error || `요청 실패 (${response.status})`);
  return data;
}

function sbHeaders(extra = {}) {
  return {
    apikey: SUPABASE_ANON_KEY,
    Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
    "Content-Type": "application/json",
    ...extra,
  };
}

function nowMemoDate() {
  const kst = new Date(Date.now() + 9 * 60 * 60 * 1000);
  return kst.toISOString().slice(0, 16).replace("T", " ");
}

function parseMemos(value) {
  if (Array.isArray(value)) return value;
  if (!value) return [];
  try {
    const parsed = JSON.parse(value);
    return Array.isArray(parsed) ? parsed : [];
  } catch (_) {
    return [];
  }
}

function postKey(blogId, logNo) {
  return `${blogId}::${logNo}`;
}

function localPostMemoStorageKey(blogId, logNo) {
  return `blog-rank-post-memo:${blogId}:${logNo}`;
}

function findPost(blogId, logNo) {
  return state.posts.find(post => post.blog_id === blogId && post.log_no === logNo) || null;
}

function mergeLocalPostMemos() {
  state.posts = (state.posts || []).map(post => {
    if (post.memo) return post;
    const localMemo = localStorage.getItem(localPostMemoStorageKey(post.blog_id, post.log_no));
    return localMemo ? { ...post, memo: localMemo } : post;
  });
}

function postMemoTipHtml(post) {
  const memos = parseMemos(post?.memo);
  if (!memos.length) return "";
  return `<div class="post-memo-tip">${
    [...memos].slice(-3).reverse().map(memo => `
      <div class="post-memo-tip-item">
        <div class="post-memo-tip-date">${esc(memo.date || "")}</div>
        <div class="post-memo-tip-text">${esc(memo.text || "")}</div>
      </div>`).join("")
  }</div>`;
}

function renderPostMemoList(post) {
  const list = document.getElementById("postMemoList");
  const memos = parseMemos(post?.memo);
  if (!memos.length) {
    list.innerHTML = `<div class="empty-state" style="padding:12px 4px;font-size:12px;">아직 남긴 메모가 없습니다.</div>`;
    return;
  }
  list.innerHTML = [...memos].reverse().map((memo, reverseIndex) => {
    const originalIndex = memos.length - 1 - reverseIndex;
    return `<div class="memo-item">
      <div>
        <div class="memo-item-date">${esc(memo.date || "")}</div>
        <div class="memo-item-text">${esc(memo.text || "")}</div>
      </div>
      <button type="button" class="memo-delete" onclick="deletePostMemo(${originalIndex})">삭제</button>
    </div>`;
  }).join("");
}

function openPostMemoModal(event, blogId, logNo) {
  event.stopPropagation();
  const post = findPost(blogId, logNo);
  if (!post) return;
  postMemoTarget = { blogId, logNo };
  document.getElementById("postMemoModalSub").textContent = post.title || logNo;
  document.getElementById("postMemoInput").value = "";
  renderPostMemoList(post);
  document.getElementById("postMemoModal").classList.add("open");
  document.getElementById("postMemoModal").setAttribute("aria-hidden", "false");
}

function closePostMemoModal() {
  postMemoTarget = null;
  document.getElementById("postMemoModal").classList.remove("open");
  document.getElementById("postMemoModal").setAttribute("aria-hidden", "true");
}

async function savePostMemo(post, memos) {
  const memoJson = JSON.stringify(memos);
  localStorage.setItem(localPostMemoStorageKey(post.blog_id, post.log_no), memoJson);
  const response = await fetch(`${SUPABASE_URL}/rest/v1/blog_rank_posts?blog_id=eq.${encodeURIComponent(post.blog_id)}&log_no=eq.${encodeURIComponent(post.log_no)}`, {
    method: "PATCH",
    headers: sbHeaders({ Prefer: "return=minimal" }),
    body: JSON.stringify({ memo: memoJson }),
  });
  if (!response.ok) {
    const text = await response.text().catch(() => "");
    throw new Error(text || "메모 저장에 실패했습니다.");
  }
}

async function addPostMemo() {
  const target = postMemoTarget;
  const input = document.getElementById("postMemoInput");
  const text = input.value.trim();
  if (!target || !text) return;
  const post = findPost(target.blogId, target.logNo);
  if (!post) return;
  const memos = [...parseMemos(post.memo), { date: nowMemoDate(), text }];
  post.memo = JSON.stringify(memos);
  input.value = "";
  renderPostMemoList(post);
  renderDiagnosis();
  renderRankList();
  try {
    await savePostMemo(post, memos);
  } catch (error) {
    showToast("메모는 이 브라우저에 저장했습니다. Supabase 컬럼 반영 후 서버 저장됩니다.");
  }
}

async function deletePostMemo(index) {
  const target = postMemoTarget;
  if (!target) return;
  const post = findPost(target.blogId, target.logNo);
  if (!post) return;
  const memos = parseMemos(post.memo);
  memos.splice(index, 1);
  post.memo = JSON.stringify(memos);
  renderPostMemoList(post);
  renderDiagnosis();
  renderRankList();
  try {
    await savePostMemo(post, memos);
  } catch (error) {
    showToast("메모는 이 브라우저에서 삭제했습니다. Supabase 컬럼 반영 후 서버 저장됩니다.");
  }
}

function histories(blogId, logNo, keyword, provider) {
  return state.history
    .filter(row => row.blog_id === blogId && row.log_no === logNo && row.keyword === keyword && row.provider === provider)
    .sort((a, b) => String(b.collected_at).localeCompare(String(a.collected_at)));
}

function latestPair(blogId, logNo, keyword, provider) {
  const rows = histories(blogId, logNo, keyword, provider);
  return [rows[0] || null, rows[1] || null];
}

function deltaInfo(current, previous) {
  if (!current) return { text: "-", cls: "neutral", amount: 0 };
  if (!current.found && previous?.found) return { text: "이탈", cls: "down", amount: -1 };
  if (current.found && previous && !previous.found) return { text: "진입", cls: "up", amount: 1 };
  if (current.rank == null || previous?.rank == null) return { text: "-", cls: "neutral", amount: 0 };
  const delta = Number(previous.rank) - Number(current.rank);
  if (delta > 0) return { text: `▲${delta}`, cls: "up", amount: delta };
  if (delta < 0) return { text: `▼${Math.abs(delta)}`, cls: "down", amount: delta };
  return { text: "-", cls: "neutral", amount: 0 };
}

function rankBadge(row, providerReady = true) {
  if (!providerReady) return `<span class="rank-badge empty">연결 전<span>API 키 필요</span></span>`;
  if (!row) return `<span class="rank-badge empty">-<span>수집 전</span></span>`;
  if (!row.found || row.rank == null) {
    const label = row.provider === "naver_blog_api"
      ? `${Number(row.checked_count || 0).toLocaleString()}위 밖`
      : `${Number(row.checked_count || 0).toLocaleString()}위까지 미노출`;
    return `<span class="rank-badge missing">미노출<span>${esc(label)}</span></span>`;
  }
  const sub = row.provider === "naver_blog_api" ? `${row.page || Math.ceil(row.rank / 10)}페이지` : "실제 화면";
  return `<span class="rank-badge">${Number(row.rank).toLocaleString()}위<span>${esc(sub)}</span></span>`;
}
function sparkline(blogId, logNo, keyword) {
  const rows = histories(blogId, logNo, keyword, "naver_blog_screen")
    .filter(row => row.rank != null)
    .slice(0, 7)
    .reverse();
  if (rows.length < 2) return `<div class="spark-empty">이력 부족</div>`;

  const values = rows.map(row => Number(row.rank));
  const min = Math.min(...values);
  const max = Math.max(...values);
  const range = Math.max(1, max - min);
  const points = values.map((value, index) => {
    const x = 5 + (132 * index / Math.max(1, values.length - 1));
    const y = 5 + ((value - min) / range) * 27;
    return [x, y];
  });
  const line = points.map(point => point.join(",")).join(" ");
  const area = `5,35 ${line} 137,35`;
  return `
    <svg class="sparkline" viewBox="0 0 142 38" aria-label="최근 순위 흐름">
      <line class="grid" x1="5" y1="35" x2="137" y2="35"></line>
      <polygon class="area" points="${area}"></polygon>
      <polyline class="line" points="${line}"></polyline>
    </svg>`;
}

function formatTime(value) {
  if (!value) return "-";
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return "-";
  return new Intl.DateTimeFormat("ko-KR", {
    month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit",
  }).format(date);
}

/* ── 이 글의 상위노출 키워드 순위 그래프 — 랭킹추적(rank-tracker.html)의
   filterTrendRows/hasEnoughTrendRange/renderTrendEmpty/renderMiniTrendSvg/renderTrendWrap을
   그대로 이식했다(로직 변경 없음). 데이터 모양만 이 앱의 blog_rank_history에 맞춰서 만들어 넣는다. */
function filterTrendRows(rows, range, valueKey) {
  const clean = rows.filter(row => row[valueKey] != null).sort((a, b) => a.date.localeCompare(b.date));
  if (!clean.length) return [];
  if (range === "week") return clean.slice(-7);
  if (range === "month1") {
    const last = new Date(clean[clean.length - 1].date);
    const from = new Date(last);
    from.setMonth(from.getMonth() - 1);
    return clean.filter(row => new Date(row.date) >= from);
  }
  if (range === "month6") {
    const last = new Date(clean[clean.length - 1].date);
    const from = new Date(last);
    from.setMonth(from.getMonth() - 6);
    return clean.filter(row => new Date(row.date) >= from);
  }
  if (range === "year") {
    const last = new Date(clean[clean.length - 1].date);
    const from = new Date(last);
    from.setFullYear(from.getFullYear() - 1);
    return clean.filter(row => new Date(row.date) >= from);
  }
  // "all" 등 나머지는 전체 그대로.
  return clean;
}

function hasEnoughTrendRange(rows, range) {
  if (range === "week" || range === "all") return rows.length >= 2;
  if (rows.length < 2) return false;
  const first = new Date(rows[0].date);
  const last = new Date(rows[rows.length - 1].date);
  const days = Math.round((last - first) / 86400000);
  if (range === "month1") return days >= 20;
  if (range === "month6") return days >= 150;
  if (range === "year") return days >= 330;
  return true;
}

function renderTrendEmpty(message, hint = "데이터가 쌓이면 자동으로 표시됩니다") {
  return `<div class="rank-trend-stage"><div class="rank-trend-empty">${esc(message)}<small>${esc(hint)}</small></div></div>`;
}

function renderMiniTrendSvg(rows, valueKey, formatter, invert = false, dropMarker = null) {
  if (rows.length < 2) {
    return renderTrendEmpty("표시할 데이터가 아직 부족합니다");
  }
  const showDrop = !!(dropMarker && dropMarker.date > rows[rows.length - 1].date);
  const slots = rows.length + (showDrop ? 1 : 0);
  const values = rows.map(row => Number(row[valueKey]));
  let min = Math.min(...values);
  let max = Math.max(...values);
  if (min === max) { min -= 1; max += 1; }
  const w = 760, h = 102, padX = 22, padY = 15;
  // x축은 인덱스가 아니라 실제 날짜에 비례해야 한다 — 안 그러면 (예: 예전엔 주 1회, 최근엔
  // 매일) 수집 간격이 들쭉날쭉할 때 실제로는 며칠 차이인 점들이 몇 주 차이인 점들과 같은
  // 폭으로 그려져서 그래프가 왜곡돼 보인다.
  const firstTime = new Date(rows[0].date).getTime();
  const lastTime = new Date(showDrop ? dropMarker.date : rows[rows.length - 1].date).getTime();
  const span = Math.max(1, lastTime - firstTime);
  const x = i => {
    const t = i < rows.length ? new Date(rows[i].date).getTime() : lastTime;
    return padX + (t - firstTime) / span * (w - padX * 2);
  };
  const y = v => {
    const t = (v - min) / (max - min);
    return invert ? padY + t * (h - padY * 2 - 14) : h - padY - 14 - t * (h - padY * 2 - 14);
  };
  const points = rows.map((row, i) => `${x(i)},${y(Number(row[valueKey]))}`).join(" ");
  const areaBase = h - padY - 14;
  const area = `${padX},${areaBase} ${points} ${w - padX},${areaBase}`;
  const labelSlots = rows.map((row, i) => ({ i, date: row.date }));
  if (showDrop) labelSlots.push({ i: rows.length, date: dropMarker.date, isDrop: true });
  // 항상 마지막 점을 강제로 라벨링 + 별도로 step 간격마다 라벨링하는 예전 방식은, 마지막 점이
  // 하필 step 간격 바로 옆(예: 24번째가 step으로 찍히고 25번째가 마지막이라 강제로 또 찍힘)일 때
  // 두 라벨이 거의 같은 x좌표에 겹쳐 보이는 문제가 있었다 — 그래서 "몇 개를 보여줄지"를 먼저
  // 정하고 그 개수만큼 인덱스 전체 구간에 고르게 분산시키는 방식으로 바꿨다(첫점·끝점은 항상 포함).
  const labelTarget = Math.min(6, labelSlots.length);
  const labelIndexSet = new Set();
  for (let k = 0; k < labelTarget; k++) {
    labelIndexSet.add(Math.round(k * (labelSlots.length - 1) / Math.max(1, labelTarget - 1)));
  }
  const labels = labelSlots.map(({ i, date, isDrop }, idx) => {
    if (!labelIndexSet.has(idx)) return "";
    return `<text class="trend-axis${isDrop ? " trend-axis-dropped" : ""}" x="${x(i)}" y="${h - 3}" text-anchor="middle">${esc(date.slice(5).replace("-", "."))}</text>`;
  }).join("");
  const dots = rows.map((row, i) => {
    const px = x(i);
    const py = y(Number(row[valueKey]));
    return `<circle class="trend-dot" cx="${px}" cy="${py}" r="4"></circle>`;
  }).join("");
  const hovers = rows.map((row, i) => {
    const px = x(i);
    const py = y(Number(row[valueKey]));
    const label = `${row.date.slice(5).replace("-", ".")} · ${formatter(Number(row[valueKey]))}`;
    const boxW = Math.max(72, Math.min(132, label.length * 8));
    const boxX = Math.min(Math.max(px - boxW / 2, 8), w - boxW - 8);
    const boxY = Math.max(4, py - 35);
    const hitLeft = i === 0 ? 0 : (x(i - 1) + px) / 2;
    const hitRight = i === rows.length - 1 ? (showDrop ? (px + x(rows.length)) / 2 : w) : (px + x(i + 1)) / 2;
    return `<g class="trend-point">
      <line class="trend-hover-line" x1="${px}" x2="${px}" y1="${padY}" y2="${areaBase}"></line>
      <circle class="trend-hover-dot" cx="${px}" cy="${py}" r="5"></circle>
      <g class="trend-tip">
        <rect class="trend-tip-box" x="${boxX}" y="${boxY}" width="${boxW}" height="24" rx="5" ry="5"></rect>
        <text class="trend-tip-text" x="${boxX + boxW / 2}" y="${boxY + 16}" text-anchor="middle">${esc(label)}</text>
      </g>
      <rect class="trend-hit-zone" x="${hitLeft}" y="0" width="${hitRight - hitLeft}" height="${h}"></rect>
    </g>`;
  }).join("");
  const dropHtml = showDrop ? (() => {
    const lastX = x(rows.length - 1);
    const lastY = y(Number(rows[rows.length - 1][valueKey]));
    const dropX = x(rows.length);
    return `<line class="trend-line-dropped" x1="${lastX}" y1="${lastY}" x2="${dropX}" y2="${lastY}"></line>
      <circle class="trend-dropped-marker" cx="${dropX}" cy="${lastY}" r="5"></circle>
      <text class="trend-dropped-tag" x="${dropX}" y="${Math.max(12, lastY - 10)}" text-anchor="middle">이탈</text>`;
  })() : "";
  return `<div class="rank-trend-stage"><svg class="rank-trend-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    <line class="trend-grid" x1="${padX}" x2="${w - padX}" y1="${padY}" y2="${padY}"></line>
    <line class="trend-grid" x1="${padX}" x2="${w - padX}" y1="${areaBase}" y2="${areaBase}"></line>
    <polygon class="trend-fill" points="${area}"></polygon>
    <polyline class="trend-line" points="${points}"></polyline>
    ${dropHtml}
    ${dots}
    ${labels}
    ${hovers}
  </svg></div>`;
}

// 지표마다 자연스러운 갱신 주기가 달라서(방문자=매일, 순위/유효키워드=주1회) 기간 토글
// 목록도 지표별로 다르게 줄 수 있게 ranges를 인자로 받는다 — 안 넘기면 기존 기본값 그대로.
const TREND_RANGES_DAILY = [
  { key: "week", label: "1주일" },
  { key: "month1", label: "1개월" },
  { key: "month6", label: "6개월" },
  { key: "year", label: "1년" },
];
const TREND_RANGES_WEEKLY = [
  { key: "month1", label: "1개월" },
  { key: "month6", label: "6개월" },
  { key: "year", label: "1년" },
  { key: "all", label: "전체" },
];

function renderTrendWrap(title, rows, valueKey, formatter, invert = false, dropMarker = null, activeRange = "week", ranges = TREND_RANGES_DAILY) {
  return `<div class="rank-trend-wrap">
    <div class="rank-trend-head">
      <span>${esc(title)}</span>
      <span class="rank-trend-range">
        ${ranges.map((range, i) => `<button type="button" class="${range.key === activeRange || (!ranges.some(r => r.key === activeRange) && i === 0) ? "active" : ""}" data-range="${range.key}">${range.label}</button>`).join("")}
      </span>
    </div>
    ${ranges.map((range, i) => {
      const filtered = filterTrendRows(rows, range.key, valueKey);
      const content = hasEnoughTrendRange(filtered, range.key)
        ? renderMiniTrendSvg(filtered, valueKey, formatter, invert, dropMarker)
        : renderTrendEmpty(`${range.label} 데이터가 아직 부족합니다`, "최근 수집 데이터 기준으로 표시됩니다");
      return `<div class="rank-trend-panel${range.key === activeRange || (!ranges.some(r => r.key === activeRange) && i === 0) ? " active" : ""}" data-range="${range.key}">
        ${content}
      </div>`;
    }).join("")}
  </div>`;
}

document.addEventListener("click", (e) => {
  const rangeBtn = e.target.closest(".rank-trend-range button");
  if (!rangeBtn) return;
  const wrap = rangeBtn.closest(".rank-trend-wrap");
  if (!wrap) return;
  const range = rangeBtn.dataset.range;
  wrap.querySelectorAll(".rank-trend-range button").forEach(btn => btn.classList.toggle("active", btn === rangeBtn));
  wrap.querySelectorAll(".rank-trend-panel").forEach(panel => panel.classList.toggle("active", panel.dataset.range === range));
});

// blog_rank_history(collected_date 단위)를 랭킹추적의 {date, rank} 시계열 모양으로 맞춘다 —
// 같은 날짜에 여러 번 수집됐으면 첫 값만 남긴다(랭킹추적과 동일한 규칙).
function keywordRankHistory(blogId, logNo, keyword, provider = "naver_blog_screen") {
  const rows = histories(blogId, logNo, keyword, provider);
  const byDate = new Map();
  rows.forEach(row => {
    if (row.rank != null && !byDate.has(row.collected_date)) byDate.set(row.collected_date, Number(row.rank));
  });
  return [...byDate.entries()].map(([date, rank]) => ({ date, rank })).sort((a, b) => a.date.localeCompare(b.date));
}

const PKW_VOLUME_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17v4"/><path d="M9 11v10"/><path d="M15 7v14"/><path d="M21 3v18"/></svg>`;

function postKeywordRankBadgeHtml(row, provider = "naver_blog_screen") {
  if (!row) return `<span class="pkw-badge none">미수집</span>`;
  if (!row.found || row.rank == null) return `<span class="pkw-badge none">미노출</span>`;
  const rank = Number(row.rank);
  const cls = rank <= 40 ? "p1" : rank <= 120 ? "p23" : "";
  const pageSize = provider === "naver_blog_api" ? 10 : 30;
  return `<span class="pkw-badge ${cls}">${rank}위<small>${row.page || Math.ceil(rank / pageSize)}페이지</small></span>`;
}

// 랭킹추적 renderTrackedItemCard의 keyword-rank-item과 같은 구조(배지+변동+검색량 한 줄 + 순위
// 그래프)로 만든다 — "이 글의 상위노출 키워드"는 이미 상위노출 중인 것만 걸러서 넘어온다.
function renderPostKeywordRankItem(blogId, logNo, kw, provider = "naver_blog_screen") {
  const [latest, previous] = latestPair(blogId, logNo, kw.keyword, provider);
  const history = keywordRankHistory(blogId, logNo, kw.keyword, provider);
  const delta = deltaInfo(latest, previous);
  const dropMarker = latest && !latest.found && latest.collected_date ? { date: latest.collected_date } : null;
  const searchUrl = `https://search.naver.com/search.naver?ssc=tab.blog.all&query=${encodeURIComponent(kw.keyword)}`;
  const volumeHtml = kw.search_volume != null
    ? `<span class="pkw-volume" title="검색량 ${Number(kw.search_volume).toLocaleString()}">${PKW_VOLUME_ICON}${Number(kw.search_volume).toLocaleString()}</span>`
    : `<span class="pkw-volume"></span>`;

  return `
    <div class="keyword-rank-item">
      <div class="keyword-rank-row">
        <span class="keyword-type main">추적</span>
        <a class="keyword-name" href="${esc(searchUrl)}" target="_blank" rel="noopener" title="${esc(kw.keyword)}">${esc(kw.keyword)}</a>
        <span class="keyword-main">${latest?.collected_date ? formatDate(latest.collected_date) : "미수집"}</span>
        ${postKeywordRankBadgeHtml(latest, provider)}
        <span class="rank-delta ${delta.cls}">${esc(delta.text)}</span>
        ${volumeHtml}
        <button class="pkw-del-btn" type="button" data-tip="키워드 삭제" onclick="event.stopPropagation(); deletePostKeyword(${kw.id}, '${esc(kw.keyword)}')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18"></path><path d="M8 6V4h8v2"></path><path d="M19 6l-1 14H6L5 6"></path><path d="M10 11v5M14 11v5"></path></svg>
        </button>
      </div>
      ${renderTrendWrap("순위 그래프", history, "rank", value => `${value}위`, true, dropMarker)}
    </div>`;
}

  const found = latestRows.filter(row => row.found).length;
  const deltas = state.postKeywords.map(kw => {
    const [current, previous] = latestPair(kw.blog_id, kw.log_no, kw.keyword, "naver_blog_screen");
    return deltaInfo(current, previous).amount;
  });

    .map(row => row.collected_at)

  document.getElementById("summaryTargets").innerHTML = `${state.postKeywords.length}<small>개</small>`;

function formatDate(value) {
  if (!value) return "-";
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return "-";
  return new Intl.DateTimeFormat("ko-KR", { year: "numeric", month: "2-digit", day: "2-digit" }).format(date);
}

function diagnosisAt(blogId, daysAgo) {
  const rows = state.diagnosis
    .filter(row => row.blog_id === blogId)
    .sort((a, b) => String(b.snapshot_date).localeCompare(String(a.snapshot_date)));
  if (!rows.length) return null;
  if (daysAgo === 0) return rows[0];
  const target = new Date(rows[0].snapshot_date);
  target.setUTCDate(target.getUTCDate() - daysAgo);
  const targetStr = target.toISOString().slice(0, 10);
  return rows.find(row => row.snapshot_date === targetStr)
    || rows.find(row => row.snapshot_date < targetStr)
    || null;
}

// category_rank/valid_keyword_count(블로그차트, 주간 갱신)는 blog_level/visitors_today(whereispost,
// 일간 갱신)와 같은 diagnosis 행 안에 같이 저장되긴 하지만 갱신 주기가 다르다 — diagnosisAt은
// "날짜상 가장 가까운 행"을 찾다 보니, 그 행에 하필 이 필드가 비어 있는 날짜(예: 화~일요일 백필분은
// 방문자만 있고 순위/키워드는 없음)를 집어서 "데이터 없음"으로 잘못 뜨는 경우가 있었다.
// 이 필드가 실제로 채워진 행들 중에서만 날짜를 비교해서 찾는다.
function diagnosisFieldAt(blogId, daysAgo, field) {
  const rows = state.diagnosis
    .filter(row => row.blog_id === blogId && row[field] != null)
    .sort((a, b) => String(b.snapshot_date).localeCompare(String(a.snapshot_date)));
  if (!rows.length) return null;
  if (daysAgo === 0) return rows[0];
  const target = new Date(rows[0].snapshot_date);
  target.setUTCDate(target.getUTCDate() - daysAgo);
  const targetStr = target.toISOString().slice(0, 10);
  return rows.find(row => row.snapshot_date <= targetStr) || null;
}

// whereispost가 알려주는 자체 평균 대신, 우리가 실제로 쌓은(백필 포함) 방문 이력으로 직접 평균을 낸다.
function avgVisitors(blogId) {
  const values = state.diagnosis
    .filter(row => row.blog_id === blogId && row.visitors_today != null)
    .map(row => Number(row.visitors_today));
  if (!values.length) return null;
  return values.reduce((sum, v) => sum + v, 0) / values.length;
}

// alertPct를 주면 그 이상 하락 시 "급감"으로 강조 표시 (예: 이웃/방문자 급감 감지)
function pctChangeChip(label, cur, prev, alertPct = null) {
  if (cur == null) return `<span class="cmp">${esc(label)} -</span>`;
  if (prev == null) return `<span class="cmp">${esc(label)} 데이터 없음</span>`;
  if (prev === 0) {
    if (cur === 0) return `<span class="cmp">${esc(label)} -</span>`;
    return `<span class="cmp up">${esc(label)} 신규</span>`;
  }
  const pct = ((cur - prev) / prev) * 100;
  const isAlert = alertPct != null && pct <= alertPct;
  const cls = isAlert ? "alert" : pct > 0.05 ? "up" : pct < -0.05 ? "down" : "";
  const arrow = pct > 0.05 ? "▲" : pct < -0.05 ? "▼" : "-";
  return `<span class="cmp ${cls}">${esc(label)} ${isAlert ? "급감 " : ""}${arrow}${Math.abs(pct).toFixed(1)}%</span>`;
}

// 순위는 숫자가 작아질수록 좋아지는 값이라 pctChangeChip과 up/down 방향이 반대다.
function rankChangeChip(label, cur, prev) {
  if (cur == null) return `<span class="cmp">${esc(label)} -</span>`;
  if (prev == null) return `<span class="cmp">${esc(label)} 데이터 없음</span>`;
  const diff = prev - cur;
  const cls = diff > 0 ? "up" : diff < 0 ? "down" : "";
  const arrow = diff > 0 ? "▲" : diff < 0 ? "▼" : "-";
  return `<span class="cmp ${cls}">${esc(label)} ${arrow}${Math.abs(diff).toLocaleString()}</span>`;
}

function renderDiagnosisCard(blog) {
  const snapshot = diagnosisAt(blog.blog_id, 0);
  const dayAgo = diagnosisAt(blog.blog_id, 1);
  const weekAgo = diagnosisAt(blog.blog_id, 7);
  // category_rank/valid_keyword_count는 주간 갱신이라 snapshot/weekAgo(날짜상 가장 가까운 행)에는
  // 하필 이 필드가 비어 있는 날이 걸릴 수 있다 — 이 필드가 실제로 채워진 행 기준으로 따로 찾는다.
  const categoryRankNow = diagnosisFieldAt(blog.blog_id, 0, "category_rank");
  const categoryRankWeekAgo = diagnosisFieldAt(blog.blog_id, 7, "category_rank");
  const keywordCountNow = diagnosisFieldAt(blog.blog_id, 0, "valid_keyword_count");

  const snapshotLabel = snapshot ? `최근 진단: ${formatTime(snapshot.collected_at)}` : "아직 진단한 적이 없습니다.";

  const tiles = [
    {
      label: "블로그 지수",
      tip: "키워드마스터가 제공하는 자체 지수(0~10단계)로, 네이버 공식 지표가 아닙니다.",

      value: snapshot?.visitors_today != null ? Number(snapshot.visitors_today).toLocaleString() : "-",
      unit: (() => { const avg = avgVisitors(blog.blog_id); return avg != null ? `명 · 평균 ${Math.round(avg).toLocaleString()}` : "명"; })(),
      cmp: `<div class="metric-cmp">${pctChangeChip("전일", snapshot?.visitors_today, dayAgo?.visitors_today, -30)}${pctChangeChip("전주", snapshot?.visitors_today, weekAgo?.visitors_today, -30)}</div>`,
    },
    {
      label: "블로그 순위",
      tip: (categoryRankNow?.category_label ? `블로그차트 "${categoryRankNow.category_label}" 카테고리 기준 순위입니다. (주간 단위 갱신)` : "블로그차트 연동 계정의 카테고리 순위입니다. (주간 단위 갱신)"),
      value: categoryRankNow?.category_rank != null ? Number(categoryRankNow.category_rank).toLocaleString() : "-",
      unit: `위${categoryRankNow?.best_rank != null ? ` · 최고 ${Number(categoryRankNow.best_rank).toLocaleString()}위` : ""}`,
      cmp: `<div class="metric-cmp">${rankChangeChip("전주", categoryRankNow?.category_rank, categoryRankWeekAgo?.category_rank)}</div>`,
    },
    {
      label: "유효키워드",
      tip: "블로그차트 기준, 검색에 실제로 잡히고 있는 키워드 수입니다. (주간 단위 갱신)",
      value: keywordCountNow?.valid_keyword_count ?? "-",
      unit: keywordCountNow?.total_keyword_count != null ? `/ 전체 ${Number(keywordCountNow.total_keyword_count).toLocaleString()}개` : "개",
      cmp: `<div class="metric-cmp">${pctChangeChip("전주", keywordCountNow?.valid_keyword_count, keywordCountWeekAgo?.valid_keyword_count)}</div>`,
    },
  ];

  const tilesHtml = tiles.map(t => `
    <div class="dash-tile">
      <div class="dash-label">${esc(t.label)}<span class="dash-info">?<span class="dash-tip">${esc(t.tip)}</span></span></div>

    <div class="summary-mini-card app-card">
