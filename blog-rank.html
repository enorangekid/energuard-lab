<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>블로그 분석 | ENERGUARD LAB</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="common.css?v=20260727-blogrank1">
  <style>
    :root {
      --dark: #05070b;
      --ink: #07111f;
      --sub: #667085;
      --muted: #98a2b3;
      --line: #e1e6ee;
      --line-strong: #d4dae4;
      --bg: #f5f7fa;
      --panel: #fff;
      --soft: #f8fafc;
      --accent: #e85d2f;
      --accent-soft: #fff0e9;
      --green: #16a34a;
      --green-soft: #eaf8ef;
      --danger: #e32636;
      --danger-soft: #fdebec;
      --good: #0f9f6e;
      --bad: #dc2626;
      --dark-tint: #eef0f3;
      --radius: 6px;
      --font-main: "Pretendard Variable", Pretendard, -apple-system, sans-serif;
      --font-mono: "JetBrains Mono", "Fira Code", monospace;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-main);
      font-size: 14px;
      line-height: 1.55;
    }
    button, input, select { font: inherit; }
    button { color: inherit; }

    body > main.wrap {
      max-width: 1180px;
      margin: 0 auto;
      padding: 64px 0 80px;
    }

    .page-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 30px;
      position: relative;
    }
    .mode-title-tabs {
      display: inline-flex;
      align-items: center;
      gap: 28px;
    }
    .mode-title-tab {
      position: relative;
      display: inline-flex;
      align-items: center;
      height: 34px;
      padding: 0 0 8px;
      border: 0;
      background: transparent;
      color: #aeb6c4;
      font-family: inherit;
      font-size: 21px;
      line-height: normal;
      font-weight: 900;
      text-decoration: none;
      cursor: pointer;
    }
    .mode-title-tab:not(.active):hover { color: #7f8795; }
    .mode-title-tab + .mode-title-tab::before {
      content: "";
      position: absolute;
      left: -15px;
      top: 4px;
      width: 1px;
      height: 18px;
      background: #d8dde6;
    }
    .mode-title-text {
      display: inline-flex;
      align-items: center;
      gap: 12px;
    }
    .mode-label {
      position: relative;
      display: inline-flex;
      align-items: center;
    }
    .mode-title-tab.active { color: var(--ink); }
    .mode-title-tab.active .mode-label::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -13px;
      height: 3px;
      border-radius: 999px;
      background: var(--accent);
    }
    .mode-help {
      width: 18px;
      height: 18px;
      border: 1px solid #cfd5df;
      border-radius: 50%;
      background: #f4f6f9;
      color: #8a93a5;
      font-size: 12px;
      font-weight: 900;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .head-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      position: absolute;
      right: 0;
      top: 0;
    }
    .icon-btn {
      width: 38px;
      height: 38px;
      padding: 0;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      background: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: border-color .15s, background .15s, color .15s;
      position: relative;
    }
    .icon-btn svg { width: 18px; height: 18px; }
    .icon-btn:hover { border-color: #aeb6c4; background: #f5f7fa; }
    .icon-btn.primary {
      border-color: var(--dark);
      background: var(--dark);
      color: #fff;
    }
    .icon-btn.primary:hover { background: #252b36; border-color: #252b36; }
    .icon-btn.collect {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }
    .icon-btn.collect:hover { background: #d94f24; border-color: #d94f24; }
    .icon-btn[data-tip]::after {
      content: attr(data-tip);
      position: absolute;
      z-index: 20;
      right: 0;
      top: calc(100% + 8px);
      padding: 6px 8px;
      border-radius: 4px;
      background: #20242d;
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-3px);
      transition: opacity .15s, transform .15s;
    }
    .icon-btn[data-tip]:hover::after { opacity: 1; transform: translateY(0); }

    .setup-note {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      min-height: 48px;
      margin-bottom: 24px;
      padding: 11px 14px;
      border: 1px solid #f4c4ae;
      border-radius: var(--radius);
      background: #fff8f4;
      color: #7a3d26;
      font-size: 12.5px;
    }
    .setup-note.show { display: flex; }
    .setup-note strong { color: var(--accent); }

    .blog-view[hidden],
    .head-actions[hidden] {
      display: none !important;
    }

    .blog-diagnosis-stack {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* ── 블로그 진단 요약 대시보드 — 매출분석의 .rank-dash/.dash-tile 구조를 그대로 옮겨온 것 ── */
    .rank-dash {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      padding: 16px 18px 14px;
      box-shadow: 0 14px 34px rgba(5, 7, 11, .05);
    }
    .rank-dash-tiles {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
    }
    .dash-tile { padding: 4px 2px; min-width: 0; }
    .dash-tile + .dash-tile { border-left: 1px solid var(--line); padding-left: 14px; }
    .dash-label { display: flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 800; color: #8a93a5; white-space: nowrap; }
    .dash-value {
      margin-top: 2px; font-size: 21px; font-weight: 800; color: var(--ink);
      font-variant-numeric: tabular-nums; letter-spacing: -0.01em; white-space: nowrap;
    }
    .dash-value small { margin-left: 4px; font-size: 11.5px; font-weight: 700; color: var(--sub); }
    .dash-info {
      position: relative;
      width: 14px; height: 14px; flex-shrink: 0;
      display: inline-flex; align-items: center; justify-content: center;
      border: 1px solid #cfd5df; border-radius: 50%;
      background: #f4f6f9; color: #8a93a5;
      font-size: 9.5px; font-weight: 900; cursor: default; line-height: 1;
    }
    .dash-tip {
      position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(3px);
      z-index: 60; width: max-content; max-width: 230px;
      padding: 8px 11px; border-radius: 6px;
      background: #161a22; color: #fff;
      font-size: 11.5px; font-weight: 600; line-height: 1.5; text-align: left; white-space: normal;
      opacity: 0; visibility: hidden; transition: all .12s; pointer-events: none;
    }
    .dash-info:hover .dash-tip { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
    .metric-cmp { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .metric-cmp .cmp {
      display: inline-flex; align-items: center; gap: 2px; font-size: 10.5px; font-weight: 800;
      padding: 1px 6px; border-radius: 8px; background: var(--dark-tint); color: var(--sub); white-space: nowrap;
    }
    .metric-cmp .cmp.up { color: var(--good); background: #e7f6ec; }
    .metric-cmp .cmp.down { color: var(--bad); background: #fdecec; }
    .metric-cmp .cmp.alert { color: #fff; background: var(--bad); }
    @media (max-width: 900px) {
      .rank-dash-tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); row-gap: 14px; }
      .dash-tile:nth-child(4) { border-left: none; padding-left: 2px; }
    }

    /* ── 1페이지/2~3페이지/4페이지 이하 비율 바 — 랭킹추적 .rank-dash 그대로 ── */
    .dash-bar-wrap { margin-top: 14px; }
    .dash-bar { display: flex; gap: 2px; height: 12px; }
    .dash-bar-seg { min-width: 3px; }
    .dash-bar-seg:first-child { border-radius: 6px 0 0 6px; }
    .dash-bar-seg:last-child { border-radius: 0 6px 6px 0; }
    .dash-bar-seg:only-child { border-radius: 6px; }
    .dash-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 8px; font-size: 11.5px; color: var(--sub); font-weight: 700; }
    .dash-legend-item { display: inline-flex; align-items: center; gap: 5px; }
    .dash-legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .dash-legend-item b { color: var(--ink); font-weight: 800; }

    /* ── 순위 변동/이탈 카드 — 랭킹추적 .summary-top3-card/.summary-mover-row 그대로 ── */
    .summary-top3-row-wrap { display: flex; gap: 14px; flex-wrap: wrap; }
    .summary-mover-grid .summary-top3-card { flex: 1 1 260px; }
    .summary-top3-card { flex: 1 1 260px; min-width: 240px; border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }
    .summary-top3-title { font-size: 12px; font-weight: 800; color: var(--sub); margin-bottom: 12px; }
    .summary-top3-rank {
      flex: 0 0 auto; width: 20px; height: 20px; border-radius: 50%; background: var(--dark-tint);
      display: inline-flex; align-items: center; justify-content: center;
      font-family: var(--font-mono); font-size: 11px; font-weight: 800; color: var(--sub);
    }
    .summary-top3-name {
      flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-size: 13px; font-weight: 700; color: inherit; text-decoration: none;
    }
    a.summary-top3-name:hover { color: var(--accent); text-decoration: underline; }
    .summary-mover-row { padding: 9px 0; border-bottom: 1px solid #f4f5f7; }
    .summary-mover-row:last-child { border-bottom: none; }
    .summary-mover-row-main { display: flex; align-items: center; gap: 8px; }
    .summary-mover-row-detail { margin-top: 4px; padding-left: 28px; font-size: 11.5px; color: var(--sub); font-family: var(--font-mono); }
    .summary-mover-delta { flex: 0 0 auto; margin-left: auto; font-family: var(--font-mono); font-size: 12px; font-weight: 800; white-space: nowrap; }
    .summary-mover-delta.up { color: #16a34a; }
    .summary-mover-delta.down { color: var(--danger); }
    .summary-mover-row-detail.dropout-keywords { display: flex; flex-wrap: wrap; gap: 6px; font-family: inherit; }
    .dropout-keyword-chip {
      display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 20px;
      background: #fdecec; color: var(--danger); font-size: 11px; font-weight: 700; white-space: nowrap;
    }
    .dropout-keyword-rank { font-family: var(--font-mono); font-weight: 700; color: var(--sub); }
    .summary-top3-more {
      display: flex; align-items: center; justify-content: center; gap: 4px; width: 100%;
      margin-top: 10px; padding: 10px 0 0; border: 0; border-top: 1px solid #f4f5f7; background: transparent;
      color: var(--sub); font-family: inherit; font-size: 12px; font-weight: 800; cursor: pointer;
    }
    .summary-top3-more:hover { color: var(--accent); }

    /* ── 최근 게시글 진단 — 랭킹추적의 .product-group/.expand-btn 카드+펼치기 패턴을 그대로 가져옴.
       모달 대신 행을 눌러서 펼치면 그 안에 진단 상세(글자수/사진/댓글/상위노출 키워드)가 나온다. */
    .post-card { border: 1px solid var(--line); border-radius: var(--radius); background: #fff; }
    .post-card + .post-card { margin-top: 6px; }
    .post-card:hover { border-color: #d9dee8; }
    .post-card.open { border-color: var(--accent, #e85d2f); box-shadow: 0 10px 24px rgba(232, 93, 47, .08); }
    .post-main-row {
      display: grid;
      grid-template-columns: 24px 40px minmax(140px, 2fr) 70px 1.2fr 80px 90px 36px;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      cursor: pointer;
    }
    .post-main-row.head-row {
      cursor: default;
      background: var(--soft);
      color: #7c8799;
      font-size: 10.5px;
      font-weight: 800;
      text-align: center;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      margin-bottom: 6px;
    }
    .post-main-row.head-row span:nth-child(3) { text-align: left; }
    .post-card.open .post-main-row { border-bottom: 1px solid var(--line); }
    .expand-btn {
      flex-shrink: 0; width: 22px; height: 22px; padding: 0;
      border: 1px solid var(--line); border-radius: 50%; background: #fff;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 800; color: var(--sub); cursor: pointer; line-height: 1;
    }
    .expand-btn::before { content: "+"; }
    .post-card.open .expand-btn::before { content: "\2212"; }
    .expand-btn:hover,
    .post-card.open .expand-btn { border-color: var(--accent, #e85d2f); background: var(--accent-tint, #fdeee7); color: var(--accent-dark, #d04420); }
    .post-detail { display: none; padding: 14px 16px 16px; background: var(--soft); border-radius: 0 0 var(--radius) var(--radius); }
    .post-card.open .post-detail { display: block; }
    .post-detail-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .recent-post-title {
      min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      color: var(--ink); font-size: 12.5px; font-weight: 800; text-decoration: none;
    }
    .recent-post-title:hover { color: var(--accent); text-decoration: underline; }
    .recent-post-cell { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11.5px; color: var(--sub); text-align: center; }
    .recent-post-cell.text-bad { color: var(--danger); font-weight: 800; }

    .diagnosis-refresh-btn {
      flex-shrink: 0;
      height: 34px;
      padding: 0 14px;
      border: 1px solid var(--line-strong);
      border-radius: 4px;
      background: #fff;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }
    .diagnosis-refresh-btn:hover { border-color: #aeb6c4; background: #f5f7fa; }

    /* ── 노출 현황 진단 — 키워드 검색 결과(노출중) / 미노출 키워드 목록 ── */
    .exposure-list { display: flex; flex-direction: column; gap: 6px; }
    .exposure-row {
      display: grid;
      grid-template-columns: 60px 1fr 1.3fr 70px 32px;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
    }
    .exposure-cat-badge {
      padding: 2px 7px; border-radius: 999px; text-align: center;
      background: #f1f3f7; color: #69758a; font-size: 10px; font-weight: 800;
    }
    .exposure-cat-badge.main { background: var(--accent-soft); color: var(--accent); }
    .exposure-keyword { min-width: 0; font-size: 12.5px; font-weight: 800; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .exposure-post-title {
      min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      color: var(--sub); font-size: 11.5px; text-decoration: none;
    }
    .exposure-post-title:hover { color: var(--accent); text-decoration: underline; }
    .exposure-rank { text-align: center; font-family: var(--font-mono); font-size: 13px; font-weight: 800; color: var(--ink); }
    .missing-keyword-wrap { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .missing-keyword-chip {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 4px 5px 4px 10px; border-radius: 999px;
      background: #f7f8fa; color: #8a94a6; font-size: 11px; font-weight: 700;
    }
    .missing-keyword-chip button {
      width: 16px; height: 16px; padding: 0; border: 0; border-radius: 50%;
      background: transparent; color: #b0b8c5; font-size: 12px; line-height: 1; cursor: pointer;
    }
    .missing-keyword-chip button:hover { background: #e6e9ef; color: #566176; }
    .blog-diagnosis-stack .summary-mini-card + .summary-mini-card { margin-top: 16px; }
    /* common.css의 .summary-mini-card는 둥근 모서리 때문에 overflow:hidden인데,
       그러면 .dash-tip 툴팁이 카드 밖으로 못 나가고 잘린다 — 이 탭에서만 풀어준다. */
    .blog-diagnosis-stack .summary-mini-card { overflow: visible; }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      margin-bottom: 24px;
      padding: 16px 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: 0 10px 28px rgba(20, 27, 40, .05);
    }
    .summary-item {
      min-width: 0;
      padding: 0 18px;
      border-right: 1px solid var(--line);
    }
    .summary-item:first-child { padding-left: 0; }
    .summary-item:last-child { padding-right: 0; border-right: 0; }
    .summary-label {
      display: block;
      margin-bottom: 5px;
      color: #8590a3;
      font-size: 11px;
      font-weight: 700;
    }
    .summary-value {
      font-family: var(--font-mono);
      font-size: 22px;
      font-weight: 700;
      color: var(--ink);
    }
    .summary-value small {
      margin-left: 2px;
      font-family: var(--font-main);
      font-size: 12px;
      font-weight: 700;
      color: var(--sub);
    }
    .summary-value.up { color: var(--green); }
    .summary-value.down { color: var(--danger); }

    .rank-card {
      overflow: visible;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: 0 12px 32px rgba(20, 27, 40, .055);
    }
    .rank-card + .rank-card { margin-top: 16px; }
    .card-head {
      min-height: 62px;
      padding: 0 18px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .card-title { font-size: 16px; font-weight: 900; }
    .card-sub { margin-top: 4px; color: var(--sub); font-size: 12px; }
    .card-count {
      min-width: 52px;
      padding: 5px 10px;
      border-radius: 999px;
      background: #f1f3f7;
      color: #536077;
      text-align: center;
      font-size: 12px;
      font-weight: 800;
    }

    /* 블로그 카드 헤더 — 블로그명 + 내블로그/경쟁사 배지 + 포스팅 수 + 관리 버튼들 */
    .blog-name-row { display: flex; align-items: center; gap: 8px; }
    .blog-name { font-size: 16px; font-weight: 900; }
    .blog-owner-badge {
      padding: 3px 8px;
      border-radius: 999px;
      background: #f1f3f7;
      color: #69758a;
      font-size: 10.5px;
      font-weight: 800;
    }
    .blog-owner-badge.mine { background: var(--accent-soft); color: var(--accent); }
    .blog-actions { display: flex; align-items: center; gap: 6px; }
    .keyword-add-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 10px 12px 0;
      padding: 10px 12px;
      border: 1px dashed var(--line-strong);
      border-radius: var(--radius);
    }
    .keyword-add-row input {
      flex: 1;
      height: 34px;
      padding: 0 10px;
      border: 1px solid var(--line-strong);
      border-radius: 4px;
      background: #fff;
      color: var(--ink);
      font-family: inherit;
      font-size: 12.5px;
      outline: none;
    }
    .keyword-add-row input:focus { border-color: #efae91; box-shadow: 0 0 0 3px rgba(232, 93, 47, .09); }
    .keyword-add-btn {
      flex-shrink: 0;
      height: 34px;
      padding: 0 14px;
      border: 1px solid var(--line-strong);
      border-radius: 4px;
      background: #fff;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }
    .keyword-add-btn:hover { border-color: #aeb6c4; background: #f5f7fa; }
    .field-check {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--sub);
      font-size: 12.5px;
      font-weight: 700;
    }
    .field-check input { width: 16px; height: 16px; }

<script>
const SUPABASE_URL = "https://eukwfypbfqojbaihfqye.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_MiBvlf3d6ulcVBsi7Odcgw_PTXSmXKj";
const BLOG_RANK_URL = `${SUPABASE_URL}/functions/v1/blog-rank`;

let state = { blogs: [], posts: [], postKeywords: [], history: [], diagnosis: [], targetKeywords: [], exposureHistory: [], postTitleChecks: [], postContentChecks: [], capabilities: {} };
let toastTimer = 0;

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[char]);
}

function showToast(message) {
  const toast = document.getElementById("toast");
  toast.textContent = message;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 2400);
}

async function callApi(action, payload = {}) {
  const response = await fetch(BLOG_RANK_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      apikey: SUPABASE_ANON_KEY,
      Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
    },
    body: JSON.stringify({ action, ...payload }),
  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok || data.error) throw new Error(data.error || `요청 실패 (${response.status})`);
  return data;
}

function histories(blogId, logNo, keyword, provider) {
  return state.history
    .filter(row => row.blog_id === blogId && row.log_no === logNo && row.keyword === keyword && row.provider === provider)
    .sort((a, b) => String(b.collected_at).localeCompare(String(a.collected_at)));
}

function latestPair(blogId, logNo, keyword, provider) {
  const rows = histories(blogId, logNo, keyword, provider);
  return [rows[0] || null, rows[1] || null];
}

function deltaInfo(current, previous) {
  if (!current) return { text: "-", cls: "neutral", amount: 0 };
  if (!current.found && previous?.found) return { text: "이탈", cls: "down", amount: -1 };
  if (current.found && previous && !previous.found) return { text: "진입", cls: "up", amount: 1 };
  if (current.rank == null || previous?.rank == null) return { text: "-", cls: "neutral", amount: 0 };
  const delta = Number(previous.rank) - Number(current.rank);
  if (delta > 0) return { text: `▲${delta}`, cls: "up", amount: delta };
  if (delta < 0) return { text: `▼${Math.abs(delta)}`, cls: "down", amount: delta };
  return { text: "-", cls: "neutral", amount: 0 };
}

function rankBadge(row, providerReady = true) {
  if (!providerReady) return `<span class="rank-badge empty">연결 전<span>API 키 필요</span></span>`;
  if (!row) return `<span class="rank-badge empty">-<span>수집 전</span></span>`;
  if (!row.found || row.rank == null) {
    const label = row.provider === "naver_blog_api"
      ? `${Number(row.checked_count || 0).toLocaleString()}위 밖`
      : `${Number(row.checked_count || 0).toLocaleString()}위까지 미노출`;
    return `<span class="rank-badge missing">미노출<span>${esc(label)}</span></span>`;
  }
  const sub = row.provider === "naver_blog_api" ? `${row.page || Math.ceil(row.rank / 10)}페이지` : "실제 화면";
  return `<span class="rank-badge">${Number(row.rank).toLocaleString()}위<span>${esc(sub)}</span></span>`;
}
function sparkline(blogId, logNo, keyword) {
  const rows = histories(blogId, logNo, keyword, "naver_blog_screen")
    .filter(row => row.rank != null)
    .slice(0, 7)
    .reverse();
  if (rows.length < 2) return `<div class="spark-empty">이력 부족</div>`;

  const values = rows.map(row => Number(row.rank));
  const min = Math.min(...values);
  const max = Math.max(...values);
  const range = Math.max(1, max - min);
  const points = values.map((value, index) => {
    const x = 5 + (132 * index / Math.max(1, values.length - 1));
    const y = 5 + ((value - min) / range) * 27;
    return [x, y];
  });
  const line = points.map(point => point.join(",")).join(" ");
  const area = `5,35 ${line} 137,35`;
  return `
    <svg class="sparkline" viewBox="0 0 142 38" aria-label="최근 순위 흐름">
      <line class="grid" x1="5" y1="35" x2="137" y2="35"></line>
      <polygon class="area" points="${area}"></polygon>

function formatTime(value) {
  if (!value) return "-";
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return "-";
  return new Intl.DateTimeFormat("ko-KR", {
    month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit",
  }).format(date);
}

function renderSummary() {
  const latestRows = state.postKeywords.map(kw => latestPair(kw.blog_id, kw.log_no, kw.keyword, "naver_blog_screen")[0]).filter(Boolean);
  const found = latestRows.filter(row => row.found).length;
  const deltas = state.postKeywords.map(kw => {
    const [current, previous] = latestPair(kw.blog_id, kw.log_no, kw.keyword, "naver_blog_screen");
    return deltaInfo(current, previous).amount;
  });
  const newest = state.history
    .map(row => row.collected_at)
    .filter(Boolean)
    .sort()
    .at(-1);

  document.getElementById("summaryTargets").innerHTML = `${state.postKeywords.length}<small>개</small>`;

  document.getElementById("summaryDown").textContent = `▼${deltas.filter(value => value < 0).length}`;

function diagnosisAt(blogId, daysAgo) {
  const rows = state.diagnosis
    .filter(row => row.blog_id === blogId)
    .sort((a, b) => String(b.snapshot_date).localeCompare(String(a.snapshot_date)));
  if (!rows.length) return null;
  if (daysAgo === 0) return rows[0];
  const target = new Date(rows[0].snapshot_date);
  target.setUTCDate(target.getUTCDate() - daysAgo);
  const targetStr = target.toISOString().slice(0, 10);
  return rows.find(row => row.snapshot_date === targetStr)
    || rows.find(row => row.snapshot_date < targetStr)
    || null;
}

// whereispost가 알려주는 자체 평균 대신, 우리가 실제로 쌓은(백필 포함) 방문 이력으로 직접 평균을 낸다.
function avgVisitors(blogId) {
  const values = state.diagnosis
    .filter(row => row.blog_id === blogId && row.visitors_today != null)
    .map(row => Number(row.visitors_today));
  if (!values.length) return null;
  return values.reduce((sum, v) => sum + v, 0) / values.length;
}

// alertPct를 주면 그 이상 하락 시 "급감"으로 강조 표시 (예: 이웃/방문자 급감 감지)
function pctChangeChip(label, cur, prev, alertPct = null) {
  if (cur == null) return `<span class="cmp">${esc(label)} -</span>`;
  if (prev == null) return `<span class="cmp">${esc(label)} 데이터 없음</span>`;
  if (prev === 0) {
    if (cur === 0) return `<span class="cmp">${esc(label)} -</span>`;
    return `<span class="cmp up">${esc(label)} 신규</span>`;
  }
  const pct = ((cur - prev) / prev) * 100;
  const isAlert = alertPct != null && pct <= alertPct;
  const cls = isAlert ? "alert" : pct > 0.05 ? "up" : pct < -0.05 ? "down" : "";
  const arrow = pct > 0.05 ? "▲" : pct < -0.05 ? "▼" : "-";
  return `<span class="cmp ${cls}">${esc(label)} ${isAlert ? "급감 " : ""}${arrow}${Math.abs(pct).toFixed(1)}%</span>`;
}

// 순위는 숫자가 작아질수록 좋아지는 값이라 pctChangeChip과 up/down 방향이 반대다.
function rankChangeChip(label, cur, prev) {
  if (cur == null) return `<span class="cmp">${esc(label)} -</span>`;
  if (prev == null) return `<span class="cmp">${esc(label)} 데이터 없음</span>`;
  const diff = prev - cur;
  const cls = diff > 0 ? "up" : diff < 0 ? "down" : "";
  const arrow = diff > 0 ? "▲" : diff < 0 ? "▼" : "-";
  return `<span class="cmp ${cls}">${esc(label)} ${arrow}${Math.abs(diff).toLocaleString()}</span>`;
}

const exposureMoverExpanded = new Set();
const EXPOSURE_MOVER_LIMIT = 10;
function exposureMoreBtnHtml(key, totalCount, threshold = 3) {
  if (totalCount <= threshold) return "";
  const expanded = exposureMoverExpanded.has(key);
  return `<button type="button" class="summary-top3-more" data-action="toggle-exposure-mover" data-mover-key="${esc(key)}">${expanded ? "간략히 보기" : "순위 더보기"} <span>${expanded ? "−" : "+"}</span></button>`;
}

function exposureMovers(blogId) {
  const keywords = state.targetKeywords.filter(k => k.blog_id === blogId);
  const moves = keywords.map(kw => {
    const rows = exposureHistoryFor(blogId, kw.keyword, "naver_blog_screen");
    const current = rows[0];
    const previous = rows[1];
    if (!current || !previous || !current.found || !previous.found || current.rank == null || previous.rank == null) return null;
    const delta = previous.rank - current.rank; // 양수면 순위 상승(숫자가 작아짐)
    if (delta === 0) return null;
    return { kw, current, previous, delta };
  }).filter(Boolean);

  const byCategory = (category, dir) => moves
    .filter(m => m.kw.category === category && (dir === "up" ? m.delta > 0 : m.delta < 0))
    .sort((a, b) => dir === "up" ? b.delta - a.delta : a.delta - b.delta);

  return {
    mainUp: byCategory("메인", "up"),
    mainDown: byCategory("메인", "down"),
    subUp: byCategory("서브", "up"),
    subDown: byCategory("서브", "down"),
  };
}

function exposureDropouts(blogId) {
  const keywords = state.targetKeywords.filter(k => k.blog_id === blogId);
  const byPost = new Map();
  keywords.forEach(kw => {
    const rows = exposureHistoryFor(blogId, kw.keyword, "naver_blog_screen");
    const current = rows[0];
    const previous = rows[1];
    if (!current || !previous || !previous.found || current.found) return;
    const key = previous.result_log_no || previous.result_title || previous.result_url || kw.keyword;
    if (!byPost.has(key)) {
      byPost.set(key, { title: previous.result_title, url: previous.result_url, logNo: previous.result_log_no, keywords: [] });
    }
    byPost.get(key).keywords.push({ keyword: kw.keyword, prevRank: previous.rank, prevDate: previous.checked_date });
  });
  return [...byPost.values()];
}

function exposurePageDistribution(blogId) {
  const keywords = state.targetKeywords.filter(k => k.blog_id === blogId);
  let page1 = 0, page23 = 0, page4plus = 0;
  keywords.forEach(kw => {
    const current = exposureHistoryFor(blogId, kw.keyword, "naver_blog_screen")[0];
    if (!current?.found || current.page == null) return;
    if (current.page === 1) page1 += 1;
    else if (current.page <= 3) page23 += 1;
    else page4plus += 1;
  });
  return { page1, page23, page4plus };
}

function renderExposureCard(blog) {
  const keywords = state.targetKeywords.filter(k => k.blog_id === blog.blog_id);
  const results = keywords.map(k => ({ kw: k, result: latestExposure(blog.blog_id, k.keyword, "naver_blog_screen") }));
  const checkedCount = results.filter(r => r.result).length;
  const exposedCount = results.filter(r => r.result?.found).length;
  const notExposedCount = checkedCount - exposedCount;
  const exposureRate = checkedCount ? Math.round((exposedCount / checkedCount) * 100) : null;

  const posts = state.posts.filter(p => p.blog_id === blog.blog_id);
  const titleChecks = posts.map(p => postTitleCheckFor(blog.blog_id, p.log_no)).filter(Boolean);
  const missingCount = titleChecks.filter(c => !c.found).length;

  const tilesHtml = [
    { label: "노출중", value: exposedCount, tip: "검색 시 우리 블로그 포스팅이 결과에 걸린 키워드 수입니다." },
    { label: "미노출", value: notExposedCount, tip: "검색해봤지만 우리 블로그 포스팅이 안 걸린 키워드 수입니다." },
    { label: "누락", value: missingCount, tip: "포스팅 제목으로 검색해도 그 포스팅 자체가 안 뜨는 경우 — 노출 경쟁력이 아니라 색인/노출 자체의 문제입니다." },
    { label: "노출률", value: exposureRate != null ? `${exposureRate}%` : "-", tip: "진단 키워드 중 노출중 비율입니다." },
  ].map(t => `
    <div class="dash-tile">
      <div class="dash-label">${esc(t.label)}<span class="dash-info">?<span class="dash-tip">${esc(t.tip)}</span></span></div>
      <div class="dash-value">${t.value}</div>
    </div>`).join("");

  const pageDist = exposurePageDistribution(blog.blog_id);
  const rankedTotal = pageDist.page1 + pageDist.page23 + pageDist.page4plus;
  const pagePct = n => rankedTotal ? Math.round(n / rankedTotal * 100) : 0;
  const pageSegs = [
    { label: "1페이지", count: pageDist.page1, color: "#e85d2f" },
    { label: "2~3페이지", count: pageDist.page23, color: "#f4a988" },
    { label: "4페이지 이하", count: pageDist.page4plus, color: "#fbdccb" },
  ].filter(seg => seg.count > 0);
  const pageBarHtml = rankedTotal ? `
    <div class="dash-bar-wrap">
      <div class="dash-bar">${pageSegs.map(seg => `<span class="dash-bar-seg" style="flex:${seg.count};background:${seg.color};" title="${seg.label} ${seg.count}개 (${pagePct(seg.count)}%)"></span>`).join("")}</div>
      <div class="dash-legend">${pageSegs.map(seg => `<span class="dash-legend-item"><span class="dash-legend-dot" style="background:${seg.color};"></span>${seg.label} <b>${seg.count}개</b> · ${pagePct(seg.count)}%</span>`).join("")}</div>
    </div>` : "";

  const movers = exposureMovers(blog.blog_id);
  const mainUpKey = `exp-mup-${blog.blog_id}`, mainDownKey = `exp-mdown-${blog.blog_id}`, subUpKey = `exp-sup-${blog.blog_id}`, subDownKey = `exp-sdown-${blog.blog_id}`;
  const sliceFor = (key, list) => list.slice(0, exposureMoverExpanded.has(key) ? EXPOSURE_MOVER_LIMIT : 3);
  const moverCardsHtml = [
    dashMoverSubCard("메인 키워드 상승", sliceFor(mainUpKey, movers.mainUp).map((m, i) => moverKeywordRowHtml(m, i + 1)).join("") + exposureMoreBtnHtml(mainUpKey, movers.mainUp.length)),
    dashMoverSubCard("메인 키워드 하락", sliceFor(mainDownKey, movers.mainDown).map((m, i) => moverKeywordRowHtml(m, i + 1)).join("") + exposureMoreBtnHtml(mainDownKey, movers.mainDown.length)),
    dashMoverSubCard("보조 키워드 상승", sliceFor(subUpKey, movers.subUp).map((m, i) => moverKeywordRowHtml(m, i + 1)).join("") + exposureMoreBtnHtml(subUpKey, movers.subUp.length)),
    dashMoverSubCard("보조 키워드 하락", sliceFor(subDownKey, movers.subDown).map((m, i) => moverKeywordRowHtml(m, i + 1)).join("") + exposureMoreBtnHtml(subDownKey, movers.subDown.length)),
  ].join("");

  const dropouts = exposureDropouts(blog.blog_id);
  const dropKey = `exp-drop-${blog.blog_id}`;
  const dropoutHtml = dropouts.length
    ? `<div class="summary-divider" style="margin:18px 0;"></div>
       ${dashMoverSubCard("이탈 포스팅", sliceFor(dropKey, dropouts).map((p, i) => exposureDropoutRowHtml(p, i + 1)).join("") + exposureMoreBtnHtml(dropKey, dropouts.length))}`
    : "";

  const exposedResults = results.filter(r => r.result?.found).sort((a, b) => (a.result.rank || 9999) - (b.result.rank || 9999));
  const exposedKey = `exp-list-${blog.blog_id}`;
  const exposedRowsHtml = sliceFor(exposedKey, exposedResults).map(r => `
      <div class="exposure-row">
        <span class="exposure-cat-badge${r.kw.category === "메인" ? " main" : ""}">${esc(r.kw.category)}</span>
        <span class="exposure-keyword">${esc(r.kw.keyword)}</span>
        <a class="exposure-post-title" href="${esc(r.result.result_url || "#")}" target="_blank" rel="noopener">${esc(r.result.result_title || r.result.result_log_no || "포스팅 확인 필요")}</a>
        <span class="exposure-rank">${r.result.rank}위</span>
        <button class="row-btn" type="button" data-tip="삭제" onclick="removeTargetKeywordHandler(${r.kw.id}, '${esc(r.kw.keyword)}')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18"></path><path d="M8 6V4h8v2"></path><path d="M19 6l-1 14H6L5 6"></path><path d="M10 11v5M14 11v5"></path></svg>
        </button>
      </div>`).join("") + exposureMoreBtnHtml(exposedKey, exposedResults.length);

  const missingKeywordsHtml = results
    .filter(r => !r.result?.found)
    .map(r => `
      <span class="missing-keyword-chip">
        ${esc(r.kw.category)} · ${esc(r.kw.keyword)}${!r.result ? " (수집 전)" : ""}
        <button type="button" onclick="removeTargetKeywordHandler(${r.kw.id}, '${esc(r.kw.keyword)}')">&times;</button>
      </span>`).join("");

  const missingPostsHtml = posts
    .map(p => ({ post: p, check: postTitleCheckFor(blog.blog_id, p.log_no) }))
    .filter(({ check }) => check && !check.found)
    .map(({ post }) => `
      <span class="missing-keyword-chip">
        <a href="${esc(post.post_url)}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none;">${esc(post.title || post.log_no)}</a>
      </span>`).join("");

  return `
    <div class="summary-mini-card app-card">
      <div class="summary-section-title-row app-card-head">
        <div class="summary-section-title-wrap app-card-title-wrap">
          <span class="summary-section-title app-card-title">노출 현황 진단</span>
          <span class="summary-section-subtitle app-card-subtitle">주요 키워드 ${keywords.length}개로 검색했을 때 우리 블로그 포스팅이 노출되는지 확인합니다.</span>
        </div>
        <div style="display:flex;gap:8px;flex-shrink:0;">
          <button class="diagnosis-refresh-btn" type="button" onclick="collectPostTitleCheckHandler('${esc(blog.blog_id)}')">제목 자가진단</button>
          <button class="diagnosis-refresh-btn" type="button" onclick="collectExposureHandler('${esc(blog.blog_id)}')">노출 진단 수집</button>
        </div>
      </div>
      <div class="summary-divider"></div>
      <div class="summary-section-body app-card-body">
        <div class="rank-dash-tiles" style="grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px;">${tilesHtml}</div>
        ${pageBarHtml}
        <div class="summary-divider" style="margin:18px 0;"></div>
        <div class="summary-top3-row-wrap summary-mover-grid">${moverCardsHtml}</div>
        ${dropoutHtml}
        <div class="summary-divider" style="margin:18px 0;"></div>
        ${keywords.length
          ? `${exposedRowsHtml ? `<div class="exposure-list">${exposedRowsHtml}</div>` : `<div class="empty-state" style="padding:16px 4px;font-size:12px;">아직 노출 중인 키워드가 없습니다.</div>`}
             ${missingKeywordsHtml ? `<div style="margin-top:14px;">
               <div style="margin-bottom:6px;color:#8590a3;font-size:11px;font-weight:800;">미노출 키워드</div>
               <div class="missing-keyword-wrap">${missingKeywordsHtml}</div>
             </div>` : ""}`
          : `<div class="empty-state" style="padding:24px 4px;font-size:12px;">등록된 진단 키워드가 없습니다. 아래에서 추가해 주세요.</div>`}
        ${missingPostsHtml ? `<div style="margin-top:14px;">
          <div style="margin-bottom:6px;color:#8590a3;font-size:11px;font-weight:800;">누락된 포스팅 (제목으로 검색해도 안 뜸)</div>
          <div class="missing-keyword-wrap">${missingPostsHtml}</div>
        </div>` : ""}
        <div class="post-keyword-add-row" style="margin-top:16px;">
          <input type="text" placeholder="메인 키워드 추가 (쉼표로 여러 개)" onkeydown="if(event.key==='Enter') addTargetKeywordsBulk('${esc(blog.blog_id)}', '메인', this)">
          <button class="keyword-add-btn" type="button" onclick="addTargetKeywordsBulk('${esc(blog.blog_id)}', '메인', this.previousElementSibling)">+ 메인 추가</button>
        </div>
        <div class="post-keyword-add-row">
          <input type="text" placeholder="서브 키워드 추가 (쉼표로 여러 개)" onkeydown="if(event.key==='Enter') addTargetKeywordsBulk('${esc(blog.blog_id)}', '서브', this)">
          <button class="keyword-add-btn" type="button" onclick="addTargetKeywordsBulk('${esc(blog.blog_id)}', '서브', this.previousElementSibling)">+ 서브 추가</button>
        </div>
      </div>
    </div>`;
}

function bestKeywordForPost(blogId, logNo) {
  const rows = state.postKeywords.filter(kw => kw.blog_id === blogId && kw.log_no === logNo);
  let best = null;
  rows.forEach(kw => {
    const [latest] = latestPair(blogId, logNo, kw.keyword, "naver_blog_screen");
    if (latest?.found && latest.rank != null && (!best || latest.rank < best.rank)) {
      best = { keyword: kw.keyword, rank: latest.rank };
    }
  });
  return best;
}

// 우리가 정하는 자체 최적화 점수 — 노출 비율(최대 70점) + 순위 보너스(1위에 가까울수록 최대 30점).
// 제목 검색 자가진단에서 누락으로 뜬 포스팅은 0점 고정, 등록된 키워드가 없으면 채점하지 않는다(null).
function postContentCheckFor(blogId, logNo) {
  return state.postContentChecks.find(row => row.blog_id === blogId && row.log_no === logNo) || null;
}

// 랭킹추적의 productThumbHtml()과 같은 역할 — 포스팅을 상품처럼 취급해서 어디서든 이 함수로 통일한다.
function postThumbHtml(post) {
  const url = postContentCheckFor(post.blog_id, post.log_no)?.thumbnail_url;
  if (!url) return `<span class="post-thumb empty">IMG</span>`;
  return `<a class="post-thumb-link" href="${esc(post.post_url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" aria-label="포스팅 보기"><img class="post-thumb" src="${esc(url)}" loading="lazy" alt="" referrerpolicy="no-referrer"></a>`;
}

// 우리가 정하는 자체 종합분석 점수 — 글자수(30) + 사진수(25) + 인용구 유무(15) + 외부링크 유무(15) + 댓글수(15).
// 제목 검색 자가진단에서 누락으로 뜬 포스팅은 0점 고정, 본문 분석을 아직 안 돌렸으면 채점하지 않는다(null).
function postOptimizationScore(blogId, logNo) {
  const titleCheck = postTitleCheckFor(blogId, logNo);
  if (titleCheck && !titleCheck.found) return 0;

  const content = postContentCheckFor(blogId, logNo);
  if (!content) return null;

  const charScore = Math.min(1, (content.char_count || 0) / 1000) * 30;
  const imageScore = Math.min(1, (content.image_count || 0) / 6) * 25;
  const quoteScore = (content.quote_count || 0) > 0 ? 15 : 0;
  const linkScore = (content.external_link_count || 0) > 0 ? 15 : 0;
  const commentScore = Math.min(1, (content.comment_count || 0) / 5) * 15;
  return Math.round(charScore + imageScore + quoteScore + linkScore + commentScore);
}

// 랭킹추적의 expandedTrackedItems/toggleTrackedItem과 같은 패턴 — 모달 대신 행을 펼쳐서 상세를 보여준다.
const expandedRecentPosts = new Set();

function togglePostCard(blogId, logNo) {
  const key = `${blogId}::${logNo}`;
  if (expandedRecentPosts.has(key)) expandedRecentPosts.delete(key);
  else expandedRecentPosts.add(key);
  renderDiagnosis();
}

function renderPostDetail(blog, post) {
  const content = postContentCheckFor(blog.blog_id, post.log_no);
  const score = postOptimizationScore(blog.blog_id, post.log_no);
  const keywords = state.postKeywords
    .filter(kw => kw.blog_id === blog.blog_id && kw.log_no === post.log_no)
    .map(kw => ({ kw, latest: latestPair(blog.blog_id, post.log_no, kw.keyword, "naver_blog_screen")[0] }))
    .filter(r => r.latest?.found && r.latest.rank != null)
    .sort((a, b) => a.latest.rank - b.latest.rank);

  return `
    <div class="post-detail-head">
      <span class="post-detail-date">발행일 ${esc(formatDate(post.published_at))}</span>
      <button class="text-btn primary" type="button" onclick="event.stopPropagation(); refreshPostContentCheck('${esc(blog.blog_id)}', '${esc(post.log_no)}')">분석 새로고침</button>
    </div>
    <div class="rank-dash-tiles" style="grid-template-columns:repeat(5,minmax(0,1fr));">
      <div class="dash-tile"><div class="dash-label">글자수</div><div class="dash-value">${content?.char_count != null ? content.char_count.toLocaleString() : "-"}</div></div>
      <div class="dash-tile"><div class="dash-label">사진</div><div class="dash-value">${content?.image_count ?? "-"}</div></div>
      <div class="dash-tile"><div class="dash-label">댓글</div><div class="dash-value">${content?.comment_count ?? "-"}</div></div>
      <div class="dash-tile"><div class="dash-label">인용구/외부링크</div><div class="dash-value">${content ? `${content.quote_count ?? 0} / ${content.external_link_count ?? 0}` : "-"}</div></div>
      <div class="dash-tile"><div class="dash-label">종합분석 점수</div><div class="dash-value">${score != null ? `${score}점` : "-"}</div></div>
    </div>
    <div class="summary-divider" style="margin:14px 0;"></div>
    <div class="post-detail-section-title">이 글의 상위노출 키워드</div>
    ${keywords.length
      ? `<div class="exposure-list">${keywords.map(r => `
          <div class="exposure-row" style="grid-template-columns:1fr 70px;">
            <span class="exposure-keyword">${esc(r.kw.keyword)}</span>
            <span class="exposure-rank">${r.latest.rank}위</span>
          </div>`).join("")}</div>`
      : `<div class="empty-state" style="padding:12px 4px;font-size:12px;">노출 중인 키워드가 없습니다.</div>`}`;
}

function renderRecentPostRow(blog, post) {
  const check = postTitleCheckFor(blog.blog_id, post.log_no);
  const missingLabel = !check ? "확인 전" : check.found ? "정상" : "누락";
  const best = bestKeywordForPost(blog.blog_id, post.log_no);
  const score = postOptimizationScore(blog.blog_id, post.log_no);
  const key = `${blog.blog_id}::${post.log_no}`;
  const isOpen = expandedRecentPosts.has(key);

  return `
    <div class="post-card${isOpen ? " open" : ""}">
      <div class="post-main-row" onclick="togglePostCard('${esc(blog.blog_id)}', '${esc(post.log_no)}')">
        <button type="button" class="expand-btn" aria-label="게시글 상세 보기" onclick="event.stopPropagation(); togglePostCard('${esc(blog.blog_id)}', '${esc(post.log_no)}')"></button>
        ${postThumbHtml(post)}
        <a class="recent-post-title" href="${esc(post.post_url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${esc(post.title || post.log_no)}</a>
        <span class="recent-post-cell${check && !check.found ? " text-bad" : ""}">${esc(missingLabel)}</span>
        <span class="recent-post-cell">${best ? `${esc(best.keyword)} · ${best.rank}위` : "-"}</span>
        <span class="recent-post-cell">${score != null ? `${score}점` : "-"}</span>
        <span class="recent-post-cell">${formatDate(post.published_at)}</span>
        <a class="row-btn" href="${esc(post.post_url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" data-tip="포스팅 보기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><path d="M15 3h6v6"></path><path d="M10 14 21 3"></path></svg>
        </a>
      </div>
      <div class="post-detail">${isOpen ? renderPostDetail(blog, post) : ""}</div>
    </div>`;
}

function renderRecentPostsCard(blog) {
  const posts = state.posts
    .filter(p => p.blog_id === blog.blog_id)
    .sort((a, b) => String(b.published_at || "").localeCompare(String(a.published_at || "")))
    .slice(0, 10);

  const headHtml = `
    <div class="post-main-row head-row">
      <span></span><span></span><span>제목</span><span>누락여부</span><span>상위노출 키워드</span><span>최적화 점수</span><span>발행일</span><span></span>
    </div>`;

  return `
    <div class="summary-mini-card app-card">
      <div class="summary-section-title-row app-card-head">
        <div class="summary-section-title-wrap app-card-title-wrap">
          <span class="summary-section-title app-card-title">최근 게시글 진단</span>
          <span class="summary-section-subtitle app-card-subtitle">최근 발행한 포스팅 ${posts.length}개의 상태를 확인합니다. 행을 누르면 상세가 펼쳐집니다.</span>
        </div>
      </div>
      <div class="summary-divider"></div>
      <div class="summary-section-body app-card-body">
        ${posts.length
          ? `${headHtml}${posts.map(post => renderRecentPostRow(blog, post)).join("")}`
          : `<div class="empty-state" style="padding:24px 4px;font-size:12px;">불러온 포스팅이 없습니다.</div>`}
      </div>
    </div>`;
}

function diagnosisPlaceholderCardsHtml() {
  const sections = [
    { title: "경쟁자 블로그", subtitle: "등록한 경쟁사 블로그와 비교 분석하는 영역입니다.", note: "준비 중입니다." },
  ];
  return sections.map(s => `
    <div class="summary-mini-card app-card">
      <div class="summary-section-title-row app-card-head">
        <div class="summary-section-title-wrap app-card-title-wrap">
          <span class="summary-section-title app-card-title">${esc(s.title)}</span>
          <span class="summary-section-subtitle app-card-subtitle">${esc(s.subtitle)}</span>
        </div>
      </div>
      <div class="summary-divider"></div>
      <div class="summary-section-body app-card-body">
        <div class="empty-state" style="padding:32px 4px;font-size:12px;">${esc(s.note)}</div>
      </div>
    </div>`).join("");
}

function renderDiagnosis() {
  const list = document.getElementById("diagnosisList");
  const mine = state.blogs.filter(blog => blog.is_mine);
  if (!mine.length) {
    list.innerHTML = `
      <div class="rank-card app-card">
        <div class="empty-state">
          <strong>내 블로그로 등록된 블로그가 없습니다.</strong>
          블로그 추가 시 "내 블로그입니다"를 체크해 주세요.
        </div>
      </div>`;
    return;
  }
  list.innerHTML = mine.map(blog => renderDiagnosisCard(blog) + renderExposureCard(blog) + renderRecentPostsCard(blog)).join("") + diagnosisPlaceholderCardsHtml();
}

function renderAll() {
  renderSummary();
  renderRows();
  renderDiagnosis();
}

async function loadData() {
  showLoading("블로그 데이터를 불러오는 중입니다...");
  try {
    const data = await callApi("list");
    state = data;
    renderAll();
  } catch (error) {
    document.getElementById("rankList").innerHTML = `
      <div class="rank-card app-card">
        <div class="empty-state"><strong>블로그 데이터를 불러오지 못했습니다.</strong>${esc(error.message)}</div>
      </div>`;
    showToast(error.message);
  } finally {
    hideLoading();
  }
  autoRefreshDiagnosis();
}

// 블로그차트/웨어이즈포스트(진단)와 RSS/모바일 글 페이지(포스팅 목록·썸네일)는 전부 네이버 "검색"이
// 아니라 가벼운 직접 조회라, 무거운 키워드 순위 수집과 달리 페이지 진입마다 자동으로 새로 조회해도
// 부담이 없다 — 캐시된 값을 먼저 보여준 뒤 조용히 갱신한다.
async function autoRefreshDiagnosis() {
  const mine = state.blogs.filter(blog => blog.is_mine && blog.active);
  if (!mine.length) return;
  try {
    state = await callApi("collectDiagnosis", {});
    renderAll();
  } catch {
    // 진입 시 자동 새로고침 실패는 조용히 무시 — 화면엔 이미 캐시된 값이 떠 있고, 수동 버튼으로 재시도 가능
  }
  try {
    state = await callApi("refreshRecent", {});
    renderAll();
  } catch {
    // 위와 동일하게 조용히 무시
  }
}

function openModal() {
  document.getElementById("targetModal").classList.add("show");
  document.getElementById("targetModal").setAttribute("aria-hidden", "false");
  setTimeout(() => document.getElementById("blogUrlInput").focus(), 50);
}

function closeModal() {
  document.getElementById("targetModal").classList.remove("show");
  document.getElementById("targetModal").setAttribute("aria-hidden", "true");
}

async function refreshDiagnosis(blogId) {
  showLoading("블로그 지수와 방문자 현황을 조회하는 중입니다.");
  try {
    state = await callApi("collectDiagnosis", { blogId });
    renderAll();
    showToast("블로그 진단을 새로고침했습니다.");
  } catch (error) {
    showToast(error.message);
  } finally {
    hideLoading();
  }
}

async function refreshPostContentCheck(blogId, logNo) {
  showLoading("게시글 본문을 분석하는 중입니다.");
  try {
    state = await callApi("collectPostContentCheck", { blogId, logNo });
    renderAll();
    showToast("게시글 분석을 완료했습니다.");
  } catch (error) {

  } finally {

  }
}

async function saveTarget() {
  const blogUrl = document.getElementById("blogUrlInput").value.trim();
  if (!blogUrl) {
    showToast("블로그 주소를 입력해 주세요.");
    return;
  }

  showLoading("블로그를 등록하는 중입니다 (포스팅 자동 수집)...");
  try {
    const data = await callApi("addBlog", {
      blogUrl,
      isMine: document.getElementById("isMineInput").checked,
    });
    state = data;
    closeModal();
    document.getElementById("blogUrlInput").value = "";
    document.getElementById("isMineInput").checked = false;
    renderAll();
    showToast("블로그를 등록하고 포스팅을 가져왔습니다. 포스팅별로 키워드를 추가해 주세요.");
  } catch (error) {
    showToast(error.message);
  } finally {
    hideLoading();
  }
}

async function quickAddPostKeyword(blogId, logNo, inputEl) {
  const keywords = inputEl.value.split(",").map(v => v.trim()).filter(Boolean);
  if (!keywords.length) return showToast("키워드를 입력해 주세요.");
  inputEl.value = "";
  showLoading("키워드를 추가하는 중입니다.");
  try {
    state = await callApi("addPostKeyword", { blogId, logNo, keywords });
    renderAll();
    showToast(`키워드 ${keywords.length}개를 추가했습니다.`);
  } catch (error) {
    showToast(error.message);
  } finally {
    hideLoading();
  }
}

async function refreshPosts(blogId) {
  showLoading("포스팅 목록을 새로고침하는 중입니다.");
  try {
    state = await callApi("refreshPosts", { blogId });
    renderAll();
    showToast("포스팅 목록을 새로고침했습니다.");

    showToast(error.message);
  } finally {

  }
}

async function collectRanks(blogId = "") {
  if (!state.blogs.length) {
    showToast("먼저 추적할 블로그를 추가해 주세요.");
    return;
  }
  showLoading(blogId ? "선택한 블로그 순위를 확인하는 중입니다." : "전체 블로그 순위를 확인하는 중입니다.");
  try {
    const data = await callApi("collect", blogId ? { blogId } : {});
    state = data;
    renderAll();
    if (data.errors?.length) {
      showToast(`수집 완료 · ${data.errors.length}건은 확인이 필요합니다.`);
      console.warn("블로그 순위 수집 오류", data.errors);
    } else {
      showToast("블로그 순위 수집을 완료했습니다.");
    }
  } catch (error) {
    showToast(error.message);
  } finally {
    hideLoading();
  }
}

async function deletePostKeyword(id, keyword) {
  if (!confirm(`"${keyword}" 키워드 추적을 삭제할까요?\n저장된 순위 이력도 함께 삭제됩니다.`)) return;
  showLoading("키워드를 삭제하는 중입니다.");

    state = await callApi("removePostKeyword", { id });
    renderAll();
    showToast("키워드를 삭제했습니다.");

    showToast(error.message);
  } finally {
    hideLoading();
  }
}

async function addTargetKeywordsBulk(blogId, category, inputEl) {
  const keywords = inputEl.value.split(",").map(v => v.trim()).filter(Boolean);
  if (!keywords.length) return showToast("키워드를 입력해 주세요.");

  showLoading("진단 키워드를 추가하는 중입니다.");

  } catch (error) {
    showToast(error.message);
  } finally {
    hideLoading();
  }
}

async function removeTargetKeywordHandler(id, keyword) {
  if (!confirm(`"${keyword}" 진단 키워드를 삭제할까요?`)) return;
  showLoading("키워드를 삭제하는 중입니다.");
  try {
    state = await callApi("removeTargetKeyword", { id });

  } catch (error) {
    showToast(error.message);
  } finally {

  }
}

async function collectExposureHandler(blogId) {
  const keywords = state.targetKeywords.filter(k => k.blog_id === blogId && k.active);
  if (!keywords.length) return showToast("등록된 진단 키워드가 없습니다.");
  const errors = [];
  showLoading(`0/${keywords.length} 키워드 진단 중...`);
  for (let i = 0; i < keywords.length; i++) {
    const kw = keywords[i];
    setLoadingMessage(`${i + 1}/${keywords.length} "${kw.keyword}" 확인 중...`);
    try {
      state = await callApi("collectExposure", { blogId, keyword: kw.keyword });
      renderAll();
    } catch (error) {
      errors.push({ keyword: kw.keyword, message: error.message });
    }
  }
  setLoadingMessage("포스팅 목록·썸네일을 새로고침하는 중...");
  try {
    state = await callApi("refreshRecent", { blogId });
    renderAll();
  } catch (error) {
    console.warn("포스팅 새로고침 실패", error);
  }
  hideLoading();
  if (errors.length) {
    showToast(`진단 완료 · ${errors.length}건은 확인이 필요합니다.`);
    console.warn("노출 현황 진단 오류", errors);
  } else {
    showToast(`키워드 ${keywords.length}개 진단을 완료했습니다.`);
  }
}

async function collectPostTitleCheckHandler(blogId) {
  const posts = state.posts.filter(p => p.blog_id === blogId);
  if (!posts.length) return showToast("확인할 포스팅이 없습니다.");
  const errors = [];
  showLoading(`0/${posts.length} 포스팅 제목 확인 중...`);
  for (let i = 0; i < posts.length; i++) {
    const post = posts[i];
    setLoadingMessage(`${i + 1}/${posts.length} 포스팅 제목 확인 중...`);
    try {
      state = await callApi("collectPostTitleCheck", { blogId, logNo: post.log_no });
      renderAll();
    } catch (error) {
      errors.push({ logNo: post.log_no, message: error.message });
    }
  }
  hideLoading();
  if (errors.length) {
    showToast(`자가진단 완료 · ${errors.length}건은 확인이 필요합니다.`);
    console.warn("포스팅 제목 자가진단 오류", errors);
  } else {
    showToast(`포스팅 ${posts.length}개 자가진단을 완료했습니다.`);
  }
}

async function deleteBlog(blogId, blogName) {
  if (!confirm(`"${blogName}" 블로그 추적을 삭제할까요?\n등록된 키워드와 순위 이력이 모두 삭제됩니다.`)) return;
  showLoading("블로그를 삭제하는 중입니다.");
  try {
    state = await callApi("removeBlog", { blogId });
    renderAll();
    showToast("블로그를 삭제했습니다.");
  } catch (error) {
    showToast(error.message);
  } finally {
    hideLoading();
  }
}

document.getElementById("targetModal").addEventListener("click", event => {
  if (event.target.id === "targetModal") closeModal();
});
document.addEventListener("keydown", event => {
  if (event.key === "Escape") closeModal();
});

document.addEventListener("click", event => {
  const toggle = event.target.closest('[data-action="toggle-exposure-mover"]');
  if (!toggle) return;
  const key = toggle.dataset.moverKey;
  if (exposureMoverExpanded.has(key)) exposureMoverExpanded.delete(key);
  else exposureMoverExpanded.add(key);
  renderDiagnosis();
});

function setBlogView(view) {
  const nextView = view === "diagnosis" ? "diagnosis" : "rank";
  document.querySelectorAll("[data-blog-view]").forEach(tab => {
    tab.classList.toggle("active", tab.dataset.blogView === nextView);
  });
  document.getElementById("blogDiagnosisView").hidden = nextView !== "diagnosis";
  document.getElementById("blogRankView").hidden = nextView !== "rank";
  document.getElementById("rankHeadActions").hidden = nextView !== "rank";
}

document.querySelector(".app-title-tabs")?.addEventListener("click", event => {
  const tab = event.target.closest("[data-blog-view]");
  if (!tab) return;
  setBlogView(tab.dataset.blogView);
});

setBlogView("diagnosis");
loadData();
</script>
