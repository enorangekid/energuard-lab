// 방문자/블로그순위/유효키워드는 단위·규모가 완전히 달라서 한 그래프에 같이 못 그린다
// (축 두 개짜리 그래프는 만들지 않는다) — 랭킹추적 순위 그래프(renderTrendWrap)와 같은 컴포넌트를
// 재사용한다.
function blogMetricHistory(blogId, field) {
  return state.diagnosis
    .filter(row => row.blog_id === blogId && row[field] != null)
    .map(row => ({ date: row.snapshot_date, value: Number(row[field]) }))
    .sort((a, b) => a.date.localeCompare(b.date));
}

// category_rank/valid_keyword_count는 블로그차트 원본이 주 1회(월요일 즈음)만 갱신된다 —
// 우리 크론은 매일 돌지만 값 자체는 다음 월요일까지 그대로다. 복잡하게 "값이 바뀐 지점만
// 남기기" 대신, 그냥 월요일 행만 골라서 원래 주기 그대로 보여준다.
function mondayOnlyMetricRows(rows) {
  return rows.filter(row => new Date(row.date + "T00:00:00Z").getUTCDay() === 1);
}

const BLOG_METRIC_TREND_OPTIONS = {
  visitors: { optionLabel: "방문자", title: "방문자 추이", field: "visitors_today", invert: false, unit: "명", ranges: TREND_RANGES_DAILY },
  rank: { optionLabel: "블로그 순위", title: "블로그 순위 추이", field: "category_rank", invert: true, unit: "위", weekly: true, ranges: TREND_RANGES_WEEKLY },
  keywordCount: { optionLabel: "유효키워드", title: "유효키워드 추이", field: "valid_keyword_count", invert: false, unit: "개", weekly: true, ranges: TREND_RANGES_WEEKLY },
};
let blogMetricTrendKey = "visitors";

function changeBlogMetricTrend(blogId, key) {
  if (!BLOG_METRIC_TREND_OPTIONS[key]) return;
  blogMetricTrendKey = key;
  mountMetricTrendChart(blogId);
}

// "지표 추이" — 대시보드("지표 현황") 카드와 분리된 독립 카드.
// 그래프는 랭킹추적의 순위 그래프와 같은 형태로 보여준다.
function renderMetricTrendCard(blog) {
  const option = BLOG_METRIC_TREND_OPTIONS[blogMetricTrendKey];
  return `
    <div class="summary-mini-card app-card">
      <div class="summary-section-title-row app-card-head">
        <div class="summary-section-title-wrap app-card-title-wrap">
          <span class="summary-section-title app-card-title">지표 추이</span>
          <span class="summary-section-subtitle app-card-subtitle">${esc(blog.blog_name || blog.blog_id)} · 주간 단위로 쌓인 지표 흐름입니다.</span>
        </div>
      </div>
      <div class="summary-divider"></div>
      <div class="summary-section-body app-card-body" style="padding:0;">
        <div class="summary-section-title-row app-card-head" style="padding:16px 20px 0;">
          <span class="summary-top3-title" style="margin-bottom:0;">${esc(option.title)}</span>
          <div style="display:flex;align-items:center;gap:8px;">
            <select class="period-select" onchange="changeBlogMetricTrend('${esc(blog.blog_id)}', this.value)">
              ${Object.entries(BLOG_METRIC_TREND_OPTIONS).map(([key, opt]) =>
                `<option value="${key}"${key === blogMetricTrendKey ? " selected" : ""}>${esc(opt.optionLabel)}</option>`).join("")}
            </select>
          </div>
        </div>
        <div class="metric-trend-rank-body" id="metricTrendBody-${esc(blog.blog_id)}"></div>
      </div>
    </div>`;
}

function mountMetricTrendChart(blogId) {
  const bodyId = `metricTrendBody-${blogId}`;
  const body = document.getElementById(bodyId);
  if (!body) return;

  const option = BLOG_METRIC_TREND_OPTIONS[blogMetricTrendKey];
  const allRows = blogMetricHistory(blogId, option.field);
  const rows = option.weekly ? mondayOnlyMetricRows(allRows) : allRows;
  const formatter = value => `${Number(value).toLocaleString()}${option.unit}`;
  body.innerHTML = renderTrendWrap(option.title, rows, "value", formatter, option.invert, null, "month1", option.ranges);
}

function latestExposure(blogId, keyword, provider) {
  return state.exposureHistory
    .filter(row => row.blog_id === blogId && row.keyword === keyword && row.provider === provider)
    .sort((a, b) => String(b.collected_at).localeCompare(String(a.collected_at)))[0] || null;
}

function postTitleCheckFor(blogId, logNo) {
  return state.postTitleChecks.find(row => row.blog_id === blogId && row.log_no === logNo) || null;
}

function exposureHistoryFor(blogId, keyword, provider) {
  return state.exposureHistory
    .filter(row => row.blog_id === blogId && row.keyword === keyword && row.provider === provider)
    .sort((a, b) => String(b.collected_at).localeCompare(String(a.collected_at)));
}

function exposureRankHistory(blogId, keyword, provider = "naver_blog_screen") {
  const rows = exposureHistoryFor(blogId, keyword, provider);
  const byDate = new Map();
  rows.forEach(row => {
    const date = String(row.checked_date || row.collected_at || "").slice(0, 10);
    if (!date || byDate.has(date) || !row.found || row.rank == null) return;
    byDate.set(date, Number(row.rank));
  });
  return [...byDate.entries()].map(([date, rank]) => ({ date, rank })).sort((a, b) => a.date.localeCompare(b.date));
}

function renderExposureRankGraph(blogId, keyword) {
  const rows = exposureHistoryFor(blogId, keyword, "naver_blog_screen");
  const latest = rows[0];
  const history = exposureRankHistory(blogId, keyword, "naver_blog_screen");
  const lastGraphDate = history.at(-1)?.date;
  const latestDate = String(latest?.checked_date || latest?.collected_at || "").slice(0, 10);
  const dropMarker = latest && !latest.found && latestDate && (!lastGraphDate || latestDate > lastGraphDate)
    ? { date: latestDate }
    : null;
  return `<div class="exposure-rank-detail">${renderTrendWrap("순위 그래프", history, "rank", value => `${value}위`, true, dropMarker)}</div>`;
}

// 랭킹추적의 "순위 더보기"(moverExpandedCards)와 동일한 패턴 — 기본 3개만 보이고 눌러야 펼쳐진다.
const exposureMoverExpanded = new Set();
const EXPOSURE_MOVER_LIMIT = 10;
function exposureMoreBtnHtml(key, totalCount, threshold = 3) {
  if (totalCount <= threshold) return "";
  const expanded = exposureMoverExpanded.has(key);
  return `<button type="button" class="summary-top3-more" data-action="toggle-exposure-mover" data-mover-key="${esc(key)}">${expanded ? "간략히 보기" : "순위 더보기"} <span>${expanded ? "−" : "+"}</span></button>`;
}

function exposureMovers(blogId) {
  const keywords = state.targetKeywords.filter(k => k.blog_id === blogId);
  const moves = keywords.map(kw => {
    const rows = exposureHistoryFor(blogId, kw.keyword, "naver_blog_screen");
    const current = rows[0];
    const previous = rows[1];
    if (!current || !previous || !current.found || !previous.found || current.rank == null || previous.rank == null) return null;
    const delta = previous.rank - current.rank; // 양수면 순위 상승(숫자가 작아짐)
    if (delta === 0) return null;
    return { kw, current, previous, delta };
  }).filter(Boolean);

  const byCategory = (category, dir) => moves
    .filter(m => m.kw.category === category && (dir === "up" ? m.delta > 0 : m.delta < 0))
    .sort((a, b) => dir === "up" ? b.delta - a.delta : a.delta - b.delta);

  return {
    mainUp: byCategory("메인", "up"),
    mainDown: byCategory("메인", "down"),
    subUp: byCategory("서브", "up"),
    subDown: byCategory("서브", "down"),
  };
}

function exposureDropouts(blogId) {
  const keywords = state.targetKeywords.filter(k => k.blog_id === blogId);
  const byPost = new Map();
  keywords.forEach(kw => {
    const rows = exposureHistoryFor(blogId, kw.keyword, "naver_blog_screen");
    const current = rows[0];
    const previous = rows[1];
    if (!current || !previous || !previous.found || current.found) return;
    const key = previous.result_log_no || previous.result_title || previous.result_url || kw.keyword;
    if (!byPost.has(key)) {
      byPost.set(key, { title: previous.result_title, url: previous.result_url, logNo: previous.result_log_no, keywords: [] });
    }
    byPost.get(key).keywords.push({ keyword: kw.keyword, prevRank: previous.rank, prevDate: previous.checked_date });
  });
  return [...byPost.values()];
}

// "누락 포스팅" 대시보드 카드 — postTitleCheckFor()가 이미 개별 포스팅 카드의 강조 표시에
// 쓰는 것과 같은 데이터(blog_rank_post_title_check, found:false)를 대시보드 요약 카드로도
// 보여준다(2026-08-10 요청, "이탈 포스팅" 옆에 나란히). "이탈"과 달리 별도 keyword 이력
// 비교가 필요없어 postTitleChecks를 바로 훑는다.
function missingPostsFor(blogId) {
  return state.postTitleChecks
    .filter(row => row.blog_id === blogId && row.found === false)
    .map(row => {
      const post = state.posts.find(p => p.blog_id === blogId && p.log_no === row.log_no);
      return { title: post?.title, url: post?.post_url, logNo: row.log_no, missingSince: row.missing_since, checkedAt: row.checked_at };
    })
    .sort((a, b) => String(b.missingSince || b.checkedAt || "").localeCompare(String(a.missingSince || a.checkedAt || "")));
}

// 저장된 시각은 UTC(예: "2026-08-10T23:06:29+00:00")인데 그 문자열 앞 10자리만 그대로
// 잘라 쓰면 한국시간 기준 실제 날짜(위 예시는 KST 08-11 08:06)보다 하루 밀려 보인다
// (2026-08-11 지적). 9시간 더한 뒤 날짜만 뽑아 KST 달력 날짜로 맞춘다.
function kstDateOnly(isoString) {
  if (!isoString) return "";
  const d = new Date(isoString);
  if (Number.isNaN(d.getTime())) return "";
  return new Date(d.getTime() + 9 * 3600 * 1000).toISOString().slice(0, 10);
}

function exposureMissingRowHtml(post, rank) {
  const nameHtml = post.url
    ? `<a class="summary-top3-name" href="${esc(post.url)}" target="_blank" rel="noopener" title="${esc(post.title || post.logNo || "")}">${esc(post.title || post.logNo || "포스팅 확인 필요")}</a>`
    : `<span class="summary-top3-name">${esc(post.title || post.logNo || "포스팅 확인 필요")}</span>`;
  // missing_since(누락이 처음 감지된 날짜)가 있으면 그걸 쓰고, 아직 마이그레이션 전이라
  // 값이 비어있는 예전 행이면 마지막 체크일로 대신한다(2026-08-10).
  const dateText = post.missingSince
    ? `${esc(kstDateOnly(post.missingSince))}부터`
    : post.checkedAt ? `${esc(kstDateOnly(post.checkedAt))} 확인` : "-";
  // "이탈 포스팅"의 키워드 칩(.dropout-keyword-chip)과 같은 스타일로 맞췄다 — 밋밋한 텍스트
  // 한 줄 대신 강조 배지 형태로(2026-08-11 요청).
  return `<div class="summary-mover-row">
    <div class="summary-mover-row-main">
      <span class="summary-top3-rank">${rank}</span>
      ${nameHtml}
      <span class="summary-mover-delta down">누락</span>
    </div>
    <div class="summary-mover-row-detail dropout-keywords">
      <span class="dropout-keyword-chip">제목 검색 <span class="dropout-keyword-rank">${dateText}</span></span>
    </div>
  </div>`;
}

function exposurePageDistribution(blogId) {
  const keywords = state.targetKeywords.filter(k => k.blog_id === blogId);
  let page1 = 0, page23 = 0, page4plus = 0;
  keywords.forEach(kw => {
    const current = exposureHistoryFor(blogId, kw.keyword, "naver_blog_screen")[0];
    if (!current?.found || current.page == null) return;
    if (current.page === 1) page1 += 1;
    else if (current.page <= 3) page23 += 1;
    else page4plus += 1;
  });
  return { page1, page23, page4plus };
}

// 랭킹추적 대시보드의 "급상승 상품" 카드와 같은 형태 — 포스팅 제목이 메인 행(+순위 등락),
// 키워드·이전순위→현재순위가 상세 행. 거기서는 상품이 주인공이고 키워드가 상세였듯,
// 여기서는 포스팅이 주인공이고 키워드가 상세다.
function moverKeywordRowHtml(m, rank) {
  const up = m.delta > 0;
  const postTitle = m.current.result_title || m.current.result_log_no || "포스팅 확인 필요";
  const postUrl = m.current.result_url || "#";
  const thumbUrl = m.current.result_log_no ? postContentCheckFor(m.current.blog_id, m.current.result_log_no)?.thumbnail_url : null;
  const thumbHtml = thumbUrl ? `<img class="chip-thumb" src="${esc(thumbUrl)}" loading="lazy" alt="" referrerpolicy="no-referrer">` : "";
  return `<div class="summary-mover-row">
    <div class="summary-mover-row-main">
      <span class="summary-top3-rank">${rank}</span>
      ${thumbHtml}
      <a class="summary-top3-name" href="${esc(postUrl)}" target="_blank" rel="noopener" title="${esc(postTitle)}">${esc(postTitle)}</a>
      <span class="summary-mover-delta ${up ? "up" : "down"}">${up ? "▲" : "▼"}${Math.abs(m.delta)}</span>
    </div>
    <div class="summary-mover-row-detail">${esc(m.kw.keyword)} · ${m.previous.rank}위 → ${m.current.rank}위</div>
  </div>`;
}

function dashMoverSubCard(title, rowsHtml) {
  const body = rowsHtml || `<div class="empty-state" style="padding:8px 0;font-size:12px;">데이터가 없습니다.</div>`;
  return `<div class="summary-top3-card"><div class="summary-top3-title">${esc(title)}</div>${body}</div>`;
}

function exposureDropoutRowHtml(post, rank) {
  const nameHtml = post.url
    ? `<a class="summary-top3-name" href="${esc(post.url)}" target="_blank" rel="noopener" title="${esc(post.title || post.logNo || "")}">${esc(post.title || post.logNo || "포스팅 확인 필요")}</a>`
    : `<span class="summary-top3-name">${esc(post.title || post.logNo || "포스팅 확인 필요")}</span>`;
  const chips = post.keywords.map(k => `<span class="dropout-keyword-chip">${esc(k.keyword)} <span class="dropout-keyword-rank">최근 ${k.prevRank}위 · ${esc(String(k.prevDate || "").slice(5).replace("-", "/"))} 이후</span></span>`).join("");
  return `<div class="summary-mover-row">
    <div class="summary-mover-row-main">
      <span class="summary-top3-rank">${rank}</span>
      ${nameHtml}
      <span class="summary-mover-delta down">이탈 ${post.keywords.length}건</span>
    </div>
    <div class="summary-mover-row-detail dropout-keywords">${chips}</div>
  </div>`;
}

function renderExposureCard(blog, mode = "full") {
  const compact = mode === "compact";
  const keywords = state.targetKeywords.filter(k => k.blog_id === blog.blog_id);
  const results = keywords.map(k => ({ kw: k, result: latestExposure(blog.blog_id, k.keyword, "naver_blog_screen") }));
  const checkedCount = results.filter(r => r.result).length;
  const exposedCount = results.filter(r => r.result?.found).length;
  const notExposedCount = checkedCount - exposedCount;
  const exposureRate = checkedCount ? Math.round((exposedCount / checkedCount) * 100) : null;

  const posts = state.posts.filter(p => p.blog_id === blog.blog_id);

  const pageDist = exposurePageDistribution(blog.blog_id);
  const rankedTotal = pageDist.page1 + pageDist.page23 + pageDist.page4plus;
  const pagePct = n => rankedTotal ? Math.round(n / rankedTotal * 100) : 0;
  const pageSegs = [
    { label: "1페이지", count: pageDist.page1, color: "#e85d2f" },
    { label: "2~3페이지", count: pageDist.page23, color: "#f4a988" },
    { label: "4페이지 이하", count: pageDist.page4plus, color: "#fbdccb" },
  ].filter(seg => seg.count > 0);
  const pageBarHtml = rankedTotal ? `
    <div class="dash-bar-wrap">
      <div class="dash-bar">${pageSegs.map(seg => `<span class="dash-bar-seg" style="flex:${seg.count};background:${seg.color};" title="${seg.label} ${seg.count}개 (${pagePct(seg.count)}%)"></span>`).join("")}</div>
      <div class="dash-legend">${pageSegs.map(seg => `<span class="dash-legend-item"><span class="dash-legend-dot" style="background:${seg.color};"></span>${seg.label} <b>${seg.count}개</b> · ${pagePct(seg.count)}%</span>`).join("")}</div>
    </div>` : "";

  const movers = exposureMovers(blog.blog_id);
  const mainUpKey = `exp-mup-${blog.blog_id}`, mainDownKey = `exp-mdown-${blog.blog_id}`, subUpKey = `exp-sup-${blog.blog_id}`, subDownKey = `exp-sdown-${blog.blog_id}`;
  const sliceFor = (key, list) => list.slice(0, exposureMoverExpanded.has(key) ? EXPOSURE_MOVER_LIMIT : 3);
  const moverCardsHtml = [
    dashMoverSubCard("메인 키워드 상승", sliceFor(mainUpKey, movers.mainUp).map((m, i) => moverKeywordRowHtml(m, i + 1)).join("") + exposureMoreBtnHtml(mainUpKey, movers.mainUp.length)),
    dashMoverSubCard("메인 키워드 하락", sliceFor(mainDownKey, movers.mainDown).map((m, i) => moverKeywordRowHtml(m, i + 1)).join("") + exposureMoreBtnHtml(mainDownKey, movers.mainDown.length)),
    dashMoverSubCard("보조 키워드 상승", sliceFor(subUpKey, movers.subUp).map((m, i) => moverKeywordRowHtml(m, i + 1)).join("") + exposureMoreBtnHtml(subUpKey, movers.subUp.length)),
    dashMoverSubCard("보조 키워드 하락", sliceFor(subDownKey, movers.subDown).map((m, i) => moverKeywordRowHtml(m, i + 1)).join("") + exposureMoreBtnHtml(subDownKey, movers.subDown.length)),
  ].join("");

  const dropouts = exposureDropouts(blog.blog_id);
  const dropKey = `exp-drop-${blog.blog_id}`;
  const dropoutHtml = dropouts.length
    ? dashMoverSubCard("이탈 포스팅", sliceFor(dropKey, dropouts).map((p, i) => exposureDropoutRowHtml(p, i + 1)).join("") + exposureMoreBtnHtml(dropKey, dropouts.length))
    : "";

  // "이탈 포스팅" 옆에 나란히 — 제목 검색 자가진단(누락여부 체크)에서 found:false로 확인된
  // 포스팅(2026-08-10 추가).
  const missingPosts = missingPostsFor(blog.blog_id);
  const missingKey = `exp-missing-${blog.blog_id}`;
  const missingHtml = missingPosts.length
    ? dashMoverSubCard("누락 포스팅", sliceFor(missingKey, missingPosts).map((p, i) => exposureMissingRowHtml(p, i + 1)).join("") + exposureMoreBtnHtml(missingKey, missingPosts.length))
    : "";
  const dropRowHtml = (dropoutHtml || missingHtml)
    ? `<div class="summary-top3-row-wrap summary-mover-grid">${dropoutHtml}${missingHtml}</div>`
    : "";

  const sortedResults = [...results].sort((a, b) => {
    const ar = a.result?.found && a.result.rank != null ? Number(a.result.rank) : 99999;
    const br = b.result?.found && b.result.rank != null ? Number(b.result.rank) : 99999;
    return ar - br || a.kw.keyword.localeCompare(b.kw.keyword, "ko");
  });
  // 체크 시각 표시용(collected_at, 실제 타임스탬프)과 전일/전주 비교 기준일(checked_date, 이미
  // KST로 보정된 날짜 문자열)은 서로 다른 값이라 분리한다 — 예전엔 checked_date(날짜만, 시간정보
  // 없음)를 화면 표시에도 그대로 썼는데, "2026-07-31" 같은 날짜만 있는 문자열은 new Date()가
  // UTC 자정으로 해석해버려서 KST로 표시하면 실제 수집 시각과 무관하게 항상 "오전 9시"로 보였다.
  const checkedAt = sortedResults
    .map(r => r.result?.collected_at || r.result?.checked_date)
    .filter(Boolean)
    .sort()
    .pop();
  const checkedRate = keywords.length ? Math.round((checkedCount / keywords.length) * 100) : 0;
  const checkedDate = sortedResults
    .map(r => r.result?.checked_date)
    .filter(Boolean)
    .sort()
    .pop() || String(checkedAt || "").slice(0, 10);
  const shiftDate = (date, days) => {
    if (!date) return "";
    const d = new Date(`${date}T00:00:00+09:00`);
    if (Number.isNaN(d.getTime())) return "";
    d.setDate(d.getDate() + days);
    return new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Seoul" }).format(d);
  };
  const dateStats = date => {
    if (!date) return null;
    let checked = 0, found = 0, page1 = 0;
    keywords.forEach(kw => {
      const row = state.exposureHistory.find(item =>
        item.blog_id === blog.blog_id &&
        item.keyword === kw.keyword &&
        item.provider === "naver_blog_screen" &&
        String(item.checked_date || item.collected_at || "").slice(0, 10) === date
      );
      if (!row) return;
      checked += 1;
      if (row.found) {
        found += 1;
        const rank = row.rank != null ? Number(row.rank) : null;
        const page = row.page || (rank != null ? Math.ceil(rank / 30) : null);
        if (page === 1) page1 += 1;
      }
    });
    if (!checked) return null;
    return { checked, found, missing: checked - found, rate: Math.round((found / checked) * 100), page1 };
  };
  const yesterdayStats = dateStats(shiftDate(checkedDate, -1));
  const lastWeekStats = dateStats(shiftDate(checkedDate, -7));
  const cmpChip = (label, current, previous, inverse = false, suffix = "") => {
    if (current == null || previous == null) return `<span class="cmp">${label} 데이터 없음</span>`;
    const diff = current - previous;
    if (!diff) return `<span class="cmp">${label} -</span>`;
    const good = inverse ? diff < 0 : diff > 0;
    return `<span class="cmp ${good ? "up" : "down"}">${label} ${diff > 0 ? "▲" : "▼"}${Math.abs(diff).toLocaleString()}${suffix}</span>`;
  };
  const statCardsHtml = [
    { label: "체크 키워드", value: keywords.length.toLocaleString(), unit: "개", subHtml: `<span class="cmp">수집 ${checkedCount.toLocaleString()}개 · ${checkedRate}%</span>`, tip: "등록한 진단 키워드 수와, 그중 오늘까지 순위 수집을 완료한 개수입니다." },
    { label: "노출중", value: exposedCount.toLocaleString(), unit: "개", cls: "up", subHtml: cmpChip("전일", exposedCount, yesterdayStats?.found) + cmpChip("전주", exposedCount, lastWeekStats?.found), tip: "검색 시 우리 블로그 포스팅이 결과에 걸린 키워드 수입니다." },
    { label: "미노출", value: notExposedCount.toLocaleString(), unit: "개", cls: "down", subHtml: cmpChip("전일", notExposedCount, yesterdayStats?.missing, true) + cmpChip("전주", notExposedCount, lastWeekStats?.missing, true), tip: "검색해봤지만 우리 블로그 포스팅이 안 걸린 키워드 수입니다." },
    { label: "노출률", value: exposureRate != null ? exposureRate : "-", unit: exposureRate != null ? "%" : "", subHtml: cmpChip("전일", exposureRate, yesterdayStats?.rate, false, "%p") + cmpChip("전주", exposureRate, lastWeekStats?.rate, false, "%p"), tip: "진단 키워드 중 노출중 비율입니다." },
    { label: "1페이지", value: pageDist.page1.toLocaleString(), unit: "개", subHtml: cmpChip("전일", pageDist.page1, yesterdayStats?.page1) + cmpChip("전주", pageDist.page1, lastWeekStats?.page1), tip: "노출 중인 키워드 중 검색 결과 1페이지(30위 이내)에 걸린 키워드 수입니다." },
  ].map(card => `
    <div class="dash-tile">
      <div class="dash-label">${esc(card.label)}<span class="dash-info">?<span class="dash-tip">${esc(card.tip)}</span></span></div>
      <div class="dash-value ${card.cls || ""}">${card.value}${card.unit ? `<small>${esc(card.unit)}</small>` : ""}</div>
      <div class="metric-cmp">${card.subHtml}</div>
    </div>`).join("");

  if (!compact) {
    const selectionKey = kw => exposureSelectionKey(blog.blog_id, kw.keyword);
    const selectedCount = keywords.filter(kw => exposureSelectedKeywords.has(selectionKey(kw))).length;
    const renderKeywordChip = kw => {
      const isMain = kw.category === "메인";
      const active = exposureSelectedKeywords.has(selectionKey(kw));
      return `<button type="button" class="exposure-batch-banner ${isMain ? "main" : "sub"}${active ? " active" : ""}" data-exposure-blog="${esc(blog.blog_id)}" data-exposure-keyword="${esc(kw.keyword)}" onclick="toggleExposureKeyword(this)" title="${esc(kw.keyword)}">${esc(kw.keyword)}</button>`;
    };
    const keywordGroupsHtml = ["메인", "서브"].map(category => {
      const group = keywords.filter(kw => kw.category === category);
      return `<div>
        <div class="exposure-batch-divider">${category === "서브" ? "보조" : category}</div>
        <div class="exposure-batch-grid" data-exposure-grid="${esc(blog.blog_id)}-${category === "메인" ? "main" : "sub"}">
          ${group.length ? group.map(renderKeywordChip).join("") : `<span class="missing-keyword-chip">등록된 ${displayKeywordCategory(category)} 키워드 없음</span>`}
        </div>
      </div>`;
    }).join("");
    const uncheckedCount = Math.max(0, keywords.length - checkedCount);
    const rankText = row => {
      if (!row) return "-";
      if (!row.found || row.rank == null) return "미노출";
      return `${row.rank}위`;
    };
    const rankBadgeHtml = (row, tone = "current") => {
      if (!row) return `<span class="exposure-rank-badge empty">미수집</span>`;
      if (!row.found || row.rank == null) {
        return `<span class="exposure-rank-badge ${tone === "prev" ? "prev" : "none"}">미노출</span>`;
      }
      const rank = Number(row.rank);
      const page = row.page || Math.ceil(rank / 30);
      const cls = tone === "prev"
        ? "prev"
        : page <= 1
          ? "current p1"
          : page <= 3
            ? "current p23"
            : page <= 9
              ? "current p49"
              : "current low";
      return `<span class="exposure-rank-badge ${cls}">${rank}위</span>`;
    };
    const deltaHtml = (current, previous) => {
      if (!current) return `<span class="exposure-delta">-</span>`;
      if (current.found && (!previous || !previous.found)) return `<span class="exposure-delta up">▲신규</span>`;
      if (!current.found && previous?.found) return `<span class="exposure-delta down">▼이탈</span>`;
      if (!current.found || !previous?.found || current.rank == null || previous.rank == null) return `<span class="exposure-delta">-</span>`;
      const delta = previous.rank - current.rank;
      if (delta > 0) return `<span class="exposure-delta up">▲${delta}</span>`;
      if (delta < 0) return `<span class="exposure-delta down">▼${Math.abs(delta)}</span>`;
      return `<span class="exposure-delta same">-</span>`;
    };
    const tableRowsHtml = sortedResults.map(({ kw, result }) => {
      const rows = exposureHistoryFor(blog.blog_id, kw.keyword, "naver_blog_screen");
      const current = rows[0] || result;
      const previous = rows[1];
      const rowKey = exposureSelectionKey(blog.blog_id, kw.keyword);
      const isOpen = exposureExpandedRows.has(rowKey);
      const matchedPost = current?.result_log_no
        ? state.posts.find(post => post.blog_id === blog.blog_id && String(post.log_no) === String(current.result_log_no))
        : null;
      const postTitle = current?.found ? (current.result_title || current.result_log_no || "포스팅 확인 필요") : (current ? "노출된 포스팅 없음" : "수집 전");
      const postUrl = current?.result_url || "#";
      const publishedText = current?.found ? formatDate(matchedPost?.published_at) : "-";
      return `<div class="exposure-table-block${isOpen ? " open" : ""}">
        <div class="exposure-table-row">
          <button class="expand-btn" type="button" aria-label="${isOpen ? "닫기" : "펼치기"}" data-exposure-blog="${esc(blog.blog_id)}" data-exposure-keyword="${esc(kw.keyword)}" onclick="toggleExposureResultRow(this)"></button>
          <div class="exposure-cell-keyword">
            <span class="exposure-cat-badge${kw.category === "메인" ? " main" : ""}">${esc(displayKeywordCategory(kw.category))}</span>
            <span class="exposure-keyword">${esc(kw.keyword)}</span>
          </div>
          <div class="exposure-cell-rank">${rankBadgeHtml(current, "current")}</div>
          <div class="exposure-cell-muted">${rankBadgeHtml(previous, "prev")}</div>
          ${deltaHtml(current, previous)}
          ${current?.found ? `<a class="exposure-cell-post" href="${esc(postUrl)}" target="_blank" rel="noopener" title="${esc(postTitle)}">${esc(postTitle)}</a>` : `<span class="exposure-cell-post">${esc(postTitle)}</span>`}
          ${current?.found ? `<span class="exposure-result-badge">노출</span>` : `<span class="exposure-result-text">-</span>`}
          <span class="exposure-cell-date">${esc(publishedText)}</span>
        </div>
        ${isOpen ? renderExposureRankGraph(blog.blog_id, kw.keyword) : ""}
      </div>`;
    }).join("");

    return `
      <div class="blog-diagnosis-stack">
        <section class="summary-mini-card app-card exposure-dashboard-section">
          <div class="summary-section-title-row app-card-head">
            <div class="summary-section-title-wrap app-card-title-wrap">
              <span class="summary-section-title app-card-title">노출 현황 진단</span>
              <span class="summary-section-subtitle app-card-subtitle">설정한 키워드의 노출 상태를 한눈에 확인합니다.</span>
            </div>
            <div class="exposure-check-time">체크 시각: ${checkedAt ? formatTime(checkedAt) : "-"}</div>
          </div>
          <div class="summary-divider"></div>
          <div class="summary-section-body app-card-body">
            <div class="rank-dash-tiles">${statCardsHtml}</div>
            ${pageBarHtml}
          </div>
        </section>

        <section class="summary-mini-card app-card exposure-keyword-section">
          <div class="summary-section-title-row app-card-head">
            <div class="summary-section-title-wrap app-card-title-wrap">
              <span class="summary-section-title app-card-title">모니터링 키워드</span>
              <span class="summary-section-subtitle app-card-subtitle">메인·보조 키워드를 선택하고 진단을 수집합니다.</span>
            </div>
            <button class="diagnosis-refresh-btn" type="button" onclick="collectPostTitleCheckHandler('${esc(blog.blog_id)}')">누락여부 체크</button>
          </div>
          <div class="summary-divider"></div>
          <div class="summary-section-body app-card-body">
            <div class="exposure-batch-utils">
              <button type="button" class="exposure-batch-banner util" onclick="toggleAllExposureKeywords('${esc(blog.blog_id)}', '메인')">메인 선택</button>
              <button type="button" class="exposure-batch-banner util" onclick="toggleAllExposureKeywords('${esc(blog.blog_id)}', '서브')">보조 선택</button>
              <button type="button" class="exposure-batch-banner util" onclick="addExposureKeywordPrompt('${esc(blog.blog_id)}', '메인')">메인 추가</button>
              <button type="button" class="exposure-batch-banner util" onclick="addExposureKeywordPrompt('${esc(blog.blog_id)}', '서브')">보조 추가</button>
            </div>
            <div class="exposure-keyword-groups">${keywordGroupsHtml}</div>
            <div class="exposure-batch-run-wrap${selectedCount ? " show" : ""}">
              <button class="exposure-batch-run-btn" type="button" onclick="collectExposureHandler('${esc(blog.blog_id)}')">선택한 ${selectedCount}개 키워드 수집 시작</button>
            </div>
          </div>
        </section>

        <section class="summary-mini-card app-card exposure-result-section">
          <div class="summary-section-title-row app-card-head">
            <div class="summary-section-title-wrap app-card-title-wrap">
              <span class="summary-section-title app-card-title">키워드별 결과</span>
              <span class="summary-section-subtitle app-card-subtitle">키워드별 현재 순위와 노출 포스팅을 확인합니다.</span>
            </div>
          </div>
          <div class="summary-divider"></div>
          <div class="summary-section-body app-card-body">
            <div class="exposure-table-head">
              <span></span><span>키워드</span><span>현재 순위</span><span>이전 순위</span><span>변동</span><span>노출 포스팅</span><span>결과</span><span>발행일</span>
            </div>
            ${keywords.length ? tableRowsHtml : `<div class="empty-state" style="padding:24px 0;font-size:12px;">등록된 진단 키워드가 없습니다. 위에서 메인/보조 키워드를 추가해 주세요.</div>`}
          </div>
        </section>
      </div>`;
  }

  return `
    <div class="summary-mini-card app-card">
      <div class="summary-section-title-row app-card-head">
        <div class="summary-section-title-wrap app-card-title-wrap">
          <span class="summary-section-title app-card-title">노출 현황 진단</span>
          <span class="summary-section-subtitle app-card-subtitle">설정한 키워드의 노출 상태를 한눈에 확인합니다.</span>
        </div>
        <div class="exposure-check-time">체크 시각: ${checkedAt ? formatTime(checkedAt) : "-"}</div>
      </div>
      <div class="summary-divider"></div>
      <div class="summary-section-body app-card-body">
        <div class="rank-dash-tiles">${statCardsHtml}</div>
        ${pageBarHtml}
        <div class="summary-divider" style="margin:18px 0;"></div>
        <div class="summary-top3-row-wrap summary-mover-grid">${moverCardsHtml}</div>
        ${dropRowHtml ? `<div class="summary-divider" style="margin:18px 0;"></div>${dropRowHtml}` : ""}
      </div>
    </div>`;
}

function bestKeywordForPost(blogId, logNo) {
  const rows = activePostKeywordsForPost(blogId, logNo);
  let best = null;
  rows.forEach(kw => {
    const [latest, previous] = latestPair(blogId, logNo, kw.keyword, "naver_blog_screen");
    if (latest?.found && latest.rank != null && (!best || latest.rank < best.rank)) {
      best = { keyword: kw.keyword, rank: latest.rank, latest, previous };
    }
  });
  return best;
}

function activePostKeywordsForPost(blogId, logNo) {
  return state.postKeywords.filter(kw => kw.active !== false && kw.blog_id === blogId && kw.log_no === logNo);
}

function latestAnalysisDateForPost(blogId, logNo) {
  const latest = state.history
    .filter(row => row.blog_id === blogId && row.log_no === logNo && row.provider === "naver_blog_screen")
    .sort((a, b) => String(b.collected_at).localeCompare(String(a.collected_at)))[0];
  return latest?.collected_at || null;
}

// 우리가 정하는 자체 최적화 점수 — 노출 비율(최대 70점) + 순위 보너스(1위에 가까울수록 최대 30점).
// 제목 검색 자가진단에서 누락으로 뜬 포스팅은 0점 고정, 등록된 키워드가 없으면 채점하지 않는다(null).
function postContentCheckFor(blogId, logNo) {
  return state.postContentChecks.find(row => row.blog_id === blogId && row.log_no === logNo) || null;
}

// 랭킹추적의 productThumbHtml()과 같은 역할 — 포스팅을 상품처럼 취급해서 어디서든 이 함수로 통일한다.
// large=true면 랭킹추적 "추적 상품" 카드와 같은 56px(.lg) — 최근 게시글 진단 카드 전용.
function postThumbHtml(post, large = false) {
  const url = postContentCheckFor(post.blog_id, post.log_no)?.thumbnail_url;
  const sizeClass = large ? " lg" : "";
  if (!url) return `<span class="post-thumb empty${sizeClass}" aria-label="썸네일 없음"></span>`;
  return `<a class="post-thumb-link${sizeClass}" href="${esc(post.post_url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" aria-label="포스팅 보기"><img class="post-thumb${sizeClass}" src="${esc(url)}" loading="lazy" alt="" referrerpolicy="no-referrer"></a>`;
}

function postAiCheckFor(blogId, logNo) {
  return state.postAiChecks.find(row => row.blog_id === blogId && row.log_no === logNo) || null;
}

/* 종합분석평가 점수 — "AI 답변엔진이 이 글을 인용할 가능성" 체크리스트를 100점 만점 감점제로 채점한다.
   누락 여부(제목 검색 자가진단)는 관리 열의 아이콘/카드 외곽선으로 이미 따로 표시되므로 점수와는
   분리한다 — 여기서 0점으로 덮어쓰지 않고 콘텐츠 자체의 완성도를 그대로 보여준다.
   기준(큼=-3/보통=-2/미미함=-1)은 실제 포스팅 두 건으로 검산해서 정했다 — 항목을 여러 개
   놓쳐도(예: 표/목록/동영상/질문형 제목 전부 없음) 70점대 초반이 아니라 80점대 중반이 나오도록,
   이전보다 절반 수준으로 낮췄다. 본문 분석을 아직 안 돌렸으면 채점하지 않는다(null).
   종합평가 진단(collectPostAiCheck)은 비용이 드는 수동 버튼이라, 아직 안 돌렸으면 그 6개 항목은
   그냥 건너뛰고(감점 없음) 자동 12개만으로 채점한다. */
function postAiCitationScore(blogId, logNo) {
  const content = postContentCheckFor(blogId, logNo);
  if (!content) return null;

  const post = state.posts.find(p => p.blog_id === blogId && p.log_no === logNo);
  const title = post?.title || "";
  const BIG = 3, MID = 2, SMALL = 1;
  let deduction = 0;

  // 본문/구조
  if ((content.char_count || 0) < 1500 || (content.char_count || 0) > 2000) deduction += SMALL;
  if (!content.has_list) deduction += BIG;
  if (!content.has_table) deduction += BIG;

  // 제목
  if (title.length > 25) deduction += MID;
  if (!/\d/.test(title)) deduction += MID;
  if (!/[?？]/.test(title)) deduction += MID;
  if ((title.match(/[｜·]/g) || []).length >= 2) deduction += MID; // 키워드 나열형 제목(-)
  if (title.includes("%")) deduction += MID; // 단정 수치형 제목(-)

  // 미디어/부가
  if ((content.image_count || 0) < 7) deduction += MID;
  if (!(content.video_count > 0)) deduction += SMALL;
  if (!(content.quote_count > 0)) deduction += SMALL;
  if (content.external_link_count > 0) deduction += BIG; // 네이버 외 외부링크(-)

  // 키워드 선정 — 이 포스팅에 검색량이 확인된 대표 키워드가 있는가
  const hasVolumeKeyword = state.postKeywords.some(kw => kw.blog_id === blogId && kw.log_no === logNo && (kw.search_volume || 0) > 0);
  if (!hasVolumeKeyword) deduction += SMALL;

  // 종합평가 진단(수동)을 아직 안 돌렸으면 여기서부터는 건너뛴다 — 감점 없음
  const aiCheck = postAiCheckFor(blogId, logNo);
  if (aiCheck) {
    if (aiCheck.conclusion_first === false) deduction += MID;
    if (aiCheck.structured_flow === false) deduction += BIG;
    if (aiCheck.niche_topic === false) deduction += MID;
    if (aiCheck.ai_generated === true) deduction += BIG;
    if (aiCheck.excessive_promo === true) deduction += MID;
    if (aiCheck.channel_consistent === false) deduction += MID;
  }

  return Math.max(0, Math.min(100, Math.round(100 - deduction)));
}

// 랭킹추적의 expandedTrackedItems/toggleTrackedItem과 같은 패턴 — 모달 대신 행을 펼쳐서 상세를 보여준다.
const expandedRecentPosts = new Set();

function togglePostCard(blogId, logNo) {
  const key = `${blogId}::${logNo}`;
  if (expandedRecentPosts.has(key)) expandedRecentPosts.delete(key);
  else expandedRecentPosts.add(key);
  renderRows();
  renderDiagnosis();
}

function setPostRankProvider(blogId, logNo, mode) {
  const key = `${blogId}::${logNo}`;
  postRankProviderByKey.set(key, mode === "api" ? "api" : "screen");
  renderRows();
  renderDiagnosis();
}

// 판다랭크류 진단 카드(카테고리 태그 + 실측값 문장 + 다음 행동 조언) 스타일을 참고해서,
// postAiCitationScore가 어떤 근거로 그 점수가 나왔는지 항목별로 그대로 보여준다.
// 채점 조건은 postAiCitationScore와 1:1로 맞춰야 한다 — 하나를 고치면 반드시 같이 고칠 것.
// status 3단계는 원래 체크리스트의 +/- 방향을 그대로 따른다 — "+요인"은 충족하면 good, 못 하면
// (해로운 건 아니라서) neutral. "-요인"(외부링크/나열형·수치형 제목/AI생성/홍보과다)은 있으면 bad,
// 없으면(정상 상태라서) good — 즉 bad는 오직 "-요인이 실제로 존재할 때"만 뜬다.
function buildScoreChecklist(blogId, logNo) {
  const content = postContentCheckFor(blogId, logNo);
  if (!content) return [];
  const post = state.posts.find(p => p.blog_id === blogId && p.log_no === logNo);
  const title = post?.title || "";
  const aiCheck = postAiCheckFor(blogId, logNo);
  const items = [];
  const push = (category, status, headline, advice) => items.push({ category, status, headline, advice });
  // +요인: 충족하면 good, 못 하면 neutral(해롭진 않음, 그냥 기회)
  const pushPlus = (category, satisfied, goodHeadline, goodAdvice, missHeadline, missAdvice) =>
    push(category, satisfied ? "good" : "neutral", satisfied ? goodHeadline : missHeadline, satisfied ? goodAdvice : missAdvice);
  // -요인: 있으면 bad, 없으면(정상) good
  const pushMinus = (category, present, badHeadline, badAdvice, safeHeadline, safeAdvice) =>
    push(category, present ? "bad" : "good", present ? badHeadline : safeHeadline, present ? badAdvice : safeAdvice);

  // 콘텐츠 (본문구조 + 미디어)
  const cc = content.char_count || 0;
  const ccOk = cc >= 1500 && cc <= 2000;
  pushPlus("콘텐츠", ccOk,
    `본문 글자수가 ${cc.toLocaleString()}자로 적정 범위예요.`, "이 정도 밀도를 유지하면서 계속 써보세요.",
    `본문 글자수가 ${cc.toLocaleString()}자로 ${cc < 1500 ? "다소 적어요" : "다소 많아요"}.`,
    cc < 1500 ? "1,500~2,000자 정도로 조금 더 풀어써보세요." : "핵심만 남기고 불필요한 설명은 줄여보세요.");

  pushPlus("콘텐츠", content.has_list,
    "핵심 내용을 목록(리스트)으로 정리했어요.", "AI가 요약·인용하기 좋은 형태예요.",
    "목록(불릿·번호) 정리가 없어요.", "핵심 정보를 3~5개 항목으로 요약해 리스트로 넣어보세요.");

  pushPlus("콘텐츠", content.has_table,
    "비교표를 사용했어요.", "AI가 표 데이터를 그대로 인용하기 좋아요.",
    "비교표가 없어요.", "여러 옵션·수치를 비교할 땐 표로 정리하면 인용 확률이 올라가요.");

  const ic = content.image_count || 0;
  pushPlus("콘텐츠", ic >= 7, `사진이 ${ic}장으로 충분해요.`, "이 정도면 체류시간·신뢰도에 좋아요.",
    `사진이 ${ic}장으로 부족해요.`, "7장 이상 넣으면 체류시간·신뢰도에 도움돼요.");

  pushPlus("콘텐츠", content.video_count > 0, "동영상을 포함했어요.", "체류시간 확보에 도움돼요.",
    "동영상이 없어요.", "짧은 영상 하나만 추가해도 체류시간이 늘어나요.");

  pushPlus("콘텐츠", content.quote_count > 0, "인용구를 사용했어요.", "신뢰도를 높이는 요소예요.",
    "인용구가 없어요.", "출처가 있는 인용문을 하나 넣으면 신뢰도가 올라가요.");

  pushMinus("콘텐츠", (content.external_link_count || 0) > 0,
    "네이버 밖 외부링크가 있어요.", "가능하면 외부링크는 빼거나 최소화하세요.",
    "네이버 외부로 나가는 링크가 없어요.", "AI가 이탈 없이 이 글 안에서 답을 찾을 수 있어요.");

  // 주제 (제목 + 키워드 신뢰성)
  pushPlus("주제", title.length <= 25, `제목이 ${title.length}자로 간결해요.`, "이 정도 길이가 딱 좋아요.",
    `제목이 ${title.length}자로 다소 길어요.`, "25자 이내로 핵심만 남겨보세요.");

  pushPlus("주제", /\d/.test(title), "제목에 숫자·연도가 들어 있어요.", "구체성이 느껴져 클릭·인용률에 도움돼요.",
    "제목에 숫자나 연도가 없어요.", "'3가지', '2026년'처럼 구체적인 숫자를 넣어보세요.");

  pushPlus("주제", /[?？]/.test(title), "질문형 제목이에요.", "궁금증을 유발해 흥미를 끌어요.",
    "질문형 제목이 아니에요.", "'~왜 그럴까요?'처럼 질문형으로 바꿔보는 것도 방법이에요.");

  pushMinus("주제", (title.match(/[｜·]/g) || []).length >= 2,
    "'｜'나 '·'로 키워드를 나열한 제목이에요.", "AI는 나열형보다 자연스러운 문장을 더 신뢰해요. 문장으로 풀어써보세요.",
    "키워드 나열형 제목이 아니에요.", "자연스러운 문장형이라 좋아요.");

  pushMinus("주제", title.includes("%"),
    "'OO% 줄이는' 식의 단정적 수치 표현이 있어요.", "과장된 인상을 줄 수 있어요. 표현을 완화해보세요.",
    "단정적인 수치 주장이 없어요.", "무난한 표현이에요.");

  const hasVolumeKeyword = state.postKeywords.some(kw => kw.blog_id === blogId && kw.log_no === logNo && (kw.search_volume || 0) > 0);
  pushPlus("주제", hasVolumeKeyword, "검색량이 확인된 키워드로 추적 중이에요.", "타겟이 명확해요.",
    "검색량이 확인된 대표 키워드가 없어요.", "포스팅에 키워드를 등록해 검색량을 확인해보세요.");

  // AI 판정 — 아직 수동으로 안 돌렸으면 항목 자체가 안 뜬다(감점 없는 것과 동일한 이유)
  if (aiCheck) {
    if (aiCheck.conclusion_first != null) pushPlus("AI판정", aiCheck.conclusion_first,
      "글 초반에 결론부터 제시했어요.", "이대로 유지하세요.", "서론이 길어요.", "핵심 답을 문단 맨 앞으로 옮겨보세요.");
    if (aiCheck.structured_flow != null) pushPlus("AI판정", aiCheck.structured_flow,
      "결론→근거→목록→가이드 순으로 잘 짜여 있어요.", "이대로 유지하세요.", "구조가 다소 산만해요.", "결론을 먼저 두고 근거·목록·가이드 순으로 재배치해보세요.");
    if (aiCheck.niche_topic != null) pushPlus("AI판정", aiCheck.niche_topic,
      "경쟁이 적은 실무형 소재예요.", "이대로 유지하세요.", "흔한 일반론에 가까워요.", "더 구체적인 상황·질문으로 소재를 좁혀보세요.");
    if (aiCheck.ai_generated != null) pushMinus("AI판정", aiCheck.ai_generated,
      "AI 초안 느낌이 강해요.", "경험담이나 구체적인 수치를 더해 사람 손길을 더해보세요.", "직접 편집한 글처럼 보여요.", "이대로 유지하세요.");
    if (aiCheck.excessive_promo != null) pushMinus("AI판정", aiCheck.excessive_promo,
      "홍보 문구가 과해요.", "홍보 문구는 1줄을 넘지 않게 줄여보세요.", "홍보 문구가 과하지 않아요.", "이대로 유지하세요.");
    if (aiCheck.channel_consistent != null) pushPlus("AI판정", aiCheck.channel_consistent,
      "다른 글들과 주제가 일관돼요.", "이대로 유지하세요.", "채널 주제와 다소 동떨어져요.", "이 블로그의 주력 주제와 다르면 카테고리 정리를 고려해보세요.");
  }

  return items;
}

function renderScoreChecklist(items) {
  if (!items.length) return `<div class="empty-state" style="padding:12px 4px;font-size:12px;">본문 분석을 먼저 돌리면 개선 항목을 볼 수 있습니다.</div>`;
  let prevCategory = null;
  const cardsHtml = items.map(it => {
    const divider = prevCategory !== null && prevCategory !== it.category ? `<div class="score-group-divider"></div>` : "";
    prevCategory = it.category;
    return `${divider}
    <div class="score-card">
      <span class="score-tag ${esc(it.status)}">${esc(it.category)}</span>
      <div class="score-card-body">
        <div class="score-headline">${esc(it.headline)}</div>
        <div class="score-advice">${esc(it.advice)}</div>
      </div>
    </div>`;
  }).join("");
  return `<div class="score-checklist">${cardsHtml}</div>`;
}

function scoreGradeInfo(score) {
  if (score == null) return { label: "미평가", cls: "", value: 0 };
  if (score >= 90) return { label: "최상", cls: "best", value: score };
  if (score >= 80) return { label: "우수", cls: "good", value: score };
  return { label: "보통", cls: "", value: score };
}

function renderScoreDashExtra(score) {
  const grade = scoreGradeInfo(score);
  const value = Math.max(0, Math.min(100, Number(grade.value) || 0));
  return `<div class="score-dash-extra">
    <span class="score-dash-meta">
      <span class="score-dash-grade ${grade.cls}">${esc(grade.label)}</span>
      <span class="score-dash-total">${score != null ? `${value}/100` : "-/100"}</span>
    </span>
    <span class="score-dash-track"><span class="score-dash-fill ${grade.cls}" style="--score-width:${value}%"></span></span>
  </div>`;
}

function checklistGroupScore(items, category) {
  const group = items.filter(item => item.category === category);
  if (!group.length) return null;
  const total = group.reduce((sum, item) => {
    if (item.status === "bad") return sum + 45;
    if (item.status === "neutral") return sum + 75;
    return sum + 100;
  }, 0);
  return Math.round(total / group.length);
}

function normalizedReportScores(items, overallScore) {
  const categories = ["콘텐츠", "주제", "AI판정"];
  const rawScores = categories.map(category => checklistGroupScore(items, category));
  const validScores = rawScores.filter(score => score != null);
  if (!validScores.length) return { 콘텐츠: null, 주제: null, AI판정: null };
  if (overallScore == null) {
    return categories.reduce((acc, category, index) => {
      acc[category] = rawScores[index];
      return acc;
    }, {});
  }

  const rawAverage = validScores.reduce((sum, score) => sum + score, 0) / validScores.length;
  const adjustment = rawAverage - overallScore;
  return categories.reduce((acc, category, index) => {
    const raw = rawScores[index];
    acc[category] = raw == null ? null : Math.max(0, Math.min(100, Math.round(raw - adjustment)));
    return acc;
  }, {});
}

function scoreReportMetricHtml(label, score) {
  const value = score == null ? 0 : Math.max(0, Math.min(100, Number(score) || 0));
  const text = score == null ? "대기" : `${value}점`;
  return `<div class="score-report-metric">
    <div class="score-report-label">
      <span>${esc(label)} ${esc(text)}</span>
    </div>
    <span class="score-report-track"><span class="score-report-fill" style="--score-width:${value}%"></span></span>
    <span class="score-report-axis"><span>0점</span><span>100점</span></span>
  </div>`;
}

function renderScoreReport(checklist, aiCheck, blogId, logNo, overallScore) {
  const reportScores = normalizedReportScores(checklist, overallScore);
  return `<div class="score-report">
    <div class="score-report-head">
      <span>
        <span class="score-report-title">블로그 분석 리포트</span>
        <span class="score-report-sub">포스팅 구조와 상위 노출 개선 포인트를 정리했어요.</span>
      </span>
      <button class="text-btn primary" type="button" onclick="event.stopPropagation(); refreshPostAiCheck('${esc(blogId)}', '${esc(logNo)}')">${aiCheck ? "종합평가 다시" : "종합평가 진단"}</button>
    </div>
    <div class="score-report-grid">
      ${scoreReportMetricHtml("콘텐츠", reportScores["콘텐츠"])}
      ${scoreReportMetricHtml("주제", reportScores["주제"])}
      ${scoreReportMetricHtml("AI판정", reportScores["AI판정"])}
    </div>
  </div>`;
}

function renderPostDetail(blog, post) {

  const score = postAiCitationScore(blog.blog_id, post.log_no);
  const aiCheck = postAiCheckFor(blog.blog_id, post.log_no);
  const checklist = buildScoreChecklist(blog.blog_id, post.log_no);
  const detailKey = `${blog.blog_id}::${post.log_no}`;
  const rankProvider = postRankProviderByKey.get(detailKey) === "api" ? "naver_blog_api" : "naver_blog_screen";
  const rankProviderMode = rankProvider === "naver_blog_api" ? "api" : "screen";
  // 랭킹추적 상품카드(keyword-rank-item — 순위 배지·변동·검색량 + 순위 그래프)와 완전히 같은
  // 형태로 재사용한다 — 등록된 추적 키워드는 노출 여부와 상관없이 모두 보여준다.
  const rankedKeywords = state.postKeywords
    .filter(kw => kw.active !== false && kw.blog_id === blog.blog_id && kw.log_no === post.log_no)

    .sort((a, b) => {
      const ar = a.latest?.found && a.latest.rank != null ? a.latest.rank : Number.POSITIVE_INFINITY;
      const br = b.latest?.found && b.latest.rank != null ? b.latest.rank : Number.POSITIVE_INFINITY;
      if (ar !== br) return ar - br;
      return String(a.kw.keyword).localeCompare(String(b.kw.keyword), "ko");

    .map(r => r.kw);

  return `

      <div class="dash-tile"><div class="dash-label">종합분석평가</div><div class="dash-value">${score != null ? `${score}점` : "-"}</div>${renderScoreDashExtra(score)}</div>
    </div>
    <div class="summary-divider" style="margin:14px 0 6px;"></div>
    <div class="post-rank-provider-row">
      <span class="post-rank-provider-title">추적 키워드 순위</span>
      <span class="post-rank-provider-toggle">
        <button type="button" class="${rankProviderMode === "screen" ? "active" : ""}" onclick="event.stopPropagation(); setPostRankProvider('${esc(blog.blog_id)}', '${esc(post.log_no)}', 'screen')">실제 순위</button>
        <button type="button" class="${rankProviderMode === "api" ? "active" : ""}" onclick="event.stopPropagation(); setPostRankProvider('${esc(blog.blog_id)}', '${esc(post.log_no)}', 'api')">네이버 제공</button>
      </span>
    </div>
    ${rankedKeywords.length
      ? rankedKeywords.map(kw => renderPostKeywordRankItem(blog.blog_id, post.log_no, kw, rankProvider)).join("")
      : `<div class="empty-state" style="padding:12px 4px;font-size:12px;">등록된 추적 키워드가 없습니다.</div>`}
    <div class="summary-divider" style="margin:14px 0;"></div>
    ${renderScoreReport(checklist, aiCheck, blog.blog_id, post.log_no, score)}
    ${renderScoreChecklist(checklist)}
    ${!aiCheck ? `<div class="empty-state" style="padding:12px 4px;font-size:12px;">위 버튼으로 종합평가 진단을 돌리면 결론배치/구조화/니치소재/AI생성여부/홍보문구/채널일관성 6개 항목이 추가로 채점됩니다.</div>` : ""}
    ${aiCheck?.reasoning ? `<div class="ai-reasoning">AI 판정 근거: ${esc(aiCheck.reasoning)}</div>` : ""}`;
}

function renderCompetitorDashboard(selectedBlog, selectedPosts, competitors) {
  const allCompetitorPosts = state.posts.filter(post => competitors.some(blog => blog.blog_id === post.blog_id));
  const allKeywordRows = competitorKeywordRows(allCompetitorPosts);
  const recentLimit = Date.now() - 30 * 86400000;
  const weekLimit = Date.now() - 7 * 86400000;
  const allRecentPosts = allCompetitorPosts.filter(post => postTime(post) >= recentLimit);
  const weekPosts = allCompetitorPosts.filter(post => postTime(post) >= weekLimit);
  const allStats = keywordStats(allKeywordRows);
  const recentStats = keywordStats(competitorKeywordRows(allRecentPosts));
  const latestPost = [...allCompetitorPosts].sort((a, b) => postTime(b) - postTime(a))[0] || null;
  const latestDays = daysSincePost(latestPost);
  const weeklyAvg = allRecentPosts.length ? (allRecentPosts.length / 4.3).toFixed(1) : "0";
  const activeBlogCount = new Set(allCompetitorPosts.map(post => post.blog_id)).size;
  const blogActivity = competitors.map(blog => {
    const posts = allCompetitorPosts.filter(post => post.blog_id === blog.blog_id);
    const recentPosts = posts.filter(post => postTime(post) >= recentLimit);
    return {
      name: blog.blog_name || blog.blog_id,
      totalCount: posts.length,
      recentCount: recentPosts.length,
    };
  }).sort((a, b) => b.recentCount - a.recentCount || b.totalCount - a.totalCount || a.name.localeCompare(b.name, "ko"));
  const uploadShareHtml = competitorUploadShareHtml(blogActivity);

  return `
    <div class="competitor-dashboard" aria-label="경쟁업체 블로그 요약">
      <div class="competitor-dash-tiles">
        <div class="competitor-dash-tile">
          <div class="competitor-dash-label">등록 업체</div>
          <div class="competitor-dash-value">${competitors.length}<small>곳</small></div>
          <div class="competitor-dash-sub">최근 글 확인 ${activeBlogCount}곳</div>
        </div>
        <div class="competitor-dash-tile">
          <div class="competitor-dash-label">저장된 글</div>
          <div class="competitor-dash-value">${allCompetitorPosts.length}<small>개</small></div>
          <div class="competitor-dash-sub">업체 블로그에서 가져온 글</div>
        </div>
        <div class="competitor-dash-tile">
          <div class="competitor-dash-label">최근 한달 새 글</div>
          <div class="competitor-dash-value">${allRecentPosts.length}<small>개</small></div>
          <div class="competitor-dash-sub">업체 전체 · 주 평균 ${weeklyAvg}개</div>
        </div>
        <div class="competitor-dash-tile">
          <div class="competitor-dash-label">최근 일주일 새 글</div>
          <div class="competitor-dash-value">${weekPosts.length}<small>개</small></div>
          <div class="competitor-dash-sub">${latestDays == null ? "최근 글 없음" : latestDays === 0 ? "오늘 새 글 있음" : `최근 ${latestDays}일 전 등록`}</div>
        </div>
      </div>
      ${uploadShareHtml}
      <div class="summary-divider" style="margin:18px 0;"></div>
      <div class="competitor-insight-grid" aria-label="경쟁 키워드 인사이트">
        <div class="competitor-insight-card">
          <div class="competitor-insight-title">많이 사용되는 키워드</div>
          ${competitorKeywordRankHtml(allStats, "저장된 주요 키워드가 아직 없습니다.")}
        </div>
        <div class="competitor-insight-card">
          <div class="competitor-insight-title">최근 뜨는 키워드</div>
          ${competitorKeywordRankHtml(recentStats, "최근 한달 주요 키워드가 없습니다.")}
        </div>
        <div class="competitor-insight-card">
          <div class="competitor-insight-title">업체별 업로드 빈도</div>
          ${competitorBlogActivityHtml(blogActivity, "수집된 업체 글이 없습니다.")}
        </div>
      </div>
    </div>
  `;
}

async function refreshCompetitorPosts(blogId = "") {
  const targets = blogId ? [blogId] : sortCompetitorBlogs(state.blogs.filter(blog => !blog.is_mine && blog.active !== false)).map(blog => blog.blog_id);
  if (!targets.length) {
    showToast("새로고침할 경쟁업체 블로그가 없습니다.");
    return;
  }
  showLoading("경쟁업체 블로그의 신규 포스팅을 확인하는 중입니다.");
  try {
    const data = await callApi("refreshRecent", blogId ? { blogId } : { scope: "competitor" });
    state = data;
    if (!selectedCompetitorBlogId || !targets.includes(selectedCompetitorBlogId)) {
      selectedCompetitorBlogId = targets[0];
    }
    renderAll();
    const errors = data.errors || [];
    if (errors.length) {
      showToast(`신규 포스팅 확인 완료 · ${errors.length}건은 확인 필요`);
      console.warn("경쟁업체 신규 포스팅 확인 필요", errors);
    } else {
      showToast(`경쟁업체 블로그 ${targets.length}곳의 신규 포스팅을 확인했습니다.`);
    }
  } catch (error) {
    showToast(error.message);
  } finally {
    hideLoading();
  }
}

async function loadData() {
  showLoading("블로그 데이터를 불러오는 중입니다...");
  try {
    const data = await callApi("list");
    state = data;
    renderAll();
  } catch (error) {
    const errorCardHtml = `
      <div class="rank-card app-card">
        <div class="empty-state"><strong>블로그 데이터를 불러오지 못했습니다.</strong>${esc(error.message)}</div>
      </div>`;
    document.getElementById("rankList").innerHTML = errorCardHtml;
    // 기본 활성 탭(블로그 진단)의 #diagnosisList는 renderAll()이 실행돼야만 채워지므로,
    // 조회 실패 시 여기도 채워주지 않으면 로딩 오버레이가 사라진 뒤 빈 화면만 남는다.
    document.getElementById("diagnosisList").innerHTML = errorCardHtml;
    showToast(error.message);
  } finally {
    hideLoading();
  }
  autoRefreshDiagnosis();
}

// 블로그차트/웨어이즈포스트(진단)는 네이버가 아니라 제3자 사이트 조회라 페이지 진입마다 자동
// 새로고침해도 무방하지만, RSS/모바일 글 페이지(m.blog.naver.com) 조회는 결국 네이버 쪽으로
// 나가는 트래픽이라 — 사용자 판단으로 여기서는 자동 호출을 뺐다. 이제 포스팅 목록·본문 재분석은
// "포스팅 새로고침"/"전체 순위 재분석"/카드별 "분석 새로고침" 같은 수동 버튼으로만 돈다
// (매일 밤 23:00 크론에도 안 얹혀 있음 — cron_blog_post_rank_collect 참고).
async function autoRefreshDiagnosis() {
  const mine = state.blogs.filter(blog => blog.is_mine && blog.active);
  if (!mine.length) return;
  try {
    // collectDiagnosis는 blog_rank_diagnosis 테이블만 갱신하지만 응답엔 listData() 전체가 딸려온다.
    // 여기서 state 전체를 통째로 덮어쓰면, 이 스크래핑(몇 초 소요)이 진행되는 동안 사용자가
    // 다른 화면에서 키워드/메모 등을 추가한 최신 상태가 응답 도착 시점에 되돌아가 버린다.
    // diagnosis만 반영해서 이 레이스 컨디션을 피한다.
    const data = await callApi("collectDiagnosis", {});
    state.diagnosis = data.diagnosis;
    renderAll();
  } catch {
    // 진입 시 자동 새로고침 실패는 조용히 무시 — 화면엔 이미 캐시된 값이 떠 있고, 수동 버튼으로 재시도 가능
  }
}

// "전체 순위 재분석" — 카드 안 "순위 수집" 버튼(collectPostRank)과 하는 일은 완전히 같고,
// 최근 발행 10개 포스팅에 대해 그걸 한 번에 돌리는 것뿐이다. 본문 진단·AI 분석은 안 건드린다.
async function refreshAllPostRankHandler(blogId) {
  const posts = state.posts
    .filter(p => p.blog_id === blogId)
    .sort((a, b) => String(b.published_at || "").localeCompare(String(a.published_at || "")))
    .slice(0, 10);
  if (!posts.length) return showToast("재분석할 포스팅이 없습니다.");

  const errors = [];
  showLoading(`0/${posts.length} 포스팅 순위 재분석 중...`);
  for (let i = 0; i < posts.length; i++) {
    const post = posts[i];
    setLoadingMessage(`${i + 1}/${posts.length} 포스팅 순위 재분석 중...`);
    if (activePostKeywordsForPost(blogId, post.log_no).length) {
      try {
        state = await callApi("collectPostRank", { blogId, logNo: post.log_no });
        renderAll();
      } catch (error) {
        errors.push({ logNo: post.log_no, step: "순위", message: error.message });
      }
    }
  }
  hideLoading();
  if (errors.length) {
    showToast(`재분석 완료 · ${errors.length}건은 확인이 필요합니다.`);
    console.warn("전체 순위 재분석 오류", errors);
  } else {
    showToast(`포스팅 ${posts.length}개의 순위 재분석을 완료했습니다.`);
  }
}

function exposureSelectionKey(blogId, keyword) {
  return `${blogId}::${String(keyword || "").trim()}`;
}

function activeExposureKeywords(blogId) {
  return state.targetKeywords.filter(k => k.blog_id === blogId && k.active);
}

function toggleExposureKeyword(button) {
  const blogId = button.dataset.exposureBlog;
  const keyword = button.dataset.exposureKeyword;
  const key = exposureSelectionKey(blogId, keyword);
  if (exposureSelectedKeywords.has(key)) exposureSelectedKeywords.delete(key);
  else exposureSelectedKeywords.add(key);
  renderAll();
}

function toggleExposureResultRow(button) {
  const blogId = button.dataset.exposureBlog;
  const keyword = button.dataset.exposureKeyword;
  const key = exposureSelectionKey(blogId, keyword);
  if (exposureExpandedRows.has(key)) exposureExpandedRows.delete(key);
  else exposureExpandedRows.add(key);
  renderAll();
}

function toggleAllExposureKeywords(blogId, category) {
  const group = activeExposureKeywords(blogId).filter(k => k.category === category);
  if (!group.length) return showToast(`등록된 ${category === "서브" ? "보조" : category} 키워드가 없습니다.`);
  const allSelected = group.every(k => exposureSelectedKeywords.has(exposureSelectionKey(blogId, k.keyword)));
  group.forEach(k => {
    const key = exposureSelectionKey(blogId, k.keyword);
    if (allSelected) exposureSelectedKeywords.delete(key);
    else exposureSelectedKeywords.add(key);
  });
  renderAll();
}

async function addExposureKeywordPrompt(blogId, category) {
  const label = category === "서브" ? "보조" : "메인";
  const raw = (prompt(`추가할 ${label} 키워드를 입력하세요. 여러 개는 쉼표로 구분할 수 있습니다.`) || "").trim();
  if (!raw) return;
  const keywords = [...new Set(raw.split(",").map(v => v.trim()).filter(Boolean))];
  if (!keywords.length) return;
  const existing = new Set(activeExposureKeywords(blogId).map(k => k.keyword));
  const nextKeywords = keywords.filter(keyword => !existing.has(keyword));
  if (!nextKeywords.length) return showToast("이미 등록된 키워드입니다.");
  showLoading("진단 키워드를 추가하는 중입니다.");
  try {
    state = await callApi("addTargetKeywords", { blogId, keywords: nextKeywords.map(keyword => ({ keyword, category })) });
    nextKeywords.forEach(keyword => exposureSelectedKeywords.add(exposureSelectionKey(blogId, keyword)));
    renderAll();
    showToast(`${label} 키워드 ${nextKeywords.length}개를 추가했습니다.`);
  } catch (error) {
    showToast(error.message);
  } finally {
    hideLoading();
  }
}

async function removeTargetKeywordHandler(id, keyword) {

  const target = state.targetKeywords.find(k => k.id === id);

}

async function collectExposureHandler(blogId) {
  const activeKeywords = activeExposureKeywords(blogId);
  if (!activeKeywords.length) return showToast("등록된 진단 키워드가 없습니다.");
  const selected = activeKeywords.filter(k => exposureSelectedKeywords.has(exposureSelectionKey(blogId, k.keyword)));
  if (!selected.length) return showToast("수집할 키워드를 선택해 주세요.");
  const keywords = selected;
  const errors = [];
  showLoading(`0/${keywords.length} 키워드 진단 중...`);
  for (let i = 0; i < keywords.length; i++) {
    const kw = keywords[i];
    setLoadingMessage(`${i + 1}/${keywords.length} "${kw.keyword}" 확인 중...`);
    try {
      state = await callApi("collectExposure", { blogId, keyword: kw.keyword });
      renderAll();
    } catch (error) {
      errors.push({ keyword: kw.keyword, message: error.message });
    }
  }
  setLoadingMessage("포스팅 목록을 새로고침하는 중...");
  try {
    state = await callApi("refreshRecent", { blogId });
    renderAll();
  } catch (error) {
    console.warn("포스팅 새로고침 실패", error);
  }
  hideLoading();
  if (errors.length) {
    showToast(`진단 완료 · ${errors.length}건은 확인이 필요합니다.`);
    console.warn("노출 현황 진단 오류", errors);
  } else {
    showToast(`키워드 ${keywords.length}개 진단을 완료했습니다.`);
  }
}

function setRankSubView(view) {
  rankSubView = view === "exposure" ? "exposure" : "posts";
  const label = document.getElementById("rankSubLabel");
  if (label) label.textContent = rankSubView === "exposure" ? "노출 현황" : "전체 포스팅";
  document.querySelectorAll("[data-rank-sub-option]").forEach(option => {
    option.classList.toggle("active", option.dataset.rankSubOption === rankSubView);
  });
  const postsView = document.getElementById("rankPostsView");
  const exposureView = document.getElementById("rankExposureView");
  if (postsView) postsView.hidden = rankSubView !== "posts";
  if (exposureView) exposureView.hidden = rankSubView !== "exposure";
}

function setDiagnosisSubView(view) {
  diagnosisSubView = view === "competitor" ? "competitor" : "mine";
  const label = document.getElementById("diagnosisSubLabel");
  if (label) label.textContent = diagnosisSubView === "competitor" ? "경쟁사 블로그" : "에너가드컴퍼니";
  document.querySelectorAll("[data-diagnosis-sub-option]").forEach(option => {
    option.classList.toggle("active", option.dataset.diagnosisSubOption === diagnosisSubView);
  });
  const competitorActions = document.getElementById("competitorDiagnosisActions");
  if (competitorActions) competitorActions.hidden = diagnosisSubView !== "competitor";
  renderDiagnosis();
}

function setBlogView(view) {
  const nextView = view === "diagnosis" ? "diagnosis" : "rank";
  document.querySelectorAll("[data-blog-view]").forEach(tab => {
    tab.classList.toggle("active", tab.dataset.blogView === nextView);
  });
  document.getElementById("blogDiagnosisView").hidden = nextView !== "diagnosis";
  document.getElementById("blogRankView").hidden = nextView !== "rank";
  const competitorActions = document.getElementById("competitorDiagnosisActions");
  if (competitorActions) competitorActions.hidden = nextView !== "diagnosis" || diagnosisSubView !== "competitor";
}

function goToAllPosts() {
  setBlogView("rank");
  setRankSubView("posts");
  renderRows();
  document.getElementById("blogRankView")?.scrollIntoView({ behavior: "smooth", block: "start" });
}

document.querySelector(".app-title-tabs")?.addEventListener("click", event => {
  const tab = event.target.closest("[data-blog-view]");
  if (!tab) return;
  setBlogView(tab.dataset.blogView);
});

document.addEventListener("click", event => {
  const diagnosisToggle = event.target.closest('[data-action="toggle-diagnosis-sub-menu"]');
  const diagnosisOption = event.target.closest("[data-diagnosis-sub-option]");
  const diagnosisChips = document.getElementById("diagnosisSubChips");
  if (diagnosisToggle) {
    diagnosisChips?.classList.toggle("open");
    return;
  }
  if (diagnosisOption) {
    setDiagnosisSubView(diagnosisOption.dataset.diagnosisSubOption);
    diagnosisChips?.classList.remove("open");
    return;
  }
  if (diagnosisChips && !event.target.closest("#diagnosisSubChips")) {
    diagnosisChips.classList.remove("open");
  }

  const competitorToggle = event.target.closest('[data-action="toggle-competitor-menu"]');
  const competitorOption = event.target.closest("[data-competitor-blog]");
  const competitorChips = document.getElementById("competitorBlogChips");
  if (competitorToggle) {
    competitorChips?.classList.toggle("open");
    return;
  }
  if (competitorOption) {
    setCompetitorBlog(competitorOption.dataset.competitorBlog);
    competitorChips?.classList.remove("open");
    return;
  }
  if (competitorChips && !event.target.closest("#competitorBlogChips")) {
    competitorChips.classList.remove("open");
  }

  const subToggle = event.target.closest('[data-action="toggle-rank-sub-menu"]');
  const subOption = event.target.closest("[data-rank-sub-option]");
  const subChips = document.getElementById("rankSubChips");
  if (subToggle) {
    subChips?.classList.toggle("open");
    return;
  }
  if (subOption) {
    setRankSubView(subOption.dataset.rankSubOption);
    renderRows();
    subChips?.classList.remove("open");
    return;
  }
  if (subChips && !event.target.closest("#rankSubChips")) {
    subChips.classList.remove("open");
  }
});

setRankSubView("exposure");
setBlogView("diagnosis");
loadData();
</script>
</body>
</html>
