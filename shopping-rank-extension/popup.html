<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>쇼핑 순위 수집</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">ENERGUARD LAB</p>
        <h1>쇼핑 순위 수집</h1>
      </div>
      <span class="status-dot" id="statusDot" aria-hidden="true"></span>
    </header>

    <section class="quick-lookup smartstore-import">
      <div class="section-title">
        <strong>스마트스토어 검색 순위</strong>
        <span>관리자 화면 기준</span>
      </div>
      <small>검색 순위 진단 화면에 표시된 상품·키워드 순위를 오늘 이력으로 저장합니다.</small>
      <button type="button" class="primary quick-button" id="smartstoreImportButton">관리자 순위 가져오기</button>
    </section>

    <section class="quick-lookup">
      <div class="section-title">
        <strong>상품 URL 빠른 확인</strong>
        <span>1페이지만 조회</span>
      </div>
      <input id="singleProductUrl" type="url" value="https://smartstore.naver.com/main/products/206526749" placeholder="스마트스토어 상품 URL">
      <small>아이템 추적에 등록된 키워드를 자동으로 불러와 광고를 제외한 실제 순위를 확인합니다.</small>
      <button type="button" class="secondary quick-button" id="singleLookupButton">단건 순위 확인</button>
    </section>

    <label>
      <span>내 스토어</span>
      <select id="storeName">
        <option value="한국 단열">한국 단열</option>
        <option value="에너가드컴퍼니">에너가드컴퍼니</option>
      </select>
    </label>

    <label>
      <span>수집 키워드</span>
      <textarea id="keywords" rows="7" placeholder="아이소핑크&#10;아이소핑크 > XPS단열재"></textarea>
      <small>한 줄에 하나씩 입력합니다. 보조 키워드는 <b>메인 &gt; 보조</b> 형식으로 입력하세요.</small>
    </label>

    <div class="row">
      <label>
        <span>수집 범위</span>
        <select id="pageCount">
          <option value="5" selected>200위</option>
        </select>
      </label>
      <label>
        <span>페이지 대기</span>
        <select id="pageDelay">
          <option value="1800">1.8초</option>
          <option value="2500" selected>2.5초</option>
          <option value="4000">4초</option>
        </select>
      </label>
    </div>

    <section class="progress" id="progressBox" hidden>
      <div class="progress-head">
        <strong id="progressTitle">준비 중</strong>
        <span id="progressCount">0/0</span>
      </div>
      <div class="track"><i id="progressBar"></i></div>
      <p id="progressMessage">수집을 준비하고 있습니다.</p>
    </section>

    <p class="notice" id="notice">검색 결과에서 선택한 스토어의 모든 일반상품을 찾아 저장합니다.</p>

    <div class="actions">
      <button type="button" class="secondary" id="stopButton" hidden>중단</button>
      <button type="button" class="primary" id="startButton">수집 시작</button>
    </div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
