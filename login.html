<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 | ENERGUARD LAB</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --bg: #f5f7fa; --card: #fff; --ink: #07111f; --sub: #6b7487;
    --line: #dfe5ed; --dark: #05070b; --accent: #ef5a2a; --accent-dark: #d94d24;
    --accent-soft: #fff1ea;
    --font-main: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    color: var(--ink); font-family: var(--font-main);
    /* 은은한 방향성 그라디언트 + 상단 우측 브랜드 컬러 광원 — 배경을 밋밋한 단색에서
       살짝 입체감 있는 무드로(레이아웃 구조는 그대로 유지, 배경만 다듬음). */
    background:
      radial-gradient(720px 480px at 88% -8%, rgba(239, 90, 42, .07), transparent 60%),
      radial-gradient(600px 420px at 6% 108%, rgba(7, 17, 31, .05), transparent 55%),
      var(--bg);
  }
  .login-shell { width: min(100%, 400px); animation: shell-in .5s cubic-bezier(.16,1,.3,1) both; }
  @keyframes shell-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .login-brand { display: flex; align-items: center; gap: 10px; margin: 0 0 24px; }
  .login-mark {
    width: 34px; height: 34px; border-radius: 9px; flex-shrink: 0;
    background: linear-gradient(155deg, var(--accent), var(--accent-dark));
    display: grid; place-items: center; box-shadow: 0 6px 14px rgba(239, 90, 42, .3);
  }
  .login-mark svg { width: 18px; height: 18px; }
  .login-brand span {
    font-family: Consolas, "JetBrains Mono", monospace; font-size: 16.5px; font-weight: 700;
    letter-spacing: -.2px; color: var(--ink);
  }
  .login-brand span:last-child { color: var(--accent); }
  .login-card {
    width: 100%; margin: 0; padding: 36px 32px; background: var(--card);
    border: 1px solid var(--line); border-radius: 16px;
    /* 그림자를 이중으로 — 가까운 그림자로 카드 두께감, 넓은 그림자로 붕 뜬 느낌 */
    box-shadow: 0 1px 2px rgba(15, 23, 42, .04), 0 24px 48px -12px rgba(15, 23, 42, .14);
  }
  .login-title { margin: 0; font-size: 23px; font-weight: 800; line-height: 1.3; letter-spacing: -.3px; }
  .login-sub { margin: 9px 0 30px; color: var(--sub); font-size: 13px; line-height: 1.6; }
  .login-field { margin-bottom: 16px; }
  .login-field label { display: block; margin-bottom: 7px; font-size: 12.5px; font-weight: 700; color: #45506699; letter-spacing: .1px; }
  .field-wrap { position: relative; }
  .field-icon {
    position: absolute; top: 50%; left: 14px; transform: translateY(-50%);
    width: 17px; height: 17px; color: #a8b0c0; pointer-events: none; transition: color .15s;
  }
  .login-field input {
    width: 100%; height: 47px; padding: 0 14px 0 40px; border: 1.5px solid var(--line);
    border-radius: 10px; background: #fbfcfe; color: var(--ink); font: inherit; font-size: 14px;
    transition: border-color .15s, box-shadow .15s, background .15s;
  }
  .login-field input:hover { border-color: #c9d1dd; }
  .login-field input:focus { outline: none; border-color: var(--accent); background: #fff; box-shadow: 0 0 0 4px var(--accent-soft); }
  .field-wrap:focus-within .field-icon { color: var(--accent); }
  .password-wrap input { padding-right: 46px; }
  .password-toggle {
    position: absolute; top: 50%; right: 6px; width: 32px; height: 32px; transform: translateY(-50%);
    border: 0; border-radius: 8px; background: transparent; color: #8b95a7; cursor: pointer; display: grid; place-items: center;
    transition: color .15s, background .15s;
  }
  .password-toggle:hover { color: var(--ink); background: #f1f3f7; }
  .password-toggle svg { width: 18px; height: 18px; }
  .login-btn {
    width: 100%; height: 48px; margin-top: 6px; border: 0; border-radius: 10px;
    background: linear-gradient(155deg, var(--accent), var(--accent-dark));
    color: #fff; font: inherit; font-size: 14.5px; font-weight: 700; cursor: pointer; letter-spacing: -.1px;
    box-shadow: 0 10px 20px -6px rgba(239, 90, 42, .45);
    transition: transform .15s, box-shadow .15s, filter .15s;
  }
  .login-btn:hover { transform: translateY(-1px); box-shadow: 0 14px 24px -6px rgba(239, 90, 42, .5); filter: brightness(1.03); }
  .login-btn:active { transform: translateY(0); }
  .login-btn:disabled { cursor: wait; opacity: .65; transform: none; }
  .login-msg { min-height: 20px; margin: 12px 0 0; color: #d94d24; font-size: 12.5px; text-align: center; }
  .login-foot { margin: 22px 0 0; color: #a4acbb; font-size: 11px; text-align: center; letter-spacing: .3px; }
</style>
</head>
<body>
  <main class="login-shell">
    <div class="login-brand" aria-label="ENERGUARD LAB">
      <div class="login-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3.5v5c0 4.6-3.2 8.6-8 9.5-4.8-.9-8-4.9-8-9.5v-5L12 3Z"/><path d="M9 12l2 2 4-4"/></svg>
      </div>
      <span>ENERGUARD</span><span>LAB</span>
    </div>
    <form class="login-card" id="loginForm">
      <h1 class="login-title">로그인</h1>
      <p class="login-sub">에너가드랩은 내부 업무용 서비스입니다.<br>통합 관리자 계정으로 로그인해 주세요.</p>
      <div class="login-field">
        <label for="loginEmail">아이디</label>
        <div class="field-wrap">
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m3.5 7 8.5 6 8.5-6"/></svg>
          <input type="email" id="loginEmail" autocomplete="username" placeholder="이메일 주소" required autofocus>
        </div>
      </div>
      <div class="login-field">
        <label for="loginPassword">비밀번호</label>
        <div class="field-wrap password-wrap">
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="9" rx="2.5"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          <input type="password" id="loginPassword" autocomplete="current-password" placeholder="비밀번호" required>
          <button type="button" class="password-toggle" id="passwordToggle" aria-label="비밀번호 표시" title="비밀번호 표시">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <button type="submit" class="login-btn" id="loginButton">로그인</button>
      <p class="login-msg" id="loginMessage" role="alert"></p>
    </form>
    <p class="login-foot">ENERGUARD COMPANY INTERNAL SERVICE</p>
  </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://eukwfypbfqojbaihfqye.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_MiBvlf3d6ulcVBsi7Odcgw_PTXSmXKj";
  const authClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
  });

  function redirectTarget() {
    const raw = new URLSearchParams(location.search).get("redirect") || "index.html";
    try {
      const target = new URL(raw, location.href);
      return target.origin === location.origin ? target.href : new URL("index.html", location.href).href;
    } catch (_) {
      return new URL("index.html", location.href).href;
    }
  }

  authClient.auth.getSession().then(({ data }) => {
    if (data.session) location.replace(redirectTarget());
  });

  document.getElementById("passwordToggle").addEventListener("click", function () {
    const input = document.getElementById("loginPassword");
    const visible = input.type === "text";
    input.type = visible ? "password" : "text";
    this.setAttribute("aria-label", visible ? "비밀번호 표시" : "비밀번호 숨기기");
    this.setAttribute("title", visible ? "비밀번호 표시" : "비밀번호 숨기기");
  });

  document.getElementById("loginForm").addEventListener("submit", async function (event) {
    event.preventDefault();
    const button = document.getElementById("loginButton");
    const message = document.getElementById("loginMessage");
    button.disabled = true;
    button.textContent = "확인 중";
    message.textContent = "";

    const { error } = await authClient.auth.signInWithPassword({
      email: document.getElementById("loginEmail").value.trim(),
      password: document.getElementById("loginPassword").value,
    });

    if (error) {
      message.textContent = "아이디 또는 비밀번호를 확인해 주세요.";
      button.disabled = false;
      button.textContent = "로그인";
      return;
    }
    location.replace(redirectTarget());
  });
</script>
</body>
</html>
