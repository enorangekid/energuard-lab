<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 | ENERGUARD LAB</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --bg: #f5f7fa; --card: #fff; --ink: #07111f; --sub: #6b7487;
    --line: #dfe5ed; --dark: #05070b; --accent: #ef5a2a; --accent-dark: #d94d24;
    --font-main: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    color: var(--ink); background: var(--bg); font-family: var(--font-main);
  }
  .login-shell { width: min(100%, 480px); }
  .login-card {
    width: 100%; margin: 0; padding: 64px 48px; background: var(--card);
    border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 14px 34px rgba(15, 23, 42, .08);
  }
  .login-brand {
    margin: 0 0 12px; text-align: center;
    font-family: Consolas, "JetBrains Mono", monospace; font-size: 32px; font-weight: 800;
    letter-spacing: -.5px; color: var(--ink);
  }
  .login-brand span { color: var(--accent); }
  .login-title { margin: 0 0 40px; color: var(--sub); font-size: 15px; font-weight: 500; text-align: center; }
  .login-field { margin-bottom: 14px; }
  .login-field input {
    width: 100%; height: 52px; padding: 0 16px; border: 1px solid var(--line);
    border-radius: 8px; background: #fff; color: var(--ink); font: inherit; font-size: 14.5px;
  }
  .login-field input::placeholder { color: #a3acbd; }
  .login-field input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(239,90,42,.1); }
  .password-wrap { position: relative; }
  .password-wrap input { padding-right: 46px; }
  .password-toggle {
    position: absolute; top: 50%; right: 8px; width: 32px; height: 32px; transform: translateY(-50%);
    border: 0; background: transparent; color: #8b95a7; cursor: pointer; display: grid; place-items: center;
  }
  .password-toggle:hover { color: var(--ink); }
  .password-toggle svg { width: 18px; height: 18px; }
  .login-btn {
    width: 100%; height: 52px; margin-top: 10px; border: 0; border-radius: 8px;
    background: var(--accent); color: #fff; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer;
  }
  .login-btn:hover { background: var(--accent-dark); }
  .login-btn:disabled { cursor: wait; opacity: .65; }
  .login-msg { min-height: 20px; margin: 14px 0 0; color: #d94d24; font-size: 12.5px; text-align: center; }
  .login-foot { margin: 24px 0 0; color: #929bad; font-size: 11.5px; text-align: center; }
</style>
</head>
<body>
  <main class="login-shell">
    <form class="login-card" id="loginForm">
      <h1 class="login-brand" aria-label="ENERGUARD LAB">ENERGUARD<span>.LAB</span></h1>
      <p class="login-title">관리자 로그인</p>
      <div class="login-field">
        <input type="email" id="loginEmail" autocomplete="username" placeholder="이메일" aria-label="이메일" required autofocus>
      </div>
      <div class="login-field">
        <div class="password-wrap">
          <input type="password" id="loginPassword" autocomplete="current-password" placeholder="비밀번호" aria-label="비밀번호" required>
          <button type="button" class="password-toggle" id="passwordToggle" aria-label="비밀번호 표시" title="비밀번호 표시">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <button type="submit" class="login-btn" id="loginButton">로그인</button>
      <p class="login-msg" id="loginMessage" role="alert"></p>
    </form>
    <p class="login-foot">ENERGUARD COMPANY INTERNAL SERVICE</p>
  </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://eukwfypbfqojbaihfqye.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_MiBvlf3d6ulcVBsi7Odcgw_PTXSmXKj";
  const authClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
  });

  function redirectTarget() {
    const raw = new URLSearchParams(location.search).get("redirect") || "index.html";
    try {
      const target = new URL(raw, location.href);
      return target.origin === location.origin ? target.href : new URL("index.html", location.href).href;
    } catch (_) {
      return new URL("index.html", location.href).href;
    }
  }

  authClient.auth.getSession().then(({ data }) => {
    if (data.session) location.replace(redirectTarget());
  });

  document.getElementById("passwordToggle").addEventListener("click", function () {
    const input = document.getElementById("loginPassword");
    const visible = input.type === "text";
    input.type = visible ? "password" : "text";
    this.setAttribute("aria-label", visible ? "비밀번호 표시" : "비밀번호 숨기기");
    this.setAttribute("title", visible ? "비밀번호 표시" : "비밀번호 숨기기");
  });

  document.getElementById("loginForm").addEventListener("submit", async function (event) {
    event.preventDefault();
    const button = document.getElementById("loginButton");
    const message = document.getElementById("loginMessage");
    button.disabled = true;
    button.textContent = "확인 중";
    message.textContent = "";

    const { error } = await authClient.auth.signInWithPassword({
      email: document.getElementById("loginEmail").value.trim(),
      password: document.getElementById("loginPassword").value,
    });

    if (error) {
      message.textContent = "아이디 또는 비밀번호를 확인해 주세요.";
      button.disabled = false;
      button.textContent = "로그인";
      return;
    }
    location.replace(redirectTarget());
  });
</script>
</body>
</html>
