<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>업무노트 — ENERGUARD LAB 관리자</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/moonspam/NanumSquare@2.0/nanumsquare.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Nanum+Myeongjo:wght@400;700;800&display=swap">
<link href="https://cdn.jsdelivr.net/npm/quill@2/dist/quill.snow.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/quill-table-better/dist/quill-table-better.css" rel="stylesheet">
<link rel="stylesheet" href="../common.css?v=20260731c">
<link rel="stylesheet" href="admin.css?v=202607311r">
<style>
  :root {
    --bg: #f8f9fb; --card: #fff; --ink: #07111f; --sub: #5a6378;
    --line: #e8ecf2; --soft-line: #e8ecf2; --dark: #05070b; --dark-tint: #eef0f3;
    --accent: #e85d2f; --accent-dark: #d94d24; --accent-tint: #fdeee7;
  }
</style>
</head>
<body>
<header class="topbar" data-admin-topbar></header>

<main class="app-shell">
  <header class="app-page-head">
    <div class="app-title-tabs" id="noteTitleTabs">
      <button type="button" class="app-title-tab active" data-note-view="general">
        <span class="app-title-text">
          <span class="app-title-label">업무기록</span>
          <span class="app-title-help" title="업무 타임라인/업무 정리 두 가지를 기록합니다. 종류는 왼쪽 드롭박스에서 전환합니다.">?</span>
        </span>
      </button>
      <button type="button" class="app-title-tab" data-note-view="media">
        <span class="app-title-text">
          <span class="app-title-label">미디어 채널</span>
          <span class="app-title-help" title="블로그/유튜브 원고를 작성하고 관리합니다. 채널은 왼쪽 드롭박스에서 전환합니다.">?</span>
        </span>
      </button>
    </div>
  </header>

  <div class="app-filterbar nt-filterbar">
    <div class="store-chips" id="recordViewChips">
      <button type="button" class="store-select" data-action="toggle-record-view-menu" aria-label="업무기록 종류 선택">
        <span id="recordViewLabel">업무 정리</span>
        <span class="store-caret" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </span>
      </button>
      <div class="store-menu" role="menu">
        <button type="button" class="store-chip" data-record-view="timeline" role="menuitem">업무 타임라인</button>
        <button type="button" class="store-chip active" data-record-view="organize" role="menuitem">업무 정리</button>
      </div>
    </div>
    <div class="store-chips" id="mediaChannelChips" hidden>
      <button type="button" class="store-select" data-action="toggle-media-menu" aria-label="미디어 채널 선택">
        <span id="mediaChannelLabel">블로그 원고</span>
        <span class="store-caret" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </span>
      </button>
      <div class="store-menu" role="menu">
        <button type="button" class="store-chip active" data-media-channel="blog" role="menuitem">블로그 원고</button>
        <button type="button" class="store-chip" data-media-channel="youtube" role="menuitem">유튜브 원고</button>
      </div>
    </div>
    <div class="note-controls">
      <span class="note-save-status" id="noteSaveStatus">최신 상태</span>
      <button type="button" class="nt-btn" onclick="insertTodayHeader()">오늘</button>
      <button type="button" class="nt-btn" onclick="printNote()">인쇄</button>
      <button type="button" class="nt-btn" onclick="cancelNoteChanges()">취소</button>
      <button type="button" class="nt-btn btn-primary" onclick="saveNoteManual()">저장</button>
    </div>
  </div>

  <div id="timelineView" hidden>
    <section class="card nt-tl-input-card">
      <div class="nt-tl-input-row">
        <div class="nt-tl-field">
          <label for="tlDate">날짜</label>
          <input type="date" id="tlDate" class="nt-tl-input">
        </div>
        <div class="nt-tl-field">
          <label for="tlCategory">구분</label>
          <select id="tlCategory" class="nt-tl-input" onchange="onTlCategoryChange()">
            <option value="데일리">데일리</option>
            <option value="광고">광고</option>
            <option value="회의">회의</option>
            <option value="상품등록">상품등록</option>
            <option value="상품수정">상품수정</option>
            <option value="디자인">디자인</option>
            <option value="블로그">블로그</option>
            <option value="유튜브">유튜브</option>
            <option value="기타">기타</option>
            <option value="휴무">휴무</option>
          </select>
        </div>
        <div class="nt-tl-field nt-tl-field--wide">
          <label for="tlTask">업무 내용</label>
          <input type="text" id="tlTask" class="nt-tl-input" placeholder="내용을 입력하세요">
        </div>
        <div class="nt-tl-field" id="tlStartField">
          <label>시작</label>
          <div class="nt-tl-time-box">
            <input type="text" id="tlStartH" class="nt-tl-time-part" maxlength="2" placeholder="00">
            <span>:</span>
            <input type="text" id="tlStartM" class="nt-tl-time-part" maxlength="2" placeholder="00">
          </div>
        </div>
        <div class="nt-tl-field" id="tlEndField">
          <label>끝</label>
          <div class="nt-tl-time-box">
            <input type="text" id="tlEndH" class="nt-tl-time-part" maxlength="2" placeholder="00">
            <span>:</span>
            <input type="text" id="tlEndM" class="nt-tl-time-part" maxlength="2" placeholder="00">
          </div>
        </div>
        <button type="button" class="nt-btn btn-primary" id="tlAddBtn" onclick="addTimeLog()">+ 등록</button>
      </div>
      <div class="nt-tl-editing-msg" id="tlEditingMsg" style="display:none;">
        📝 기존 항목 수정 중...
        <button type="button" class="nt-tl-cancel-edit" onclick="cancelTimeLogEdit()">취소</button>
      </div>
    </section>

    <section class="card nt-month-card" id="timelineMonthCard">
      <div class="month-quick-row">
        <select class="month-quick-year" id="timelineMonthYear"></select>
        <div class="month-quick-grid" id="timelineMonthQuick"></div>
      </div>
    </section>

    <div class="note-container">
      <div class="nt-search-bar">
        <input type="text" id="tlSearchInput" placeholder="업무/구분 검색..." oninput="renderTimeLogList()">
      </div>
      <div class="nt-body">
        <table class="nt-table nt-tl-table">
          <thead>
            <tr><th width="90">구분</th><th class="text-left">업무</th><th width="70">시작</th><th width="70">끝</th><th width="90">소요시간</th><th width="80">관리</th></tr>
          </thead>
          <tbody id="timelineListBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <section class="card nt-month-card" id="noteMonthCard">
    <input type="month" id="noteMonthPicker" onchange="handleNoteMonthChange()" hidden>
    <div class="month-quick-row">
      <select class="month-quick-year" id="noteMonthYear"></select>
      <div class="month-quick-grid" id="noteMonthQuick"></div>
    </div>
  </section>

  <div class="note-container" id="organizeContainer">
    <div class="nt-search-bar">
      <input type="text" id="noteSearchInput" placeholder="제목/내용 검색..." oninput="searchNotes()">
      <div class="note-search-results" id="noteSearchResults"></div>
    </div>

    <div class="nt-body">
      <div id="draftListContainer" style="display:none;">
        <div class="list-toolbar">
          <button type="button" class="nt-btn btn-primary" onclick="createNewDraft()">+ 새 원고 작성</button>
        </div>
        <table class="nt-table">
          <thead><tr><th>작성일</th><th class="text-left">제목</th><th>상태</th><th>최근저장</th></tr></thead>
          <tbody id="draftListBody"></tbody>
        </table>
      </div>

      <div id="draftMetadataArea" class="draft-meta-area" style="display:none;">
        <button type="button" class="back-to-list-btn" onclick="backToList()">← 목록</button>
        <input type="text" id="draftTitle" placeholder="제목을 입력하세요">
        <input type="date" id="noteDate">
        <select id="draftStatus">
          <option value="saving">작성중</option>
          <option value="uploaded">업로드 완료</option>
        </select>
        <button type="button" class="nt-btn" id="aiSuggestBtn" onclick="runAiSuggest()">✨ AI 추천</button>
      </div>

      <div id="editor-wrapper">
        <div id="nt-toolbar" class="ql-toolbar ql-snow nt-toolbar">
          <span class="ql-formats nt-tool-group nt-tool-group--selects">
            <div class="store-chips nt-select-chips" id="wnFontChips">
              <button type="button" class="store-select" data-action="toggle-wn-font-menu" aria-label="글꼴 선택">
                <span id="wnFontLabel">나눔스퀘어</span>
                <span class="store-caret" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                </span>
              </button>
              <div class="store-menu" role="menu">
                <button type="button" class="store-chip active" data-wn-font="nanum-square" role="menuitem">나눔스퀘어</button>
                <button type="button" class="store-chip" data-wn-font="nanum-myeongjo" role="menuitem">나눔명조</button>
                <button type="button" class="store-chip" data-wn-font="gowun-dodum" role="menuitem">고운돋움</button>
              </div>
            </div>
            <div class="store-chips nt-select-chips nt-select-chips--size" id="wnSizeChips">
              <button type="button" class="store-select" data-action="toggle-wn-size-menu" aria-label="글자 크기 선택">
                <span id="wnSizeLabel">15</span>
                <span class="store-caret" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                </span>
              </button>
              <div class="store-menu" role="menu">
                <button type="button" class="store-chip" data-wn-size="14px" role="menuitem">14</button>
                <button type="button" class="store-chip active" data-wn-size="15px" role="menuitem">15</button>
                <button type="button" class="store-chip" data-wn-size="16px" role="menuitem">16</button>
                <button type="button" class="store-chip" data-wn-size="18px" role="menuitem">18</button>
              </div>
            </div>
          </span>
          <span class="nt-toolbar-divider"></span>
          <span class="ql-formats nt-tool-group">
            <button class="ql-bold nt-tb-btn nt-format-btn" type="button" title="굵게" data-label="굵게" data-icon="bold"></button>
            <button class="ql-italic nt-tb-btn nt-format-btn" type="button" title="기울임" data-label="기울임" data-icon="italic"></button>
            <button class="ql-underline nt-tb-btn nt-format-btn" type="button" title="밑줄" data-label="밑줄" data-icon="underline"></button>
            <button class="ql-strike nt-tb-btn nt-format-btn" type="button" title="취소선" data-label="취소선" data-icon="strike"></button>
            <span class="nt-picker-tool">
              <select class="ql-color" title="글자색"></select>
            </span>
            <span class="nt-picker-tool">
              <select class="ql-background" title="배경색"></select>
            </span>
          </span>
          <span class="nt-toolbar-divider"></span>
          <span class="ql-formats nt-tool-group">
            <button class="ql-list nt-tb-btn nt-format-btn" type="button" value="ordered" title="번호 목록" data-label="번호" data-icon="ordered-list"></button>
            <button class="ql-list nt-tb-btn nt-format-btn" type="button" value="bullet" title="글머리 목록" data-label="목록" data-icon="bullet-list"></button>
            <button class="ql-blockquote nt-tb-btn" type="button" title="인용구" data-label="인용구">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 10H5a4 4 0 0 1 4-4"/><path d="M19 10h-4a4 4 0 0 1 4-4"/><path d="M5 10v7h6v-7"/><path d="M15 10v7h6v-7"/></svg>
              <span class="nt-tb-label">인용구</span>
            </button>
            <button class="ql-divider nt-tb-btn" type="button" title="구분선" data-label="구분선">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16"/></svg>
              <span class="nt-tb-label">구분선</span>
            </button>
            <button class="ql-image nt-tb-btn nt-tb-accent" type="button" title="사진" data-label="사진">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.8"/><path d="M21 16l-4.2-4.2a2 2 0 0 0-2.8 0L8 18"/></svg>
              <span class="nt-tb-label">사진</span>
            </button>
            <button class="ql-table-insert nt-tb-btn" type="button" title="표" data-label="표">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16M4 15h16M10 4v16M15 4v16"/></svg>
              <span class="nt-tb-label">표</span>
            </button>
          </span>
          <span class="nt-toolbar-divider"></span>
          <span class="ql-formats nt-tool-group">
            <button class="ql-clean nt-tb-btn nt-format-btn" type="button" title="초기화" data-label="초기화" data-icon="clean"></button>
          </span>
        </div>
        <div id="editor"></div>
        <div id="aiSuggestResult" style="display:none;"></div>
      </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="admin-common.js?v=20260731c"></script>
<script src="https://cdn.jsdelivr.net/npm/quill@2/dist/quill.js"></script>
<script src="https://cdn.jsdelivr.net/npm/quill-table-better/dist/quill-table-better.js"></script>
<script src="work-notes.js?v=20260731v"></script>
<script src="../common.js?v=20260731b"></script>
<script>
(async () => {
  const session = await requireAdminSession();
  if (!session) return;
  initWorkNotesPage();
})();
</script>
</body>
</html>
