<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
  location.replace("../login.html?redirect=admin/work-notes.html");
</script>
<title>관리자 로그인 — ENERGUARD LAB</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --bg: #f8f9fb; --card: #fff; --ink: #07111f; --sub: #5a6378;
    --line: #e8ecf2; --soft-line: #e8ecf2; --dark: #05070b; --dark-tint: #eef0f3;
    --accent: #e85d2f; --accent-dark: #d94d24; --accent-tint: #fdeee7;
    --font-main: "Pretendard Variable", Pretendard, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--dark); font-family: var(--font-main);
  }
  .login-card {
    width: 340px; background: var(--card); border-radius: 16px; padding: 36px 32px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
  }
  .login-logo { font-family: Consolas, "Liberation Mono", monospace; font-weight: 700; font-size: 18px; color: var(--ink); margin-bottom: 4px; }
  .login-sub { font-size: 13px; color: var(--sub); margin: 0 0 24px; }
  .login-field { margin-bottom: 14px; }
  .login-field label { display: block; font-size: 12px; font-weight: 600; color: var(--sub); margin-bottom: 6px; }
  .login-field input {
    width: 100%; height: 42px; padding: 0 14px; border: 1.5px solid var(--line); border-radius: 8px;
    font-size: 14px; font-family: inherit; color: var(--ink);
  }
  .login-field input:focus { outline: none; border-color: var(--accent); }
  .login-btn {
    width: 100%; height: 44px; margin-top: 8px; border: none; border-radius: 8px;
    background: var(--accent); color: #fff; font-size: 14px; font-weight: 700; cursor: pointer;
  }
  .login-btn:hover { background: var(--accent-dark); }
  .login-btn:disabled { opacity: 0.6; cursor: default; }
  .login-msg { min-height: 18px; margin-top: 12px; font-size: 12.5px; color: #d94d24; text-align: center; }
  .login-back { display: block; text-align: center; margin-top: 18px; font-size: 12.5px; color: var(--sub); text-decoration: none; }
  .login-back:hover { color: var(--ink); }
</style>
</head>
<body>
  <form class="login-card" id="loginForm">
    <div class="login-logo">ENERGUARD LAB</div>
    <p class="login-sub">관리자 전용 — 로그인이 필요합니다</p>
    <div class="login-field">
      <label for="loginEmail">이메일</label>
      <input type="email" id="loginEmail" autocomplete="username" required>
    </div>
    <div class="login-field">
      <label for="loginPass">비밀번호</label>
      <input type="password" id="loginPass" autocomplete="current-password" required>
    </div>
    <button type="submit" class="login-btn" id="loginBtn">로그인</button>
    <p class="login-msg" id="loginMsg"></p>
    <a href="../index.html" class="login-back">← 메인으로 돌아가기</a>
  </form>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="admin-common.js?v=20260731a"></script>
<script>
(async () => {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session) {
    const params = new URLSearchParams(location.search);
    location.replace(params.get("redirect") || "work-notes.html");
  }
})();

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("loginBtn");
  const msg = document.getElementById("loginMsg");
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPass").value;
  btn.disabled = true; btn.textContent = "확인 중...";
  msg.textContent = "";

  const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

  if (error) {
    msg.textContent = "이메일 또는 비밀번호가 올바르지 않습니다.";
    btn.disabled = false; btn.textContent = "로그인";
    return;
  }
  const params = new URLSearchParams(location.search);
  location.replace(params.get("redirect") || "work-notes.html");
});
</script>
</body>
</html>
